    yrSel[y] = k;
    const i = Math.round((parse(k) - parse(g.start)) / dayMs),
      ring = el.querySelector(".yh");
    ring.setAttribute("x", (g.L + Math.floor(i / 7) * g.st - 1).toFixed(1));
    ring.setAttribute("y", (g.T + (i % 7) * g.st - 1).toFixed(1));
    const d = parse(k),
      x = yrs.info[k];
    let t;
    if (k > todayKey) t = "Ainda não chegou.";
    else if (k < yrs.first) t = "Antes do app.";
    else if (!x)
      t =
        k === todayKey
          ? "Ainda sem treino."
          : HOLIDAYS[k]
            ? `Sem treino. Feriado: ${HOLIDAYS[k]}.`
            : "Sem treino.";
    else {
      const p = [];
      if (x.w)
        p.push(
          (x.w === "Outro" ? "Outro treino" : x.w) +
            (x.kg > 0 ? `: ${nfmt(Math.round(x.kg))} kg levantados` : "") +
            ".",
        );
      if (x.run) p.push(x.run.km ? `Corrida de ${kmShort(x.run.km)} km.` : "Corrida.");
      t = p.join(" ");
    }
    el.querySelector(".yr-d").innerHTML =
      `<b>${k === todayKey ? "Hoje" : WDFULL[d.getDay()]}, ${fmtD(k)}</b><span>${esc(t)}</span>`;
  }
  function yrAt(e) {
    const svg = e.target.closest && e.target.closest(".yr-y svg");
    if (!svg || !yrs) return;
    const y = +svg.parentNode.dataset.y,
      g = yrs.g[y];
    if (!g) return;
    const box = svg.getBoundingClientRect(),
      sc = g.W / box.width,
      c = Math.max(0, Math.min(g.cols - 1, Math.floor(((e.clientX - box.left) * sc - g.L) / g.st))),
      r = Math.max(0, Math.min(6, Math.floor(((e.clientY - box.top) * sc - g.T) / g.st)));
    yrPick(y, addD(g.start, c * 7 + r));
  }

  // ---------- backup (app instalado: os dados ficam só neste celular) ----------
  let bkMsg = "";
  function backupHTML() {
    let at = "";
    try {
      at = localStorage.getItem("treinos-backup-em") || "";
    } catch (e) {}
    const when = /^\d{4}-\d{2}-\d{2}$/.test(at) ? `Último backup: ${fmtD(at)}.` : "Ainda não tem backup.";
    return `<h2>Backup</h2><section class="bk"><p class="note">Os dados do app ficam só neste celular. ${when} Exporta de vez em quando e guarda o arquivo, pra não perder nada se trocar de celular.</p><div class="bk-b"><button class="bk-btn" data-act="export">Exportar backup</button><label class="bk-btn">Importar backup<input type="file" accept=".json,application/json" data-bk="import"></label></div>${bkMsg ? `<p class="bk-m" role="status">${esc(bkMsg)}</p>` : ""}</section>`;
  }
  function exportBackup() {
    commitKgDrafts();
    localWrite();
    const name = `treinos-backup-${todayKey}.json`;
    const body = JSON.stringify({
      app: "treinos-ate-o-verao",
      versao: 1,
      exportado: new Date().toISOString(),
      dados: snapshot(),
    });
    const done = () => {
      try {
        localStorage.setItem("treinos-backup-em", todayKey);
      } catch (e) {}
      bkMsg = "Backup exportado. Guarda o arquivo num lugar seguro (Drive, e-mail, WhatsApp pra ti mesmo).";
      render();
    };
    let file = null;
    try {
      file = new File([body], name, { type: "application/json" });
    } catch (e) {}
    // no celular abre o menu de compartilhar (salvar em Arquivos, mandar no WhatsApp...); no computador, baixa
    const touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (file && touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator
        .share({ files: [file], title: "Backup dos treinos" })
        .then(done)
        .catch((e) => {
          if (!e || e.name !== "AbortError") download();
        });
      return;
    }
    download();
    function download() {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([body], { type: "application/json" }));
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      done();
    }
  }
  function importBackup(file) {
    const r = new FileReader();
    r.onload = () => {
      let src = null;
      try {
        const j = JSON.parse(String(r.result));
        src = isObj(j) ? (isObj(j.dados) ? j.dados : isObj(j.data) ? j.data : j) : null;
      } catch (e) {}
      if (!src || !KEYS.some((k) => isObj(src[k]))) {
        bkMsg = "Esse arquivo não é um backup do app.";
        render();
        return;
      }
      // app vazio: entra o backup inteiro. Com dados: entra só o que falta aqui, sem apagar nada.
      const empty = !["logs", "runs", "loads", "weight"].some((k) => Object.keys(state[k]).length);
      if (empty)
        KEYS.forEach((k) => {
          if (isObj(src[k])) state[k] = src[k];
        });
      else mergeAdds(src);
      // nível e conquistas que já vieram no backup não comemoram de novo
      try {
        localStorage.setItem("treinos-lvl", String(levelInfo(stats()).n));
        localStorage.setItem("treinos-secret", JSON.stringify(unlockedSecrets().map((x) => x.id)));
        localStorage.setItem("treinos-backup-em", todayKey); // o arquivo importado já é um backup
        sessionStorage.setItem("treinos-import", String(Object.keys(state.logs).length));
      } catch (e) {}
      localWrite();
      location.reload();
    };
    r.readAsText(file);
  }

  function runsHTML() {
    const ks = Object.keys(state.runs).sort();

      return (
        html +
        `<p class="note" style="margin:0">Nenhuma corrida ainda. Marca "+ Corri hoje" e coloca a distância.</p></section>`
      );
    const totKm = det.reduce((a, k) => a + state.runs[k].km, 0);
    const bestKm = det.reduce((a, k) => Math.max(a, state.runs[k].km), 0);
    html += `<div class="top"><div><b>${ks.length}</b><span>corridas</span></div>
      <div><b>${totKm.toFixed(1).replace(".", ",")}</b><span>km no total</span></div>
      <div><b>${bestKm.toFixed(2).replace(".", ",")}</b><span>km recorde</span></div></div>`;
    const cd = det.slice(-12);
    if (cd.length > 1) {

      const W = 320,
        H = 150,
        pb = 22,
        pt = 18,
        bw = Math.min(40, (W - 10) / cd.length - 8);

      html += `<svg class="rchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distância das últimas corridas">`;
      cd.forEach((k, i) => {
        const r = state.runs[k],
          h = Math.max(4, (r.km / cmax) * (H - pb - pt));
        const x = gap + i * (bw + gap),
          y = H - pb - h,

    return html;

  // ---------- desafios ----------
  const WCH_START = "2026-09-28";

    { t: "Corre 3 vezes esta semana", f: (w) => w.rn, goal: 3, u: "corridas" },
    { t: "Fecha a semana em 5/5", f: (w) => Math.min(w.all, 5), goal: 5, u: "treinos" },
    { t: "Soma 5 km correndo", f: (w) => w.km, goal: 5, u: "km", dec: true },

    { t: "Treina e corre no mesmo dia 2 vezes", f: (w) => w.both, goal: 2, u: "dias" },
  ];
  function weekStats(mon) {
    const o = { wd: 0, all: 0, rn: 0, km: 0, maxMin: 0, both: 0 };
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      const k = key(d),
        r = state.runs[k];
      if (state.logs[k] && i < 5) o.wd++;
      if (state.logs[k]) o.all++;
      if (r) {
        o.rn++;
        if (r.km) o.km += r.km;
        if (r.min) o.maxMin = Math.max(o.maxMin, r.min);
      }
      if (r && state.logs[k]) o.both++;
    }
    return o;
  }
  const weekIdx = (mon) => Math.round((mon - parse(WCH_START)) / (7 * dayMs));
  function weekChal(mon) {
    const i = weekIdx(mon);
    return WCH[((i % WCH.length) + WCH.length) % WCH.length];
  }
  function weeklyDoneCount() {
    let n = 0;
    const w = parse(WCH_START);
    const cur = monday(today);
    while (w <= cur) {
      const c = weekChal(w);
      if (c.f(weekStats(w)) >= c.goal) n++;
      w.setDate(w.getDate() + 7);
    }
    return n;
  }

  // ---------- retrospectivas: o verão inteiro e cada mês ----------
  // Um motor só (recap) tira os números de qualquer período. A retrospectiva vira uma sequência de
  // histórias em tela cheia, no estilo das retrospectivas de fim de ano dos apps de música: toque
  // pra avançar, segure pra pausar, setas no teclado. Antes de 21/12 o verão sai como prévia.
  const MESES = [
    "janeiro",
    "fevereiro",
    "março",
    "abril",
    "maio",
    "junho",
    "julho",
    "agosto",
    "setembro",
    "outubro",
    "novembro",
    "dezembro",
  ];
  const up1 = (x) => x.charAt(0).toUpperCase() + x.slice(1);
  // número no jeito brasileiro: 1.240 e 23,4
  function nfmt(v, dec) {
    const p = Math.abs(v)
      .toFixed(dec || 0)
      .split(".");
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (v < 0 ? "−" : "") + p.join(",");
  }
  const kg1 = (v) => String(Math.round(v * 10) / 10).replace(".", ",");
  const kmDec = (v) => (Math.round(v * 10) % 10 === 0 ? 0 : 1); // 61 km, 23,4 km
  const sOf = (n, one, many) => (n === 1 ? one : many);
  const addD = (k, n) => {
    const d = parse(k);
    d.setDate(d.getDate() + n);
    return key(d);
  };
  const repsOf = (spec) => parseInt(String(spec).split("x")[1], 10) || 10;
  const wdName = (i) => WDFULL[(i + 1) % 7]; // 0 = segunda
  const planSets = (w) => (planOf(w) || []).reduce((a, e) => a + setsOf(e[1]), 0);
  // peso de um exercício num dia: o anotado no dia, senão o último antes, senão o primeiro depois
  function loadNear(lk, k) {
    const hs = loadHist(lk);
    let v = hs.length ? hs[0].kg : 0;
    for (const x of hs) {
      if (x.d > k) break;
      v = x.kg;
    }
    return v;
  }

  function recapRange(id) {
    if (id === "verao") return { id, from: START, to: SUMMER, title: "Verão 2026", season: true };
    const [y, m] = id.split("-").map(Number);
    const first = key(new Date(y, m - 1, 1));
    return {
      id,
      from: first < START ? START : first,
      to: key(new Date(y, m, 0)),
      title: up1(MESES[m - 1]),
      mes: MESES[m - 1],
      y,
      m: m - 1,
      season: false,
    };
  }
  // meses que já começaram, desde o começo do app
  function recapMonths() {
    const out = [],
      s = parse(START),
      d = new Date(s.getFullYear(), s.getMonth(), 1);
    while (key(d) <= todayKey) {
      out.push(key(d).slice(0, 7));
      d.setMonth(d.getMonth() + 1);
    }
    return out;
  }
  const logsIn = (from, to) => Object.keys(state.logs).filter((k) => k >= from && k <= to).length;

  // Os números de um período (até hoje, se ele ainda não acabou).
  function recap(from, to) {
    const end = to < todayKey ? to : todayKey;
    const r = {
      from,
      to,
      end,
      partial: to > todayKey,
      work: 0,
      total: 0,
      onWork: 0,
      extra: 0,
      types: {},
      wd: [0, 0, 0, 0, 0, 0, 0],
      hours: [],
      sets: 0,
      legacy: 0,
      muscles: {},
      kg: 0,
      best: { n: 0, from: null, to: null },
    };
    MUSCLES.forEach((m) => (r.muscles[m] = 0));
    let run = 0,
      runFrom = null;
    for (let k = from; k <= end; k = addD(k, 1)) {
      const d = parse(k),
        off = isOff(d),
        w = state.logs[k];
      if (!off && (w || k !== todayKey)) r.work++; // hoje só conta depois de treinar
      if (!w) {
        if (!off && k !== todayKey) run = 0;
        continue;
      }
      r.total++;
      if (off) r.extra++;
      else r.onWork++;
      r.types[w] = (r.types[w] || 0) + 1;
      r.wd[(d.getDay() + 6) % 7]++;
      if (typeof state.hr[k] === "number") r.hours.push(state.hr[k]);
      const plan = planOf(w, k);
      if (plan) {
        plan.forEach(([, sp, g]) => {
          const s = setsOf(sp);
          r.sets += s;
          r.muscles[muscleOf(g)] += s;
        });
        r.kg += dayKg(k);
      } else if (w !== "Outro" && w !== "Surf") r.legacy++; // treino de um plano antigo
      if (!run) runFrom = k;
      run++;
      if (run >= r.best.n) r.best = { n: run, from: runFrom, to: k };
    }
    // treinos de planos antigos entram com as séries de um treino médio do plano atual
    const avg = Math.round(SPLIT_DAYS.reduce((a, i) => a + planSets(SPLIT[i]), 0) / SPLIT_DAYS.length);
    r.setsAll = r.sets + r.legacy * avg;
    r.pct = r.work ? Math.min(100, Math.round((r.onWork / r.work) * 100)) : 0;
    r.top = Object.keys(r.types)
      .filter((w) => w !== "Outro")
      .sort((a, b) => r.types[b] - r.types[a] || (a < b ? -1 : 1));
    r.mus = MUSCLES.filter((m) => r.muscles[m] > 0).sort((a, b) => r.muscles[b] - r.muscles[a]);
    r.hb = [0, 0, 0]; // manhã, tarde, noite
    r.hours.forEach((h) => r.hb[h < 12 ? 0 : h < 18 ? 1 : 2]++);

    // semanas (segunda a domingo), contando só os dias do período
    r.weeks = [];
    for (const w = monday(parse(from)); key(w) <= end; w.setDate(w.getDate() + 7)) {
      let n = 0;
      for (let i = 0; i < 7; i++) {
        const d = new Date(w);
        d.setDate(w.getDate() + i);
        const k = key(d);
        if (k >= from && k <= end && state.logs[k]) n++;
      }
      r.weeks.push({ mon: key(w), n });
    }
    r.full = r.weeks.filter((x) => x.n >= 5).length;
    r.bestWeek = r.weeks.reduce((a, x) => (x.n > 0 && x.n >= a.n ? x : a), { n: 0, mon: null });

    // corridas
    r.runs = Object.keys(state.runs)
      .filter((k) => k >= from && k <= end && state.runs[k])
      .sort();
    r.km = 0;
    r.longest = null;
    r.pace = null;
    r.runPts = [];
    r.runs.forEach((k) => {
      const x = state.runs[k];
      if (!x || !x.km) return;
      r.km += x.km;
      r.runPts.push({ k, km: x.km });
      if (!r.longest || x.km >= r.longest.km) r.longest = { k, km: x.km };
      if (x.min && x.km >= 1 && (!r.pace || x.min / x.km < r.pace.p)) r.pace = { k, p: x.min / x.km };
    });

    // peso do corpo: do último antes do período (ou do primeiro dentro dele) até o último dentro
    const wk = Object.keys(state.weight).sort(),
      inW = wk.filter((k) => k >= from && k <= end),
      prevW = wk.filter((k) => k < from);
    if (inW.length) {
      const ks = (prevW.length ? [prevW[prevW.length - 1]] : []).concat(inW);
      r.weight = {
        a: state.weight[ks[0]],
        b: state.weight[ks[ks.length - 1]],
        n: inW.length,
        pts: ks.map((k) => ({ k, v: state.weight[k] })),
      };
    }

    // cargas que subiram: do último registro antes do período (ou do primeiro dentro) até o último
    r.ups = [];
    Object.keys(state.loads).forEach((lk) => {
      if (!isKg(lk) || /leve\)$/.test(lk)) return; // treino leve é leve de propósito
      const hs = loadHist(lk),
        inR = hs.filter((x) => x.d >= from && x.d <= end);
      if (!inR.length) return;
      const prev = hs.filter((x) => x.d < from),
        pts = (prev.length ? [prev[prev.length - 1]] : []).concat(inR);
      const a = pts[0].kg,
        b = pts[pts.length - 1].kg;
      if (b > a) r.ups.push({ lk, a, b, diff: b - a, pct: (b / a - 1) * 100, pts });
    });
    r.ups.sort((x, y) => y.diff - x.diff || y.pct - x.pct);

    // barra fixa: o melhor do período e o primeiro registro de todos
    r.bar = {};
    [HANG, NEG].forEach((n) => {
      const hs = loadHist(n),
        inR = hs.filter((x) => x.d >= from && x.d <= end);
      if (!inR.length) return;
      const best = Math.max(...inR.map((x) => x.kg));
      r.bar[n] = { first: hs[0].kg, best, goal: BAR_GOALS[n], ok: best >= BAR_GOALS[n] };
    });
    return r;
  }

  // Perfil de treino, pelo que mais marcou o período.
  function persona(r) {
    const h = r.hours.length,
      night = h ? r.hb[2] / h : 0,
      morn = h ? r.hb[0] / h : 0;
    const P = [
      [r.work >= 10 && r.pct >= 90, "Constante", `Faltou quase nunca: foi em ${r.pct}% dos dias úteis.`],
      [r.runs.length >= 15, "Corredor", `Academia e corrida, sem escolher um só: ${r.runs.length} corridas.`],
      [
        r.ups.length >= 6,
        "Construtor",
        `Peso parado não é com você: subiu a carga em ${r.ups.length} exercícios.`,
      ],
      [
        r.extra >= 6,
        "Sem folga",
        `Fim de semana e feriado também valem: ${r.extra} treinos fora dos dias úteis.`,
      ],
      [
        h >= 6 && night >= 0.6,
        "Coruja",
        `Treino bom é de noite: ${r.hb[2]} de ${h} marcados depois das 18h.`,
      ],
      [
        h >= 6 && morn >= 0.6,
        "Madrugador",
        `Treina antes do mundo acordar: ${r.hb[0]} de ${h} marcados antes do meio-dia.`,
      ],
      [r.work >= 10 && r.pct >= 70, "Constante", `Em ${r.pct}% dos dias úteis, você foi treinar.`],
      [true, "Persistente", `Nem toda semana foi perfeita, mas você voltou toda vez: ${r.total} treinos.`],
    ];
    const p = P.find((x) => x[0]);
    const chips = [`${r.total} treinos`];
    if (r.work) chips.push(`${r.pct}% dos dias úteis`);
    if (r.km > 0) chips.push(`${nfmt(r.km, kmDec(r.km))} km`);
    if (r.ups.length) chips.push(`carga maior em ${r.ups.length}`);
    if (r.extra) chips.push(`${r.extra} ${sOf(r.extra, "extra", "extras")}`);
    return { t: p[1], d: p[2], chips: chips.slice(0, 4) };
  }

  // ---- desenhos das histórias (na cor do texto do slide) ----
  const f1x = (v) => v.toFixed(1);
  const SUN_RAYS = Array.from({ length: 12 }, (_, j) => {
    const a = (j * Math.PI) / 6,
      c = Math.cos(a),
      s = Math.sin(a);
    return `<line x1="${f1x(60 + c * 37)}" y1="${f1x(60 + s * 37)}" x2="${f1x(60 + c * 51)}" y2="${f1x(60 + s * 51)}"/>`;
  }).join("");
  const SUNSVG = `<svg class="wr-sun" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="25" fill="currentColor"/><g stroke="currentColor" stroke-width="6" stroke-linecap="round">${SUN_RAYS}</g></svg>`;
  // barra com só o topo arredondado (a base fica no eixo)
  function barTop(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    return `M${f1x(x)} ${f1x(y + h)}V${f1x(y + r)}Q${f1x(x)} ${f1x(y)} ${f1x(x + r)} ${f1x(y)}H${f1x(x + w - r)}Q${f1x(x + w)} ${f1x(y)} ${f1x(x + w)} ${f1x(y + r)}V${f1x(y + h)}Z`;
  }
  // o verão inteiro, uma coluna por semana (como o calendário de contribuições)
  function heatSeason(r) {
    const m0 = monday(parse(r.from)),
      nW = Math.round((monday(parse(r.to)) - m0) / (7 * dayMs)) + 1;
    const W = 320,
      gap = 3,
      c = Math.min(20, (W - gap * (nW - 1)) / nW),
      T = 18;
    let g = "",
      lastLab = -9;
    for (let w = 0; w < nW; w++)
      for (let j = 0; j < 7; j++) {
        const d = new Date(m0);
        d.setDate(m0.getDate() + w * 7 + j);
        const k = key(d);
        if (k < r.from || k > r.to) continue;
        const x = w * (c + gap),
          y = T + j * (c + gap);
        if ((d.getDate() === 1 || k === r.from) && w - lastLab >= 2) {
          g += `<text x="${f1x(x)}" y="11">${MESES[d.getMonth()].slice(0, 3)}</text>`;
          lastLab = w;
        }
        const cls = k > r.end ? "fu" : state.logs[k] ? "on" : isOff(d) ? "of" : "no";
        g +=
          cls === "of"
            ? `<rect class="of" x="${f1x(x + 0.75)}" y="${f1x(y + 0.75)}" width="${f1x(c - 1.5)}" height="${f1x(c - 1.5)}" rx="3"/>`
            : `<rect class="${cls}" x="${f1x(x)}" y="${f1x(y)}" width="${f1x(c)}" height="${f1x(c)}" rx="3" style="--d:${w * 45}ms"/>`;
        if (k === todayKey && r.partial)
          g += `<rect class="td" x="${f1x(x - 1.5)}" y="${f1x(y - 1.5)}" width="${f1x(c + 3)}" height="${f1x(c + 3)}" rx="4"/>`;
      }
    const H = T + 7 * c + 6 * gap;
    return `<svg class="wr-heat" viewBox="0 0 ${W} ${f1x(H)}" role="img" aria-label="Calendário do verão: ${r.total} ${sOf(r.total, "dia", "dias")} com treino">${g}</svg>`;
  }
  // um mês, como no calendário: colunas de segunda a domingo
  function heatMonth(R, r) {
    const n = new Date(R.y, R.m + 1, 0).getDate(),
      lead = (new Date(R.y, R.m, 1).getDay() + 6) % 7,
      rows = Math.ceil((lead + n) / 7);
    const W = 320,
      gap = 5,
      c = Math.min(34, (W - 6 * gap) / 7),
      T = 20,
      x0 = (W - (7 * c + 6 * gap)) / 2;
    let g = "STQQSSD"
      .split("")
      .map(
        (l, j) =>
          `<text class="h" x="${f1x(x0 + j * (c + gap) + c / 2)}" y="12" text-anchor="middle">${l}</text>`,
      )
      .join("");
    for (let i = 0; i < n; i++) {
      const d = new Date(R.y, R.m, i + 1),
        k = key(d),
        p = lead + i;
      const x = x0 + (p % 7) * (c + gap),
        y = T + Math.floor(p / 7) * (c + gap);
      const cls = k < R.from || k > r.end ? "fu" : state.logs[k] ? "on" : isOff(d) ? "of" : "no";
      g +=
        cls === "of"
          ? `<rect class="of" x="${f1x(x + 0.75)}" y="${f1x(y + 0.75)}" width="${f1x(c - 1.5)}" height="${f1x(c - 1.5)}" rx="4"/>`
          : `<rect class="${cls}" x="${f1x(x)}" y="${f1x(y)}" width="${f1x(c)}" height="${f1x(c)}" rx="4" style="--d:${Math.floor(p / 7) * 60}ms"/>`;
      if (k === todayKey && r.partial)
        g += `<rect class="td" x="${f1x(x - 1.5)}" y="${f1x(y - 1.5)}" width="${f1x(c + 3)}" height="${f1x(c + 3)}" rx="5"/>`;
      g += `<text class="n${cls === "on" ? " on" : ""}" x="${f1x(x + 5)}" y="${f1x(y + 13)}">${i + 1}</text>`;
    }
    const H = T + rows * c + (rows - 1) * gap;
    return `<svg class="wr-heat" viewBox="0 0 ${W} ${f1x(H)}" role="img" aria-label="Calendário de ${R.mes}: ${r.total} ${sOf(r.total, "dia", "dias")} com treino">${g}</svg>`;
  }
  // barras deitadas: nome e valor em cima, barra embaixo; a maior em cor cheia
  function barsHTML(rows, fmt) {
    const mx = Math.max(1, ...rows.map((x) => x[1]));
    return `<ul class="wr-bars">${rows
      .map(
        ([l, v], j) =>
          `<li class="${j ? "" : "top"}"><span>${esc(l)}</span><b>${fmt ? fmt(v) : nfmt(v)}</b><i style="--w:${((v / mx) * 100).toFixed(1)}%;--d:${j * 70}ms"></i></li>`,
      )
      .join("")}</ul>`;
  }
  function wdBars(r) {
    const mx = Math.max(1, ...r.wd);
    const lab = r.wd.map((v, j) => `${wdName(j).toLowerCase()} ${v}`).join(", ");
    return `<div class="wr-cols" role="img" aria-label="Treinos por dia da semana: ${lab}">${r.wd
      .map(
        (v, j) =>
          `<div class="${v === mx ? "top" : ""}"><b>${v || ""}</b><em>${v ? `<i style="--h:${((v / mx) * 100).toFixed(1)}%;--d:${j * 60}ms"></i>` : ""}</em><span>${"STQQSSD"[j]}</span></div>`,
      )
      .join("")}</div>`;
  }
  // linha de evolução: o primeiro valor à esquerda do primeiro ponto e o último à direita do último,
  // longe da linha; as datas embaixo
  function sparkSVG(pts, unit) {
    const W = 320,
      H = 124,
      L = 46,
      Rr = 70,
      T = 12,
      B = 26;
    const vs = pts.map((p) => p.v);
    let lo = Math.min(...vs),
      hi = Math.max(...vs);
    if (hi - lo < 1) {
      lo -= 0.5;
      hi += 0.5;
    }
    const t0 = parse(pts[0].k).getTime(),
      t1 = parse(pts[pts.length - 1].k).getTime();
    const X = (k) => L + ((parse(k).getTime() - t0) / (t1 - t0 || 1)) * (W - L - Rr);
    const Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const P = pts.map((p) => [X(p.k), Y(p.v)]),
      a = P[0],
      z = P[P.length - 1],
      last = P.length - 1;
    let g = `<line class="base" x1="${L - 6}" x2="${W - Rr + 6}" y1="${H - B + 7}" y2="${H - B + 7}"/>`;
    g += `<path class="l" pathLength="1" d="${P.map((q, i) => `${i ? "L" : "M"}${f1x(q[0])} ${f1x(q[1])}`).join(" ")}"/>`;
    g += P.map(
      (q, i) =>
        `<circle class="${i === last ? "e" : ""}" cx="${f1x(q[0])}" cy="${f1x(q[1])}" r="${i === last ? 5.5 : 3.5}"/>`,
    ).join("");
    g += `<text x="${f1x(a[0] - 10)}" y="${f1x(a[1] + 5)}" text-anchor="end">${fmtKg(vs[0])}</text>`;
    g += `<text x="${f1x(z[0] + 11)}" y="${f1x(z[1] + 5)}">${fmtKg(vs[last])} ${unit}</text>`;
    g += `<text class="d" x="${f1x(a[0])}" y="${H - 2}" text-anchor="middle">${fmtD(pts[0].k)}</text><text class="d" x="${f1x(z[0])}" y="${H - 2}" text-anchor="middle">${fmtD(pts[last].k)}</text>`;
    return `<svg class="wr-sp" viewBox="0 0 ${W} ${H}" role="img" aria-label="De ${fmtKg(vs[0])} ${unit} em ${fmtD(pts[0].k)} a ${fmtKg(vs[last])} ${unit} em ${fmtD(pts[last].k)}">${g}</svg>`;
  }
  // 1% a cada treino: a curva de 1,01 elevado ao número de treinos
  function growthSVG(n) {
    const W = 320,
      H = 120,
      L = 8,
      Rr = 64,
      T = 12,
      B = 12,
      top = growth(n);
    const X = (i) => L + (i / n) * (W - L - Rr),
      Y = (v) => T + (1 - (v - 1) / (top - 1 || 1)) * (H - T - B);
    const steps = Math.min(n, 60);
    const d = Array.from({ length: steps + 1 }, (_, j) => {
      const i = (j / steps) * n;
      return `${j ? "L" : "M"}${f1x(X(i))} ${f1x(Y(growth(i)))}`;
    }).join(" ");
    return `<svg class="wr-sp" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line class="base" x1="${L}" x2="${W - Rr + 6}" y1="${H - B + 6}" y2="${H - B + 6}"/><path class="l" pathLength="1" d="${d}"/><circle class="e" cx="${f1x(X(n))}" cy="${f1x(Y(top))}" r="5.5"/><text x="${f1x(X(n) + 11)}" y="${f1x(Y(top) + 5)}">${nfmt(top, 2)}x</text><text class="d" x="${L}" y="${f1x(Y(1) - 8)}">1x</text></svg>`;
  }
  // corridas em ordem, a mais longa em cor cheia e com a distância escrita
  function runBarsSVG(pts) {
    const n = pts.length,
      W = 320,
      H = 140,
      T = 24,
      B = 20,
      gap = n > 24 ? 2 : 4;
    const bw = Math.min(24, (W - gap * (n - 1)) / n),
      x0 = (W - (n * bw + (n - 1) * gap)) / 2;
    const kms = pts.map((p) => p.km),
      mx = Math.max(...kms),
      iTop = kms.lastIndexOf(mx);
    let g = `<line class="base" x1="0" x2="${W}" y1="${H - B}" y2="${H - B}"/>`;
    pts.forEach((p, i) => {
      const h = Math.max(3, (p.km / mx) * (H - T - B)),
        x = x0 + i * (bw + gap),
        y = H - B - h;
      g += `<path class="bar${i === iTop ? " top" : ""}" style="--d:${i * 40}ms" d="${barTop(x, y, bw, h, 4)}"/>`;
      if (i === iTop) {
        const cx = x + bw / 2,
          an = cx < 30 ? "start" : cx > W - 30 ? "end" : "middle";
        g += `<text x="${f1x(an === "start" ? x : an === "end" ? x + bw : cx)}" y="${f1x(y - 8)}" text-anchor="${an}">${fmtKg(p.km)} km</text>`;
      }
    });
    g += `<text class="d" x="${f1x(x0)}" y="${H - 3}">${fmtD(pts[0].k)}</text><text class="d" x="${f1x(x0 + n * bw + (n - 1) * gap)}" y="${H - 3}" text-anchor="end">${fmtD(pts[n - 1].k)}</text>`;
    return `<svg class="wr-sp wr-run" viewBox="0 0 ${W} ${H}" role="img" aria-label="${n} corridas com distância; a mais longa teve ${fmtKg(mx)} km">${g}</svg>`;
  }
  const dotsHTML = (n) =>
    `<div class="wr-dots" aria-hidden="true">${Array.from({ length: Math.min(n, 70) }, (_, j) => `<i style="--d:${Math.min(j * 30, 1500)}ms"></i>`).join("")}</div>`;
  const lvDots = (n) =>
    `<div class="wr-lv" aria-hidden="true">${LVCOL.map((c, j) => `<i class="${j + 1 < n ? "p" : j + 1 === n ? "c" : ""}" style="background:${c}"></i>`).join("")}</div>`;
  const chipsHTML = (a) => `<ul class="wr-chips">${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const miniHTML = (rows) =>
    `<ul class="wr-mini">${rows.map(([a, b]) => `<li><span>${esc(a)}</span><b>${b}</b></li>`).join("")}</ul>`;
  const pbar = (pct, cls) =>
    `<div class="wr-pbar ${cls || ""}"><i style="width:${Math.max(0, Math.min(100, pct)).toFixed(1)}%"></i></div>`;

  // ---- as histórias de um período ----
  function recapSlides(id) {
    const R = recapRange(id),
      r = recap(R.from, R.to),
      season = R.season,
      done = !r.partial;
    const quando = season ? "no verão" : `em ${R.mes}`;
    const big = (v, dec) => `<span class="wr-n" data-to="${v}" data-dec="${dec || 0}">${nfmt(v, dec)}</span>`;
    const sl = [];
    if (season)
      sl.push(
        done
          ? {
              c: "done",
              k: "21 de dezembro",
              big: "Chegou o verão.",
              md: true,
              sub: "98 dias, de 14/09 a 21/12. Bora ver o que você fez com eles.",
              pre: SUNSVG,
            }
          : {
              c: "done",
              k: `Prévia, ${today.getDate()} de ${MESES[today.getMonth()]}`,
              big: "Até aqui.",
              md: true,
              sub: `${Math.round((today - parse(START)) / dayMs)} dias desde 14/09. A completa sai em 21/12, mas dá pra espiar.`,
              pre: SUNSVG,
            },
      );
    else
      sl.push({
        c: "done",
        k: done ? "Fechou o mês" : "O mês até agora",
        big: R.title,
        md: true,
        sub: `De ${fmtD(R.from)} a ${fmtD(r.end)}.${r.total || r.runs.length ? " Bora ver como foi." : ""}`,
        pre: SUNSVG,
      });

    if (!r.total && !r.runs.length) {
      sl.push({
        c: "ink",
        k: season ? "Até agora" : up1(quando),
        big: "Nada marcado.",
        md: true,
        sub: season
          ? "Marca o primeiro treino e a retrospectiva começa a encher."
          : `Nenhum treino nem corrida marcados ${quando}.`,
        btns: true,
      });
      return { R, r, sl: fixColors(sl) };
    }

    // quantas vezes treinou, com o calendário do período
    if (r.total) {
      let sub = r.work ? `Foi em ${r.pct}% dos dias úteis` : "Tudo fora dos dias úteis";
      sub +=
        r.extra && r.work
          ? `, e mais ${r.extra} ${sOf(r.extra, "vez", "vezes")} no fim de semana ou feriado.`
          : ".";
      if (!season && done && R.m !== parse(START).getMonth()) {
        const P = recapRange(key(new Date(R.y, R.m - 1, 1)).slice(0, 7)),
          prev = logsIn(P.from, P.to),
          dif = r.total - prev;
        sub +=
          dif > 0
            ? ` São ${dif} a mais que em ${P.mes}.`
            : dif < 0
              ? ` São ${-dif} a menos que em ${P.mes}.`
              : ` O mesmo tanto que em ${P.mes}.`;
      }
      sl.push({
        c: "ink",
        k: season ? "Você treinou" : `Em ${R.mes} você treinou`,
        big: big(r.total),
        unit: sOf(r.total, "vez", "vezes"),
        sub,
        vis: season ? heatSeason(r) : heatMonth(R, r),
      });
    }

    // séries e toneladas
    if (r.setsAll) {
      const t = r.kg / 1000;
      let sub;
      if (t >= 1) {
        const ele = t / 6;
        sub =
          ele >= 2
            ? `E umas ${nfmt(t)} toneladas levantadas: o peso de ${nfmt(ele)} elefantes.`
            : `E umas ${nfmt(t, t < 10 ? 1 : 0)} toneladas levantadas: o peso de ${nfmt(t)} ${sOf(Math.round(t), "carro popular", "carros populares")}.`;
      } else sub = `Umas ${nfmt(r.setsAll / r.total)} séries por treino.`;
      sl.push({
        c: "violet",
        k: "Somando tudo, foram",
        big: big(r.setsAll),
        unit: "séries",
        sub,
        note:
          t >= 1 ? "Conta feita com as séries e repetições do plano e o peso anotado de cada exercício." : "",
      });
    }

    // treino mais feito
    if (r.top.length) {
      const w = r.top[0],
        n = r.types[w],
        w2 = r.top[1];
      sl.push({
        c: "amber",
        k: "Seu treino mais feito",
        big: esc(w),
        sm: true,
        sub: `${n} ${sOf(n, "vez", "vezes")}${
          !w2
            ? "."
            : r.types[w2] === n
              ? `, empatado com ${esc(w2)}.`
              : `. Depois vem ${esc(w2)}, com ${r.types[w2]}.`
        }`,
        vis: r.top.length > 1 ? barsHTML(r.top.slice(0, 5).map((x) => [x, r.types[x]])) : "",
      });
    }

    // dia da semana (e hora, quando dá pra saber)
    if (r.total >= 3) {
      const mx = Math.max(...r.wd),
        favs = [0, 1, 2, 3, 4, 5, 6].filter((i) => r.wd[i] === mx);
      const one = favs.length === 1,
        abbr = (i) => wdName(i).slice(0, 3).toLowerCase();
      let sub = one
        ? `${mx} ${sOf(mx, "treino", "treinos")} ${favs[0] >= 5 ? "num" : "numa"} ${wdName(favs[0]).toLowerCase()}.`
        : `${mx} ${sOf(mx, "treino", "treinos")} em cada um.`;
      const h = r.hours.length,
        b = r.hb.indexOf(Math.max(...r.hb));
      if (h >= 5 && r.hb[b] / h >= 0.5)
        sub += ` E na maioria das vezes ${["de manhã", "à tarde", "à noite"][b]}.`;
      sl.push({
        c: "ink",
        k: one ? "Seu dia favorito pra treinar" : "Seus dias favoritos pra treinar",
        big: one
          ? wdName(favs[0])
          : favs.length === 2
            ? `${wdName(favs[0])} e ${wdName(favs[1]).toLowerCase()}`
            : favs.length >= 5 && favs.every((i) => i < 5)
              ? "Todo dia útil"
              : up1(joinPt(favs.map(abbr))),
        sm: true,
        sub,
        vis: wdBars(r),
      });
    }

    // músculo que mais trabalhou
    if (r.mus.length) {
      const m = r.mus[0],
        tot = r.mus.reduce((a, x) => a + r.muscles[x], 0);
      sl.push({
        c: "pink",
        k: "O músculo que mais trabalhou",
        big: m,
        sm: true,
        sub: `${nfmt(r.muscles[m])} séries, ${Math.round((r.muscles[m] / tot) * 100)}% de tudo ${quando}.`,
        vis: barsHTML(r.mus.map((x) => [x, r.muscles[x]])),
      });
    }

    // carga que mais subiu
    if (r.ups.length) {
      const u = r.ups[0],
        more = r.ups.slice(1, 4);
      sl.push({
        c: "lime",
        k: "Onde você mais ficou forte",
        big: esc(u.lk),
        sm: true,
        sub: `De ${fmtKg(u.a)} pra ${fmtKg(u.b)} kg${u.pct >= 1 ? `, +${Math.round(u.pct)}%` : ""}.${r.ups.length > 1 ? ` E a carga subiu em mais ${r.ups.length - 1} ${sOf(r.ups.length - 1, "exercício", "exercícios")}.` : ""}`,
        vis:
          sparkSVG(
            u.pts.map((x) => ({ k: x.d, v: x.kg })),
            "kg",
          ) + (more.length ? miniHTML(more.map((x) => [x.lk, `+${fmtKg(x.diff)} kg`])) : ""),
      });
    }

    // caminho até a primeira barra
    const hg = r.bar[HANG],
      ng = r.bar[NEG];
    if (hg || ng) {
      const ready = hg && hg.ok && (!ng || ng.ok);
      // o que mudou desde o primeiro registro (ou que é o primeiro)
      const parts = [];
      if (hg)
        parts.push(
          hg.best > hg.first ? `começou aguentando ${fmtKg(hg.first)} s pendurado` : "primeira marca anotada",
        );
      if (ng)
        parts.push(
          ng.best > ng.first
            ? `${hg ? "nas negativas, " : ""}começou com ${fmtKg(ng.first)}`
            : hg
              ? `nas negativas, ${fmtKg(ng.best)} até agora`
              : "primeira marca anotada",
        );
      sl.push({
        c: "violet",
        k: "Rumo à primeira barra",
        big: ready ? (ng ? "As duas metas batidas." : "Meta batida.") : hg ? big(hg.best) : big(ng.best),
        unit: ready ? "" : hg ? "segundos pendurado" : sOf(ng.best, "negativa seguida", "negativas seguidas"),
        md: ready,
        sub: ready
          ? `${hg ? `Aguentou ${fmtKg(hg.best)} s pendurado. ` : ""}Agora é tentar a primeira barra.`
          : up1(parts.join(". E ")) + ".",
        vis:
          `<ul class="wr-goal">` +
          [hg && ["Pendurado", hg.best, hg.goal, " s"], ng && ["Negativas seguidas", ng.best, ng.goal, ""]]
            .filter(Boolean)
            .map(
              ([l, v, g, u]) =>
                `<li><span>${l}</span><b>${fmtKg(v)}${u}, meta ${g}${u}</b>${pbar((v / g) * 100)}</li>`,
            )
            .join("") +
          `</ul>`,
      });
    }

    // corridas
    if (r.runs.length) {
      const n = r.runs.length;
      if (r.km > 0) {
        const laps = Math.max(1, Math.round((r.km * 1000) / 400));
        let sub = `Em ${n} ${sOf(n, "corrida", "corridas")}: o mesmo que ${nfmt(laps)} ${sOf(laps, "volta", "voltas")} numa pista de atletismo.`;
        if (r.longest && r.runPts.length > 1) sub += ` A mais longa: ${fmtKg(r.longest.km)} km.`;
        if (r.pace) sub += ` Melhor ritmo: ${fmtMin(r.pace.p)}/km.`;
        sl.push({
          c: "blue",
          k: "Você correu",
          big: big(r.km, kmDec(r.km)),
          unit: "km",
          sub,
          vis: r.runPts.length > 1 ? runBarsSVG(r.runPts) : "",
        });
      } else
        sl.push({
          c: "blue",
          k: "Você correu",
          big: big(n),
          unit: sOf(n, "vez", "vezes"),
          sub: "Sem distância anotada. Pondo os km, eles entram aqui.",
        });
    }

    // maior sequência
    if (r.best.n >= 2) {
      let sub = `De ${fmtD(r.best.from)} a ${fmtD(r.best.to)}, sem quebrar a corrente.`;
      if (r.full) sub += ` ${r.full} ${sOf(r.full, "semana fechada", "semanas fechadas")} em 5/5.`;
      else if (r.bestWeek.n >= 3) sub += ` Melhor semana: ${r.bestWeek.n} treinos.`;
      sl.push({
        c: "done",
        k: "Sua maior sequência",
        big: big(r.best.n),
        unit: "dias seguidos",
        sub,
        vis: dotsHTML(r.best.n),
      });
    }

    // 1% a cada treino
    if (season && r.total >= 5) {
      const g = growth(r.total);
      sl.push({
        c: "amber",
        k: "1% melhor a cada treino",
        big: g >= 2 ? `${big(g, 1)}x` : `+${big(Math.round((g - 1) * 100))}%`,
        sub: `${r.total} treinos, 1% de cada vez. Juros compostos, só que de shape.`,
        vis: growthSVG(r.total),
      });
    }

    // peso do corpo
    if (r.weight && r.weight.pts.length >= 2) {
      const w = r.weight,
        d = Math.round((w.b - w.a) * 10) / 10;
      sl.push({
        c: "ink",
        k: "Peso do corpo",
        big: `${kg1(w.a)} → ${kg1(w.b)}`,
        unit: "kg",
        sm: true,
        sub:
          d === 0
            ? `Igual ao começo, em ${w.n} ${sOf(w.n, "pesagem", "pesagens")}.`
            : `${d > 0 ? "+" : "−"}${kg1(Math.abs(d))} kg ${quando}, em ${w.n} ${sOf(w.n, "pesagem", "pesagens")}.`,
        vis: sparkSVG(w.pts, "kg"),
      });
    }

    let extra = {};
    if (season) {
      // nível e conquistas
      const s = stats(),
        L = levelInfo(s),
        bd = badges(s),
        got = bd.filter((x) => x.b).length,
        un = unlockedSecrets().length,
        wc = weeklyDoneCount();
      sl.push({
        c: "ink",
        k: done ? "Seu nível" : "Seu nível até agora",
        big: `Nível ${L.n}`,
        sm: true,
        sub: `${esc(L.name)}, com ${nfmt(L.x)} XP. ${got} de ${bd.length} conquistas${un ? ` e ${un} ${sOf(un, "secreta", "secretas")}` : ""}, ${wc} ${sOf(wc, "desafio", "desafios")} da semana completo${wc === 1 ? "" : "s"}.`,
        vis: lvDots(L.n),
      });
      extra.level = `${L.n}, ${esc(L.name)}`;
      // perfil de treino
      if (r.total >= 5) {
        const p = persona(r);
        sl.push({
          c: "pink",
          k: "Seu perfil de treino",
          big: p.t,
          md: true,
          sub: p.d,
          vis: chipsHTML(p.chips),
        });
        extra.persona = p.t;
      }
      // projeção (só na prévia)
      if (!done && r.total >= 3) {
        let rem = 0;
        for (let k = state.logs[todayKey] ? addD(todayKey, 1) : todayKey; k <= SUMMER; k = addD(k, 1))
          if (!isOff(parse(k))) rem++;
        const rate = r.work ? r.onWork / r.work : 0,
          proj = r.total + Math.round(rem * rate),
          max = r.total + rem;
        if (rem > 0)
          sl.push({
            c: "lime",
            k: "No ritmo de agora, você chega em",
            big: `~${big(proj)}`,
            unit: "treinos até 21/12",
            sub:
              proj >= max
                ? `Sem faltar nenhum dia útil, são ${max}. É isso aí.`
                : `Sem faltar nenhum dia útil até lá, dá pra chegar em ${max}.`,
            vis:
              `<div class="wr-proj" role="img" aria-label="${r.total} feitos, uns ${proj} no ritmo de agora, ${max} no máximo">${pbar((proj / max) * 100, "p")}${pbar((r.total / max) * 100)}</div>` +
              `<div class="wr-pl"><span>${r.total} até hoje</span><span>${max} no máximo</span></div>`,
          });
      }
    }

    sl.push({ c: "done", poster: true, html: posterHTML(R, r, done, extra) });
    return { R, r, sl: fixColors(sl) };
  }
  // Dois slides seguidos não ficam da mesma cor (quando algum some por falta de dado). A cor do nível
  // conta como igual à cor fixa parecida (o dourado do nível 10 e o amarelo, por exemplo).
  const WR_HEX = { blue: "#5cb8ff", amber: "#ffb547", pink: "#ff6b9a", lime: "#c4f25a", violet: "#a98bff" };
  function fixColors(sl) {
    const acc = LVCOL[levelInfo(stats()).n - 1];
    const hex = (c) => (c === "done" ? acc : WR_HEX[c] || null);
    const near = (a, b) => {
      if (a === b) return true;
      const x = hex(a),
        y = hex(b);
      if (!x || !y) return false;
      const ch = (h, i) => parseInt(h.slice(i, i + 2), 16);
      return Math.hypot(ch(x, 1) - ch(y, 1), ch(x, 3) - ch(y, 3), ch(x, 5) - ch(y, 5)) < 60;
    };
    const ALT = ["ink", "blue", "pink", "lime", "violet", "amber", "done"];
    for (let j = 1; j < sl.length; j++)
      if (near(sl[j].c, sl[j - 1].c))
        sl[j].c = ALT.find((c) => !near(c, sl[j - 1].c) && (!sl[j + 1] || !near(c, sl[j + 1].c))) || "ink";
    return sl;
  }
  const WR_BTNS = `<div class="wr-btns"><button data-wr="again">Ver de novo</button><button data-wr="close">Fechar</button></div>`;
  // o resumo final, feito pra tirar print
  function posterHTML(R, r, done, extra) {
    const tiles = [];
    if (r.total) tiles.push([nfmt(r.total), sOf(r.total, "treino", "treinos")]);
    if (r.best.n >= 2) tiles.push([nfmt(r.best.n), "dias seguidos"]);
    if (r.km > 0) tiles.push([nfmt(r.km, kmDec(r.km)), "km correndo"]);
    else if (r.runs.length) tiles.push([nfmt(r.runs.length), sOf(r.runs.length, "corrida", "corridas")]);
    if (r.setsAll) tiles.push([nfmt(r.setsAll), "séries"]);
    if (tiles.length < 4 && r.work && r.total) tiles.push([`${r.pct}%`, "dos dias úteis"]);
    const rows = [];
    if (r.top[0]) rows.push(["Treino favorito", esc(r.top[0])]);
    if (r.mus[0]) rows.push([R.season ? "Músculo do verão" : "Músculo do mês", r.mus[0]]);
    if (r.ups[0]) rows.push(["Mais evoluiu", `${esc(r.ups[0].lk)}, +${fmtKg(r.ups[0].diff)} kg`]);
    if (extra.persona) rows.push(["Perfil", extra.persona]);
    if (extra.level) rows.push(["Nível", extra.level]);
    const title = R.season ? (done ? "Meu verão 2026" : "Meu verão até agora") : `Meu ${R.mes}`;
    const daysLeft = Math.max(0, Math.round((parse(SUMMER) - today) / dayMs));
    const tip =
      R.season && !done
        ? `${daysLeft === 1 ? "Falta 1 dia" : `Faltam ${daysLeft} dias`}. A completa sai em 21/12.`
        : "Tira um print e manda pros amigos.";
    return `<div class="wr-post"><div class="wp-h"><span>Treinos até o verão</span><b>${title}</b><em>${fmtD(R.from)} a ${fmtD(r.end)}</em></div>
      <dl class="wp-g">${tiles
        .slice(0, 4)
        .map(([v, l]) => `<div><dt>${l}</dt><dd>${v}</dd></div>`)
        .join(
          "",
        )}</dl>${rows.length ? `<ul class="wp-l">${rows.map(([a, b]) => `<li><span>${a}</span><b>${b}</b></li>`).join("")}</ul>` : ""}<p class="wp-f">Feito por João Candaten</p></div>
      <p class="wr-tip">${tip}</p>${WR_BTNS}`;
  }
  function slideHTML(x) {
    if (x.poster) return x.html;
    return (
      (x.pre || "") +
      (x.k ? `<p class="wr-k">${x.k}</p>` : "") +
      `<h2 class="wr-big${x.sm ? " sm" : x.md ? " md" : ""}">${x.big}${x.unit ? `<small>${x.unit}</small>` : ""}</h2>` +
      (x.sub ? `<p class="wr-sub">${x.sub}</p>` : "") +
      (x.vis ? `<div class="wr-vis">${x.vis}</div>` : "") +
      (x.note ? `<p class="wr-note">${x.note}</p>` : "") +
      (x.btns ? WR_BTNS : "")
    );
  }

  // ---- o tocador de histórias ----
  const RM = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  const calm = () => !!(RM && RM.matches); // menos movimento: sem passar sozinho e sem contagem
  const STORY_MS = 6500;
  let story = null;
  function playStory(sl, label, accent, onClose) {
    let i = 0,
      timer = null,
      t0 = 0,
      left = 0,
      paused = false,
      held = false,
      visPaused = false,
      holdT = null,
      down = null,
      raf = 0,
      gone = false;
    const el = document.createElement("div");
    el.className = "wr";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", label);
    el.tabIndex = -1;
    el.style.setProperty("--wrc", accent);
    el.style.setProperty("--wrc-ink", inkOn(accent));
    el.innerHTML = `<div class="wr-top"><div class="wr-seg" aria-hidden="true"></div><div class="wr-bar"><span class="wr-tag">${esc(label)}</span><span class="wr-pos"></span><button class="wr-x" aria-label="Fechar a retrospectiva">✕</button></div></div>
      <div class="wr-body" aria-live="polite"></div><p class="wr-hint"></p>`;
    const seg = el.querySelector(".wr-seg"),
      posEl = el.querySelector(".wr-pos"),
      body = el.querySelector(".wr-body"),
      foot = el.querySelector(".wr-hint");
    document.body.appendChild(el);
    const prevOverflow = document.documentElement.style.overflow;
    document.documentElement.style.overflow = "hidden";
    const stop = () => {
      clearTimeout(timer);
      timer = null;
    };
    const arm = () => {
      stop();
      if (calm() || paused || i >= sl.length - 1) return;
      t0 = Date.now();
      timer = setTimeout(() => go(1), left);
    };
    function countUp() {
      cancelAnimationFrame(raf);
      const ns = [...el.querySelectorAll("[data-to]")];
      if (!ns.length || calm()) return;
      const start = performance.now();
      body.setAttribute("aria-busy", "true");
      const step = (now) => {
        const p = Math.min(1, (now - start) / 900),
          e = 1 - Math.pow(1 - p, 3);
        ns.forEach((n) => (n.textContent = nfmt(+n.dataset.to * e, +n.dataset.dec)));
        if (p < 1) raf = requestAnimationFrame(step);
        else body.removeAttribute("aria-busy");
      };
      raf = requestAnimationFrame(step);
    }
    function draw() {
      const x = sl[i];
      left = STORY_MS;
      el.className = `wr c-${x.c}${paused ? " hold" : ""}${calm() ? " calm" : ""}`;
      el.style.setProperty("--dur", left + "ms");
      seg.innerHTML = sl.map((_, j) => `<i class="${j < i ? "f" : j === i ? "a" : ""}"></i>`).join("");
      posEl.textContent = `${i + 1} de ${sl.length}`;
      body.innerHTML = `<div class="wr-in">${slideHTML(x)}</div>`;
      body.scrollTop = 0;
      const last = i === sl.length - 1;
      foot.className = last ? "wr-end" : "wr-hint";
      foot.textContent = last ? "" : calm() ? "Toque pra avançar" : "Toque pra avançar, segure pra pausar";
      fit();
      countUp();
      arm();
    }
    // palavra comprida no título (Persistente, Madrugador…) diminui até caber na largura
    function fit() {
      el.querySelectorAll(".wr-big, .wp-h b").forEach((b) => {
        let fs = parseFloat(window.getComputedStyle(b).fontSize),
          n = 0;
        while (b.scrollWidth > b.clientWidth + 1 && n++ < 12) {
          fs *= 0.92;
          b.style.fontSize = fs.toFixed(1) + "px";
        }
        if (b.scrollWidth > b.clientWidth + 1) b.style.overflowWrap = "anywhere";
      });
    }
    function go(n) {
      const j = Math.max(0, Math.min(sl.length - 1, i + n));
      if (j === i && n > 0) return;
      i = j;
      draw();
    }
    function pause() {
      if (paused) return;
      paused = true;
      if (timer) left = Math.max(300, left - (Date.now() - t0));
      stop();
      el.classList.add("hold");
    }
    function resume() {
      if (!paused || gone) return;
      paused = false;
      el.classList.remove("hold");
      arm();
    }
    function close() {
      if (gone) return;
      gone = true;
      stop();
      cancelAnimationFrame(raf);
      clearTimeout(holdT);
      document.removeEventListener("keydown", onKey, true);
      document.removeEventListener("visibilitychange", onVis);
      document.documentElement.style.overflow = prevOverflow;
      el.classList.add("out");
      setTimeout(() => el.remove(), 320);
      if (story === api) story = null;
      if (onClose) onClose();
      setTimeout(dayCheck, 400); // se o dia virou com a história aberta, atualiza agora
    }
    const onKey = (e) => {
      const k = e.key;
      if (k === "ArrowRight") go(1);
      else if (k === "ArrowLeft") go(-1);
      else if (k === "Escape") close();
      else if (k === " " && !(e.target.closest && e.target.closest("button"))) {
        if (paused) resume();
        else pause();
      } else return;
      e.preventDefault();
      e.stopPropagation();
    };
    const onVis = () => {
      if (document.visibilityState === "hidden") {
        if (!paused) {
          visPaused = true;
          pause();
        }
      } else if (visPaused) {
        visPaused = false;
        resume();
      }
    };
    document.addEventListener("keydown", onKey, true);
    document.addEventListener("visibilitychange", onVis);
    // toque rápido: avança (ou volta, no terço da esquerda); segurar: pausa enquanto o dedo estiver na tela
    el.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button") || (e.pointerType === "mouse" && e.button !== 0)) return;
      down = { x: e.clientX };
      clearTimeout(holdT);
      holdT = setTimeout(() => {
        held = true;
        pause();
      }, 220);
    });
    const lift = (e, cancel) => {
      clearTimeout(holdT);
      if (!down) return;
      const d = down;
      down = null;
      if (held) {
        held = false;
        resume();
        return;
      }
      if (cancel || gone) return;
      go(d.x < el.clientWidth * 0.3 ? -1 : 1);
    };
    el.addEventListener("pointerup", (e) => lift(e));
    el.addEventListener("pointercancel", (e) => lift(e, true));
    el.addEventListener("contextmenu", (e) => e.preventDefault());
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const b = e.target.closest("button");
      if (!b) return;
      if (b.classList.contains("wr-x") || b.dataset.wr === "close") close();
      else if (b.dataset.wr === "again") {
        i = 0;
        draw();
      }
    });
    const api = { close };
    draw();
    el.focus({ preventScroll: true });
    return api;
  }

  // vistas (neste celular): o aviso do Hoje some depois que você abre

  function weighHTML() {
    const keys = Object.keys(state.weight).sort();
    const fmt = (v) => (Math.round(v * 10) / 10).toFixed(1).replace(".", ",").replace(",0", "");
    const last = keys.length ? state.weight[keys[keys.length - 1]] : null;
    const first = keys.length ? state.weight[keys[0]] : null;
    let info = "Anota o peso uma vez por semana, sempre na mesma balança e no mesmo horário.";
    if (keys.length === 1) info = `${fmt(last)} kg registrado. Volta na semana que vem pra comparar.`;
