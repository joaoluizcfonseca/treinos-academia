  font-size: 18px;
  font-weight: 700;
}

/* números do painel: letras mais largas que a Archivo condensada */
:root[data-skin="mare"] .dk b {
  font-size: clamp(17px, 5.3vw, 22px);
  letter-spacing: -0.04em;
}
:root[data-skin="caderno"] .dk b {
  font-size: clamp(20px, 6.4vw, 27px);
}

/* ---------- Escolha do visual (Progresso) ---------- */
.skins {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.skins button {
  display: grid;
  gap: 2px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.skins button[aria-pressed="true"] {
  border-color: var(--done);
  box-shadow: inset 0 0 0 1px var(--done);
}
.skins b {
  font-size: 15px;
  font-weight: 800;
}
.skins span {
  font-size: 12px;
  color: var(--soft);
  line-height: 1.3;
}
/* miniatura de cada visual */
.sk {
  display: block;
  height: 54px;
  margin-bottom: 6px;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
}
.sk-orig {
  background:
    linear-gradient(var(--c, #ff5a1f), var(--c, #ff5a1f)) 10px 34px / 56% 8px no-repeat,
    linear-gradient(#ededed, #ededed) 10px 12px / 34% 10px no-repeat,
    #000;
}
.sk-mare {
  /* o sol fica em cima da linha, no ponto do caminho até o verão */
  background:
    radial-gradient(
      circle at calc(10px + (100% - 20px) * var(--p, 0.5)) 31px,
      #ffc24d 0 6px,
      rgba(255, 194, 77, 0.3) 6.5px 10px,
      transparent 10.5px
    ),
    linear-gradient(#0d3b4f, #0d3b4f) 10px 30px / calc(100% - 20px) 2px no-repeat,
    linear-gradient(180deg, #cfe9ec, #e6f1f1);
}
.sk-anilha {
  background:
    radial-gradient(
      circle at 26px 27px,
      #1c1e21 0 3px,
      #c9cfd5 3.5px 7px,
      var(--c, #e5383b) 7.5px 18px,
      transparent 18.5px
    ),
    radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.6px) 0 0 / 6px 6px,
    #1c1e21;
}
.sk-caderno {
  background:
    linear-gradient(90deg, transparent 8px, #f0a39a 8px 9.5px, transparent 9.5px),
    repeating-linear-gradient(180deg, transparent 0 11px, #d6e4f5 11px 12px), #fdfdfb;
}
.sk-caderno::after {
  content: attr(data-n);
  position: absolute;
  left: 16px;
  top: 6px;
  font:
    700 28px "Kalam",
    cursive;
  color: var(--c, #1f3fa8);
}

/* ---------- Backup (app instalado: os dados ficam só no celular) ---------- */
/* lembrete semanal no Hoje: o "Depois" fica como link, ao lado do botão */
.wrem.bkrem .row {
  align-items: center;
}
.wrem.bkrem .lnk {
  background: none;
  color: var(--soft);
  padding: 8px 6px;
  font-weight: 600;
}
.bk-b {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 4px;
}
.bk-btn {
  position: relative;
  flex: 1 1 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
/* o campo de arquivo fica invisível por cima do botão: tocar em qualquer parte abre a escolha do arquivo */
.bk-btn input {
  position: absolute;
  inset: 0;
  width: 100%;
  opacity: 0;
  cursor: pointer;
}
.bk-btn:focus-within {
  outline: 2px solid var(--done);
  outline-offset: 2px;
}
.bk-m {
  margin: 10px 0 0;
  font-size: 14px;
}

/* Animações */
@keyframes spUp {
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes spFill {
  to {
    width: 100%;
  }
}
@keyframes wrSeg {
  to {
    transform: scaleX(1);
  }
}
@keyframes wrIn {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes wrSpin {
  to {

}

  from {
    opacity: 0;
    transform: scale(0.3);
  }
}

  from {
    transform: scaleX(0);
  }
}

  from {
    transform: scaleY(0);
  }
}

  to {

  from {

  to {
    opacity: 1;

  }

<script id="app-script">
(function () {
  document.documentElement.lang = "pt-BR";
  const SUMMER = "2026-12-21";

    "Peito e costas leve": [
      ["Supino sentado", "2x10", "Peito"],

      ["Flexão de braço", "2x8", "Peito"],

    ],
  };
  const LIGHT = "Peito e costas leve";
  const OPTIONAL = {}; // dia com treino opcional (o sábado deixou de ser: virou o Ombro e peito)
  const NOLOAD = /Prancha|Flexão|Escapular/; // peso do corpo: sem número pra anotar
  const GRIP = { Puxada: ["Aberta", "Fechada", "Triângulo", "Supinada"] }; // a carga é guardada por pegada
  // Na barra fixa o número anotado é tempo ou repetições, não carga.
  const HANG = "Pendurar na barra",
    NEG = "Negativa na barra";
  const UNIT = { [HANG]: "s", [NEG]: "reps" };
  const BAR_GOALS = { [HANG]: 30, [NEG]: 5 }; // metas antes de tentar a primeira barra
  const unitOf = (n) => UNIT[n] || "kg";
  // tipo do exercício: "kg" (anota o peso), "corpo" (peso do corpo, sem número pra anotar) ou a unidade da
  // barra fixa. Exercício criado no app guarda o tipo dele no plano (veja planOf).
  const exKind = (n) => customKinds()[n] || UNIT[n] || (NOLOAD.test(n) ? "corpo" : "kg");
  const isKg = (n) => exKind(n) === "kg";
  const isBody = (n) => exKind(n) === "corpo";
  // nomes antigos -> nomes novos (o que já foi anotado continua contando)
  const ALIAS = {
    "Chest press": "Supino sentado",
    "Crucifixo máquina (peck deck)": "Voador (peito)",
    "Crucifixo inverso": "Voador invertido (costas)",
    "Puxada na polia": "Puxada",
    "Remada sentada": "Remada com apoio no peito",
    "Rosca na polia": "Bíceps na polia com corda",
    "Tríceps polia": "Tríceps na polia com corda",
    "Tríceps máquina": "Tríceps na máquina",
    "Desenvolvimento ombro": "Ombro na máquina",
    Abdominal: "Abdômen na máquina",
    "Rosca de punho (halter)": "Antebraço com halter",
    "Rosca inversa": "Antebraço com halter",
  };
  const LEGACY = {
    "Rosca martelo": "Bíceps",
    "Elevação frontal": "Ombro",
    "Elevação lateral leve": "Ombro",
  };
  const MUSCLES = ["Peito", "Costas", "Ombro", "Bíceps", "Tríceps", "Antebraço", "Abdômen", "Pernas"];
  const muscleOf = (g) => (g === "Costas/ombro" ? "Costas" : g);
  const setsOf = (spec) => parseInt(spec, 10) || 3;
  const EXINFO = {};
  Object.values(PLANS).forEach((l) =>
    l.forEach(([n, sp, g]) => {
      if (!EXINFO[n]) EXINFO[n] = { sp, g };
    }),
  );
  Object.keys(LEGACY).forEach((n) => {
    if (!EXINFO[n]) EXINFO[n] = { sp: "3x10", g: LEGACY[n] };
  });
  const WDFULL = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
  // plan: o plano editado no app (dia da mudança -> treino -> exercícios). habits/chal/flash/supp: dados de
  // funções antigas, só guardados.
  const KEYS = [
    "logs",
    "runs",
    "ex",
    "weight",
    "loads",
    "habits",
    "chal",
    "hr",
    "sec",
    "flash",
    "supp",
    "plan",
  ];
  let state;
  try {
    state = JSON.parse(document.getElementById("state").textContent);
  } catch (e) {
    state = {};
  }
  if (!state || typeof state !== "object") state = {};
  KEYS.forEach((k) => {
    if (!state[k] || typeof state[k] !== "object") state[k] = {};
  });
  if (typeof state.rev !== "number") state.rev = 0;
  // O que ficou só no celular. Feito em cima desta mesma versão: vale inteiro. Feito em cima de uma
  // versão anterior (saiu outra versão antes de publicar, ou a publicação falhou): entra o que falta
  // aqui, pra anotação não se perder. Rascunho parado há mais de 3 dias é descartado.
  const DEEP = { loads: 1, supp: 1, ex: 1, plan: 1 }; // nesses, junta dia a dia e item a item
  const isObj = (v) => !!v && typeof v === "object" && !Array.isArray(v);
  function mergeAdds(src) {
    let n = 0;
    KEYS.forEach((k) => {
      const from = src[k];
      if (!isObj(from)) return;
      for (const d in from) {
        const v = from[d],
          cur = state[k][d];
        if (cur === undefined) {
          state[k][d] = v;
          n++;
        } else if (DEEP[k] && isObj(v) && isObj(cur)) {
          const add = Object.keys(v).filter((x) => cur[x] === undefined);
          if (add.length) {
            state[k][d] = Object.assign({}, cur);
            add.forEach((x) => (state[k][d][x] = v[x]));
            n += add.length;
          }
        }
      }
    });
    return n;
  }
  // ---------- plano de treino editável ----------
  // Cada treino pode ganhar exercício novo, perder um, mudar a ordem, as séries e as repetições. A mudança
  // fica em state.plan com a data do dia em que foi feita (dia -> treino -> exercícios), e cada dia usa o
  // plano que valia nele: retrospectivas, volume e o quadro do ano contam os treinos que já passaram do jeito
  // que eles foram feitos. Sem mudança nenhuma, vale o plano de sempre (PLANS).
  const DAYK = /^\d{4}-\d{2}-\d{2}$/;
  const validEx = (e) =>
    Array.isArray(e) &&
    typeof e[0] === "string" &&
    !!e[0].trim() &&
    typeof e[1] === "string" &&
    typeof e[2] === "string";
  function planOf(w, k) {
    k = k || todayKey;
    const ds = Object.keys(state.plan)
      .filter((d) => DAYK.test(d) && d <= k)
      .sort();
    for (let i = ds.length - 1; i >= 0; i--) {
      const l = isObj(state.plan[ds[i]]) ? state.plan[ds[i]][w] : null;
      if (Array.isArray(l)) return l.filter(validEx);
    }
    return PLANS[w] || null;
  }
  let kindMemo = null; // nome -> tipo, dos exercícios criados no app (refeito quando o plano muda)
  function customKinds() {
    if (kindMemo) return kindMemo;
    const m = {};
    Object.keys(state.plan)
      .sort()
      .forEach((d) => {
        const day = state.plan[d];
        if (!isObj(day)) return;
        for (const w in day)
          if (Array.isArray(day[w]))
            day[w].forEach((e) => {
              if (validEx(e) && (e[3] === "kg" || e[3] === "corpo")) m[e[0]] = e[3];
            });
      });
    return (kindMemo = m);
  }
  // muda o plano de um treino a partir de hoje
  function setPlan(w, list) {
    const day = Object.assign({}, isObj(state.plan[todayKey]) ? state.plan[todayKey] : {}, {
      [w]: list.map((e) => e.slice()),
    });
    state.plan = Object.assign({}, state.plan, { [todayKey]: day });
    kindMemo = null;
  }
  const keySnap = () => JSON.stringify(KEYS.map((k) => state[k]));
  const pubSnap = keySnap(); // os dados como vieram publicados, antes de juntar o que ficou no celular
  let draftMerged = 0;
  try {
    const local = JSON.parse(localStorage.getItem(LS) || "null");
    if (local && local.data) {
      if (local.base === state.rev)
        KEYS.forEach((k) => {
          const v = local.data[k];
          if (v && typeof v === "object") state[k] = v;
        });
      else {
        if (typeof local.t === "number" && Date.now() - local.t < 3 * 86400000)
          draftMerged = mergeAdds(local.data);
        if (!draftMerged) localStorage.removeItem(LS);
      }
    } else if (local && typeof local === "object") {
      KEYS.forEach((k) => {
        const v = local[k];
        if (v && typeof v === "object") for (const d in v) if (!(d in state[k])) state[k][d] = v[d];
      });
    }
  } catch (e) {}
  const unsentLocal = keySnap() !== pubSnap; // tem anotação deste celular que ainda não foi pro app

  let artifact = null,
    cantSave = false, // esta tela não consegue publicar: o app segue funcionando e guarda tudo neste celular
    saving = false,
    weightDraft = "",
    runKm = "",
    runTime = "";
  let runErr = "",
    wErr = "";
  const numBR = (v) => {
    const x = parseFloat(
      String(v || "")
        .trim()
        .replace(/\s/g, "")
        .replace(",", "."),
    );
    return isNaN(x) ? null : x;
  };
  function parseTime(v) {
    v = String(v || "").trim();
    if (!v) return null;
    if (/^\d+[:.,h]\d{1,2}$/.test(v)) {
      const [a, b] = v.split(/[:.,h]/).map(Number);
      return b < 60 ? a + b / 60 : NaN;
    }
    if (/^\d+$/.test(v)) {
      const n = Number(v);
      if (n >= 100) {
        const m = Math.floor(n / 100),
          sec = n % 100;
        return sec < 60 ? m + sec / 60 : NaN;
      }
      return n;
    }
    return NaN;
  }
  // Distância e tempo digitados numa corrida: devolve {run} pronto pra guardar ou {err} pra mostrar.
  function readRun(kmRaw, timeRaw) {
    const km = numBR(kmRaw),
      min = parseTime(timeRaw);
    if (km === null || km <= 0 || km > 60) return { err: "Coloca a distância em km, tipo 2,1." };
    if (min !== null && (isNaN(min) || min <= 0 || min > 300))
      return { err: "Tempo inválido. Usa minutos:segundos, tipo 11:30." };
    const run = { km: Math.round(km * 100) / 100 };
    if (min && min > 0) run.min = Math.round(min * 100) / 100;
    return { run };
  }
  let showChips = false,
    retypeOpen = false,
    runOpen = false,
    runConfirm = false,
    undoConfirm = false,
    sheetDay = null,
    sheetPick = null,
    sheetRunOpen = false,
    shKm = "",

    shErr = "",

    lvOpen = false,
    cqOpen = false,
    ldOpen = null,
    chartOpen = null;
  const kgDraft = {};
  let lastTyped = 0; // hora da última tecla num campo (a virada do dia espera a pessoa terminar)

  const pad = (n) => String(n).padStart(2, "0");
  const key = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayKey = key(today);
  const dayMs = 86400000;
  const esc = (s) =>
    String(s).replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],

  const isOff = (d) => {
    const w = d.getDay();
    return w === 0 || w === 6 || !!HOLIDAYS[key(d)];
  };
  // feriados nacionais (Carnaval e Corpus Christi são ponto facultativo, mas a academia costuma mudar o horário)
  const HOLI = {
    "2026-10-12": "Nossa Senhora Aparecida",
    "2026-11-02": "Finados",
    "2026-11-15": "Proclamação da República",
    "2026-11-20": "Consciência Negra",
    "2026-12-25": "Natal",
    "2027-01-01": "Ano-Novo",
    "2027-02-08": "Carnaval",
    "2027-02-09": "Carnaval",
    "2027-03-26": "Sexta-feira Santa",
    "2027-04-21": "Tiradentes",

    "2027-05-27": "Corpus Christi",
  };
  const HOLIDAYS = HOLI;
  const monday = (d) => {
    const m = new Date(d);
    m.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return m;
  };

  for (const d in state.ex) {
    const o = state.ex[d];
    if (!o || typeof o !== "object") continue;
    if (!Object.keys(o).some((k) => ALIAS[k])) continue;
    const n = {};
    for (const k in o) {
      const nk = ALIAS[k] || k;
      if (n[nk] === undefined) n[nk] = o[k];
      else if (typeof o[k] === "number" && typeof n[nk] === "number") n[nk] = Math.max(n[nk], o[k]);
    }
    state.ex[d] = n;
  }
  for (const k of Object.keys(state.loads)) {
    let nk = ALIAS[k];
    if (!nk) continue;
    if (GRIP[nk]) nk = `${nk} (${GRIP[nk][0].toLowerCase()})`;
    state.loads[nk] = Object.assign({}, state.loads[k], state.loads[nk] || {});
    delete state.loads[k];
  }
  // Marcações antigas por índice (0, 1, 2…) viram nome do exercício quando o treino do dia bate com o plano atual.
  for (const d in state.ex) {
    const o = state.ex[d];
    if (!o || typeof o !== "object") continue;
    const ks = Object.keys(o);
    if (!ks.length || !ks.every((k) => /^\d+$/.test(k))) continue;
    const nm = state.logs[d],
      list = PLANS[nm];
    if (!list || SPLIT[parse(d).getDay()] !== nm) continue;
    const n = { _w: nm };
    ks.forEach((k) => {
      const e = list[Number(k)];
      if (e && o[k]) n[e[0]] = setsOf(e[1]);
    });
    state.ex[d] = n;
  }
  const plannedFor = (d) => SPLIT[d.getDay()] || OPTIONAL[d.getDay()] || null;
  let picked = (state.ex[todayKey] && state.ex[todayKey]._w) || state.logs[todayKey] || null;
  if (!picked) {
    try {
      const pp = JSON.parse(localStorage.getItem("treinos-picked") || "null");
      if (pp && pp.d === todayKey && pp.w) picked = pp.w;
    } catch (e) {}
  }
  if (!picked) picked = plannedFor(today) || "Outro";

  function weekDone(mon) {
    let n = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      if (state.logs[key(d)]) n++;
    }
    return n;
  }

  function stats() {
    const keys = Object.keys(state.logs).sort();
    const total = keys.length;
    const runs = Object.keys(state.runs).length;
    const mon = monday(today);
    const week = weekDone(mon);

    let streak = 0;
    const d = new Date(today);
    if (!state.logs[todayKey]) d.setDate(d.getDate() - 1);
    for (let i = 0; i < 400; i++) {
      if (isOff(d) && !state.logs[key(d)]) {
        d.setDate(d.getDate() - 1);
        continue;
      }
      if (state.logs[key(d)]) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else break;
    }

    let best = 0;
    if (keys.length) {
      let run = 0;
      const c = parse(keys[0]);
      while (c <= today) {
        if (state.logs[key(c)]) {
          run++;
          if (run > best) best = run;
        } else if (!isOff(c)) run = 0;
        c.setDate(c.getDate() + 1);
      }
    }

    // semanas cheias (5 dias úteis) já fechadas ou em andamento
    let fullWeeks = 0;
    const w = monday(parse(START));
    while (w <= today) {
      if (weekDone(w) >= 5) fullWeeks++;
      w.setDate(w.getDate() + 7);
    }

    let workLeft = 0;
    const wl = new Date(today);
    const endS = parse(SUMMER);
    while (wl <= endS) {
      if (!isOff(wl)) workLeft++;
      wl.setDate(wl.getDate() + 1);
    }
    const left = Math.max(0, Math.round((parse(SUMMER) - today) / dayMs));
    return { total, runs, week, streak, best, fullWeeks, left, workLeft, keys };
  }

  function headline(s) {
    if (s.total === 0) return "Marca o primeiro treino.";
    if (s.week >= 5) return s.week > 5 ? `Semana fechada com ${s.week} treinos.` : "Semana fechada: 5 de 5.";
    // dias de treino que ainda faltam na semana (de hoje até sábado; domingo é descanso)
    const wd = today.getDay();
    let restantes = 0;
    for (let i = wd; wd > 0 && i <= 6; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + (i - wd));
      if (SPLIT[i] && !state.logs[key(d)]) restantes++;
    }
    const missing = 5 - s.week;
    if (restantes === 0) return `Semana terminou em ${s.week} de 5.`;
    if (missing > restantes) return `Dá pra fazer mais ${restantes} esta semana.`;
    return `${missing > 1 ? "Faltam" : "Falta"} ${missing} treino${missing > 1 ? "s" : ""} pra fechar a semana.`;
  }

  function badges(s) {
    s.season = s.keys.filter((k) => k <= SUMMER).length; // a conquista do verão conta só até 21/12
    s.surfs = Object.values(state.logs).filter((v) => v === "Surf").length;
    s.runKm = Object.values(state.runs).reduce((a, r) => a + (r && r.km ? r.km : 0), 0);
    return [
      { b: s.total >= 1, t: "Primeiro treino", d: "começou" },
      { b: s.total >= 10, t: "10 treinos", d: `${Math.min(s.total, 10)}/10` },
      {
        b: s.fullWeeks >= 1,
        t: "Semana 5/5",
        d: `${s.fullWeeks} semana${s.fullWeeks === 1 ? "" : "s"} cheia${s.fullWeeks === 1 ? "" : "s"}`,
      },
      { b: s.runs >= 5, t: "5 corridas", d: `${Math.min(s.runs, 5)}/5` },
      { b: s.total >= 25, t: "25 treinos", d: `${Math.min(s.total, 25)}/25` },
      { b: s.fullWeeks >= 4, t: "Mês inteiro", d: `${Math.min(s.fullWeeks, 4)}/4 semanas cheias` },
      { b: s.total >= 50, t: "50 treinos", d: `${Math.min(s.total, 50)}/50` },
      { b: s.season >= 65, t: "Verão", d: `${Math.min(s.season, 65)}/65 até 21/12` },
      {
        b: s.runKm >= 20,
        t: "20 km corridos",
        d: `${Math.min(s.runKm, 20).toFixed(1).replace(".", ",")}/20 km`,
      },
    ];
  }

  let lastTab = null;
  let tab = "hoje",
    booted = false,
    lastXP = null,
    xpReason = "",
    lastParts = null;
  try {
    const tt = localStorage.getItem("treinos-tab");
    if (["hoje", "pesos", "prog", "quadro"].includes(tt)) tab = tt;
  } catch (e) {}

  const ICON = {
    pesos: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>`,
    hoje: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"/></svg>`,
    prog: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>`,
    quadro: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>`,
  };

  function render() {
    charts = {};
    const s = stats();
    const LV = levelInfo(s);
    const lvc = lvPalette()[LV.n - 1];
    document.documentElement.style.setProperty("--done", lvc);
    document.documentElement.style.setProperty("--on-done", inkOn(lvc));
    const dstr = today.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    const dcap = dstr.charAt(0).toUpperCase() + dstr.slice(1);
    const span = Math.round((parse(SUMMER) - parse(START)) / dayMs);
    const pct = Math.min(100, Math.max(0, (1 - s.left / span) * 100));
    let html = `<header class="top ${tab === "hoje" ? "" : "small"}"><button class="thm" data-act="theme" aria-label="${curTheme() === "dark" ? "Usar tema claro" : "Usar tema escuro"}">${curTheme() === "dark" ? SUN : MOON}</button><p class="date">${esc(dcap)}</p>
      ${
        todayKey >= SUMMER
          ? `<div class="count sun"><b>${Math.round((today - parse(SUMMER)) / dayMs) + 1}º</b><span>dia do<br>verão</span></div>`
          : `<div class="count"><b>${s.left}</b><span>dias até<br>o verão</span></div>`
      }
      <div class="prog" role="img" aria-label="${Math.round(pct)}% do caminho até o verão"><i style="width:${pct.toFixed(1)}%"></i>${[
        "2026-10-01",
        "2026-11-01",
        "2026-12-01",
      ]
        .map((m) => `<s style="left:${(((parse(m) - parse(START)) / dayMs / span) * 100).toFixed(1)}%"></s>`)
        .join("")}</div>
</header>`;
    html += noSaveHTML(); // a tela não está salvando no app: avisa em todas as abas
    if (tab === "hoje") html += hojeHTML(s);
    else if (tab === "pesos") html += pesosHTML();
    else if (tab === "prog") html += progHTML(s);
    else html += quadroHTML(s);
    html += sheetHTML(); // a folha do dia abre do Calendário e do aviso de dia sem marcar
    html += exSheetHTML(); // novo exercício ou séries de um exercício
    html += `<footer class="cred">Feito por João Candaten</footer>`;
    html +=
      `<nav class="nav">` +
      [
        ["hoje", "Hoje"],
        ["pesos", "Pesos"],
        ["prog", "Progresso"],
        ["quadro", "Calendário"],
      ]
        .map(
          ([k, l]) =>
            `<button data-nav="${k}" ${tab === k ? 'aria-current="page"' : ""}>${ICON[k]}<span>${l}</span></button>`,
        )
        .join("") +
      `</nav>`;
    const root = document.getElementById("root");
    root.innerHTML = html;
    if (tab === "prog" && dash) dashPick(dash.i);
    if (tab === "prog" && yrs) for (const y in yrs.g) yrPick(+y, yrSel[y] || yrs.g[y].def);
    if (lastTab !== null && lastTab !== tab) {
      root.classList.remove("tabin");
      void root.offsetWidth;
      root.classList.add("tabin");
    }
    lastTab = tab;
    const fx = booted && !saving;
    const xNow = xpTotal(s);
    const gain = fx && lastXP !== null && xNow > lastXP ? xNow - lastXP : 0;
    const parts = xpParts(s);
    if (gain && lastParts) {
      const bits = Object.keys(parts)
        .filter((k) => parts[k] > lastParts[k])
        .map((k) => `${XPLABEL[k]} +${parts[k] - lastParts[k]}`);
      if (bits.length) xpReason = bits.join(", ");
    }
    const secretFound = fx ? checkSecrets() : false;
    const leveled = fx ? checkLevelUp(s, gain) : false;
    if (gain && !leveled && !secretFound) xpToast(gain, s);
    if (fx || lastXP === null) {
      lastXP = xNow;
      lastParts = parts;
    }
    if (fx) xpReason = "";
  }

  function weighDue() {
    const ks = Object.keys(state.weight).sort();
    if (!ks.length) return true;
    const d = parse(ks[ks.length - 1]);
    d.setDate(d.getDate() + 7);
    return d <= today;
  }
  function weighRemHTML() {
    if (!weighDue()) return "";
    const keys = Object.keys(state.weight).sort(),
      lastK = keys[keys.length - 1];
    const last = lastK ? `Última: ${fmtKg(state.weight[lastK])} kg em ${fmtD(lastK)}.` : "";
    return `<section class="wrem"><b>Hora de se pesar</b><span>Sempre na mesma balança e no mesmo horário. ${last}</span>
      <div class="row"><input id="w" type="text" inputmode="decimal" autocomplete="off" placeholder="kg, ex: 82,4" value="${esc(weightDraft)}">
      <button data-act="weight">Salvar</button></div>${wErr ? `<p class="ferr">${esc(wErr)}</p>` : ""}</section>`;
  }

  function savedPill(msg) {
    const el = document.createElement("div");
    el.className = "saved";
    el.setAttribute("role", "status");
    el.textContent = msg || "Salvo";
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add("in"));
    setTimeout(
      () => {
        el.classList.remove("in");
        setTimeout(() => el.remove(), 400);
      },
      msg ? 3500 : 1600,
    );
  }
  const growth = (n) => Math.pow(1.01, n);
  const LOCK = `<svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>`;

  function holiHTML() {
    for (let i = 0; i <= 3; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() + i);
      const k = key(d);
      if (!HOLI[k]) continue;
      const dn = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"][d.getDay()];
      const when =
        i === 0
          ? "Hoje é feriado"
          : i === 1
            ? `Amanhã (${pad(d.getDate())}/${pad(d.getMonth() + 1)}) é feriado`
            : `${dn} (${pad(d.getDate())}/${pad(d.getMonth() + 1)}) é feriado`;
      return `<section class="holi"><b>${when}: ${esc(HOLI[k])}</b><span>A academia costuma abrir em horário reduzido. Feriado não quebra a sequência.</span></section>`;
    }
    return "";
  }

  // ---------- dias que ficaram sem marcar ----------
  // Treinou e esqueceu de marcar? Os dias úteis sem treino da última semana que quebram a sequência
  // aparecem no Hoje pra marcar com um toque. Fim de semana e feriado só aparecem quando têm peso
  // anotado. Só avisa quando tem treino marcado antes do buraco e no máximo 3 dias em aberto: quem
  // ainda não começou ou parou de treinar não recebe aviso.
  const SKIP = "treinos-skip"; // dias em que a pessoa disse "não treinei" (só neste celular)
  function skippedDays() {
    try {
      const a = JSON.parse(localStorage.getItem(SKIP) || "[]");
      return Array.isArray(a) ? a : [];
    } catch (e) {
      return [];
    }
  }
  function skipDays(ks) {
    const from = new Date(today);
    from.setDate(from.getDate() - 21);
    const keep = skippedDays().filter((k) => k >= key(from));
    try {
      localStorage.setItem(SKIP, JSON.stringify([...new Set(keep.concat(ks))]));
    } catch (e) {}
  }
  const loadsOn = (k) =>
    Object.keys(state.loads).filter((n) => typeof (state.loads[n] || {})[k] === "number");
  function missedDays() {
    const skip = skippedDays(),
      gaps = [];
    const d = new Date(today);
    for (let i = 0; i < 7; i++) {
      d.setDate(d.getDate() - 1);
      if (d < parse(START)) break;
      const k = key(d);
      if (state.logs[k]) {
        // treino marcado antes do buraco: o buraco quebra uma sequência de verdade
        if (gaps.length) return gaps.length <= 3 ? gaps : [];
        continue;
      }
      if (skip.includes(k)) continue;
      if (!isOff(d) || loadsOn(k).length) gaps.push(k);
    }
    return [];
  }
  // O treino mais provável do dia: o que tem mais exercícios com peso anotado; empate fica com o previsto.
  function guessWorkout(k) {
    const planned = plannedFor(parse(k)),
      noted = loadsOn(k);
    const hits = (w) =>
      (planOf(w, k) || []).filter(([n]) =>
        (GRIP[n] ? GRIP[n].map((g) => loadKey(n, g, w === LIGHT)) : [loadKey(n, null, w === LIGHT)]).some(
          (lk) => noted.includes(lk),
        ),
      ).length;
    let best = planned,
      top = planned ? hits(planned) : 0;
    TYPES.forEach((w) => {
      const h = hits(w);
      if (h > top) {
        best = w;
        top = h;
      }
    });
    return best || "Outro";
  }
  // A sequência como ficaria com esses dias marcados.
  function streakWith(ks) {
    const add = ks.filter((k) => !state.logs[k]);
    add.forEach((k) => (state.logs[k] = "?"));
    const n = stats().streak;
    add.forEach((k) => delete state.logs[k]);
    return n;
  }
  function missHTML(miss) {
    if (!miss.length) return "";
    const dis = saving ? "disabled" : "";
    const one = miss.length === 1,
      n = streakWith(miss);
    const rows = miss
      .map((k) => {
        const wd = WDFULL[parse(k).getDay()],
          sub = guessWorkout(k) + (loadsOn(k).length ? " · tem peso anotado" : "");
        return `<li><button class="ms-d" data-act="miss-open" data-k="${k}" aria-label="Abrir ${wd.toLowerCase()}, ${fmtD(k)} pra escolher o treino"><b>${wd}, ${fmtD(k)}</b><span>${esc(sub)}</span></button><button class="ms-ok" data-act="miss-ok" data-k="${k}" ${dis}>Treinei</button></li>`;
      })
      .join("");
    const lead = n >= 2 ? `Se treinou, marca e a sequência volta pra ${n} dias.` : "Se treinou, marca aqui.";
    return `<section class="miss" aria-label="Dias sem treino marcado"><div class="ms-h"><b>${one ? "Ficou um dia sem marcar" : `Ficaram ${miss.length} dias sem marcar`}</b><span>${lead} Toca no dia pra escolher outro treino.</span></div>
      <ul class="ms-l">${rows}</ul><button class="lnk ms-no" data-act="miss-no" ${dis}>${one ? "Não treinei nesse dia" : "Não treinei nesses dias"}</button></section>`;
  }

  // Hoje: semana, dias sem marcar, retrospectiva nova, treino e corrida. A pesagem só aparece quando é hora.
  function hojeHTML(s) {
    const miss = missedDays();
    return (
      weekStripHTML(s, miss.length > 0) +
      missHTML(miss) +
      recapCardHTML() +
      holiHTML() +
      weighRemHTML() +
      checkHTML(s) +
      runHTML() +
      bkRemHTML()
    );
  }
  // Uma vez por semana, se tem treino anotado e nenhum backup recente, lembra de exportar. "Depois" adia 7 dias.
  function bkRemHTML() {
    if (IN_CLAUDE || !Object.keys(state.logs).length) return "";
    let at = "",
      later = "";
    try {
      at = localStorage.getItem("treinos-backup-em") || "";
      later = localStorage.getItem("treinos-backup-depois") || "";
    } catch (e) {}
    const days = /^\d{4}-\d{2}-\d{2}$/.test(at) ? Math.round((parse(todayKey) - parse(at)) / dayMs) : null;
    if ((days !== null && days < 7) || (later && todayKey < later)) return "";
    const msg =
      days === null
        ? "Teus treinos ficam só neste celular. Exporta um backup e guarda o arquivo, pra não perder nada."
        : `Teu último backup foi há ${days} dias. Exporta um novo e guarda o arquivo, pra não perder nada.`;
    return `<section class="wrem bkrem"><b>Backup</b><span>${msg}</span><div class="row"><button data-act="export">Exportar backup</button><button class="lnk" data-act="bk-later">Depois</button></div></section>`;
  }

  function nextWorkout() {
    const nd = new Date(today);
    nd.setDate(nd.getDate() + 1);
    if (!SPLIT[nd.getDay()] && OPTIONAL[nd.getDay()])
      return { lbl: "amanhã (opcional)", w: OPTIONAL[nd.getDay()] };
    let lbl = "amanhã";
    while (!SPLIT[nd.getDay()]) {
      nd.setDate(nd.getDate() + 1);
      lbl = WDFULL[nd.getDay()].toLowerCase();
    }
    if (HOLIDAYS[key(nd)]) lbl += " (feriado)";
    return { lbl, w: SPLIT[nd.getDay()] };
  }

  function loggedLoadsToday() {
    const light = picked === LIGHT;
    return (planOf(picked) || []).some(
      ([n]) =>
        isKg(n) &&
        (GRIP[n] ? GRIP[n].map((g) => loadKey(n, g, light)) : [loadKey(n, null, light)]).some(
          (lk) => typeof (state.loads[lk] || {})[todayKey] === "number",
        ),
    );
  }

  // missing: tem dia recente sem marcar (o aviso logo abaixo cuida da sequência)
  function weekStripHTML(s, missing) {
    const mon = monday(today),
      wdIdx = (today.getDay() + 6) % 7,
      done = !!state.logs[todayKey];
    const days = ["S", "T", "Q", "Q", "S", "S", "D"]
      .map((l, i) => {
        const d = new Date(mon);
        d.setDate(mon.getDate() + i);
        return `<i class="${state.logs[key(d)] ? "on" : ""} ${i > 4 ? "we" : ""} ${i === wdIdx ? "now" : ""}">${l}</i>`;
      })
      .join("");
    // Anotou peso de algum exercício do treino de hoje, mas ainda não marcou o treino.
    const pending = !done && loggedLoadsToday();
    const warn = pending || (!done && !isOff(today) && s.streak > 0);
    let msg = pending
      ? `Anotou pesos hoje. Quando terminar, marca o treino lá embaixo${s.streak > 0 ? ` pra chegar a ${s.streak + 1} dias seguidos` : ""}.`
      : warn
        ? `Treina hoje pra não zerar os ${s.streak} dias seguidos.`
        : !done && !isOff(today) && s.total > 0 && !missing
          ? "Sequência zerada. Treinando hoje, ela volta a contar."
          : headline(s);
    if (!pending && !missing && s.best > s.streak) msg += ` Seu recorde é ${s.best}.`;
    return `<section class="w7"><div class="w7-a"><b>${s.streak}</b><span>dia${s.streak === 1 ? "" : "s"}<br>seguido${s.streak === 1 ? "" : "s"}</span></div>
      <div class="w7-d" role="img" aria-label="Esta semana: ${s.week} treino${s.week === 1 ? "" : "s"}">${days}</div></section>
      <p class="w7-m ${warn ? "al" : ""}">${esc(msg)}</p>`;
  }

  function checkHTML(s) {
    const doneToday = state.logs[todayKey];
    const tDow = today.getDay();
    const isOpt = !SPLIT[tDow] && !!OPTIONAL[tDow];
    const wname = doneToday || picked;
    const list = planOf(wname);
    const nx = nextWorkout();
    const dis = saving ? "disabled" : "";
    const chipsOpen = showChips || (!SPLIT[tDow] && !isOpt);
    const cap = (x) => x.charAt(0).toUpperCase() + x.slice(1);
    let html = `<section class="check">`;
    if (!doneToday) {
      if (SPLIT[tDow] || isOpt || list) {
        const k = SPLIT[tDow]
          ? HOLIDAYS[todayKey]
            ? "Feriado, treino opcional"
            : "Treino de hoje"
          : isOpt && picked === OPTIONAL[tDow]
            ? "Sábado, treino leve (opcional)"
            : "Treino extra";
        const okN = list ? list.filter(([n]) => exOk(todayKey)[n]).length : 0;
        const count = !list
          ? ""
          : list.length
            ? `<div class="ex${okN === list.length ? " all" : ""}" aria-live="polite">${doneTxt(list.length, okN)}</div><div class="exp" aria-hidden="true">${list.map((_, i) => `<i${i < okN ? ' class="on"' : ""}></i>`).join("")}</div>`
            : `<div class="ex">Nenhum exercício no plano ainda</div>`;
        html += `<div class="plan"><div class="k">${k}</div><div class="w">${esc(picked)}</div>${count}</div>`;
      } else {
        html += `<div class="plan"><div class="k">Fim de semana</div><div class="w wlock">${LOCK}Descanso</div><div class="ex">${esc(cap(nx.lbl))}: ${esc(nx.w)}.</div></div>`;
      }
      if (list) {
        if (wname === LIGHT)
          html += `<p class="lightnote">Carga leve, uns 70% do normal, sem chegar na falha.</p>`;
        html += sessionHTML(wname);
      }
      const extra = !SPLIT[tDow] && !isOpt; // domingo: qualquer treino é extra
      const lbl = saving
        ? "Salvando…"
        : extra
          ? `Marcar treino extra: ${esc(picked)}`
          : list
            ? "Terminei o treino"
            : "Marcar treino como feito";
      html += `<button class="go" data-act="mark" ${dis}>${lbl}</button>`;
      const editL =
        list && dayOfWorkout(picked) !== null
          ? `<button class="lnk" data-act="plan-edit" data-w="${esc(picked)}">Editar exercícios</button>`
          : "";
      if (SPLIT[tDow] || isOpt || editL)
        html += `<div class="ck-a">${SPLIT[tDow] || isOpt ? `<button class="lnk swapl" data-act="swap">${chipsOpen ? "Fechar" : "Fiz outro treino hoje"}</button>` : ""}${editL}</div>`;
      if (chipsOpen)
        html +=
          `<div class="chips">` +
          TYPES.map(
            (t) =>
              `<button class="chip" data-type="${esc(t)}" aria-pressed="${t === picked}">${esc(t)}</button>`,
          ).join("") +
          `</div>`;
    } else {
      html += `<p class="done-msg">Feito: ${esc(doneToday)}</p>`;
      const ups = loadUps(todayKey, doneToday);
      if (ups.length)
        html += `<p class="done-up">${ups.length > 3 ? `Carga maior em ${ups.length} exercícios hoje.` : `Carga maior hoje: ${ups.map(esc).join(", ")}.`}</p>`;
      if (list) {
        html += `<button class="lnk exto" data-act="exopen" aria-expanded="${exOpen}">${exOpen ? "Esconder exercícios" : "Anotar os pesos de hoje"}</button>`;
        if (exOpen) html += sessionHTML(doneToday);
      }
      html += `<p class="nxt">Próximo treino, ${esc(nx.lbl)}: <b>${esc(nx.w)}</b></p>`;
      // marcou o treino errado? troca sem desmarcar (os pesos anotados ficam)
      if (retypeOpen && !undoConfirm)
        html +=
          `<div class="chips dn-chips" role="group" aria-label="Qual treino você fez hoje">` +
          TYPES.map(
            (t) =>
              `<button class="chip" data-retype="${esc(t)}" aria-pressed="${t === doneToday}" ${dis}>${esc(t)}</button>`,
          ).join("") +
          `</div>`;
      html += undoConfirm
        ? `<div class="confirm"><span>Desmarcar o treino de hoje?</span><button data-act="undook" ${dis}>Desmarcar</button><button data-act="undono">Cancelar</button></div>`
        : `<div class="dn-a"><button class="undo" data-act="retype" aria-expanded="${retypeOpen}" ${dis}>${retypeOpen ? "Fechar" : "Trocar o treino"}</button><button class="undo" data-act="undo" ${dis}>Desmarcar treino de hoje</button></div>`;
    }
    return html + `</section>`;
  }

  function runHTML() {
    return `<section class="runsec">${runBlockHTML()}</section>`;
  }

  // ritmo enquanto digita; sem argumentos, usa o formulário da corrida de hoje
  function pacePreview(kmRaw, timeRaw) {

    const light = workout === LIGHT,

    (planOf(workout, day) || []).forEach(([n]) => {
      if (!isKg(n)) return;
      const lk = loadKey(n, gripFor(n, day), light),
        cur = (state.loads[lk] || {})[day],
        prev = lastLoad(lk, day);
      if (typeof cur === "number" && prev && cur > prev.kg) out.push(`${lk} +${fmtKg(cur - prev.kg)} kg`);
    });
    return out;
  }
  // Ao desmarcar um treino, sai do histórico o peso daquele dia que só repetia o da vez anterior
  // (foi o "Terminei" que copiou). Peso que você mudou fica.
  function dropRepeatedLoads(day, workout) {
    const light = workout === LIGHT;
    (planOf(workout, day) || []).forEach(([n]) => {
      if (!isKg(n)) return;
      (GRIP[n] ? GRIP[n].map((g) => loadKey(n, g, light)) : [loadKey(n, null, light)]).forEach((lk) => {
        const h = state.loads[lk];
        if (!h || h[day] === undefined) return;
        const prev = lastLoad(lk, day);
        if (!prev || prev.kg !== h[day]) return;
        const c = Object.assign({}, h);
        delete c[day];
        if (Object.keys(c).length) state.loads[lk] = c;
        else delete state.loads[lk];
      });
    });
  }

  // ---------- progresso: séries por músculo e cargas ----------
  function plannedWeekSets() {
    const o = {};
    MUSCLES.forEach((m) => (o[m] = 0));
    for (const w of SPLIT_DAYS)
      (planOf(SPLIT[w]) || []).forEach(([, sp, g]) => {
        o[muscleOf(g)] += setsOf(sp);
      });
    return o;
  }
  function weekSets(mon) {
    const o = {};
    MUSCLES.forEach((m) => (o[m] = 0));
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      (planOf(state.logs[key(d)], key(d)) || []).forEach(([, sp, g]) => {
        o[muscleOf(g)] += setsOf(sp);
      });
    }
    return o;
  }
  function volumeHTML() {
    const done = weekSets(monday(today)),
      plan = plannedWeekSets();
    const any = MUSCLES.some((m) => done[m] > 0);
    let h = `<h2>Séries por músculo na semana</h2><section class="vol">`;
    MUSCLES.filter((m) => plan[m] || done[m]).forEach((m) => {
      const p = plan[m] || 0,
        v = done[m],
        pct = p ? Math.min(100, (v / p) * 100) : v ? 100 : 0;
      h += `<div class="vo-r"><span>${m}</span><div class="vo-b"><i style="width:${pct.toFixed(1)}%"></i></div><b>${v}<small> de ${p}</small></b></div>`;
    });
    h += `<p>${any ? "Séries do plano nos treinos que você marcou, contra o que a semana prevê." : "Marca os treinos e aqui aparece quanto cada músculo trabalhou na semana."}</p></section>`;
    return h;
  }
  // ---------- gráfico de evolução (aba Pesos e barra fixa) ----------
  // Linha fina com um ponto por registro. Rótulo só no último valor e no recorde; tocar no gráfico
  // (ou passar o mouse, ou usar as setas do teclado) mostra o valor de cada dia, e a lista completa
  // fica em "Ver os registros".
  let charts = {};
  const CHART_ICON = `<svg class="ci" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12l4-4 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  // 3 ou 4 linhas de grade em números redondos; tempo e repetições só em números inteiros
  function niceTicks(lo, hi, whole) {
    const raw = (hi - lo) / 3 || 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const mults = whole ? [1, 2, 5, 10] : [1, 2, 2.5, 5, 10];
    const step = Math.max(
      whole ? 1 : 0,
      mults.map((m) => m * p).find((x) => x >= raw),
    );
    const first = Math.floor(lo / step + 1e-9) * step,
      last = Math.ceil(hi / step - 1e-9) * step;
    const out = [];
    for (let v = first; v <= last + step / 2; v += step) out.push(Math.round(v * 100) / 100);
    return out.length > 1 ? out : [first, first + step];
  }
  function chartLabel(c, i) {
    const p = c.pts[i];
    return [fmtD(p.d), i === c.pts.length - 1 ? "último registro" : "", p.v === c.best ? "recorde" : ""]
      .filter(Boolean)
      .join(" · ");
  }
  // goal: na barra fixa o eixo começa no zero e mostra a linha da meta
  function lineChartHTML(id, hs, unit, name, goal) {
    // a largura do desenho é a da tela, então o texto do gráfico sai no tamanho certo
    const W = Math.max(240, Math.min(516, (document.documentElement.clientWidth || 390) - 44)),
      H = 136,
      L = 32,
      R = 14,
      T = 20,
      B = 24;
    const vals = hs.map((x) => x.kg);
    let lo = Math.min(...vals),
      hi = Math.max(...vals);
    if (goal) {
      lo = 0;
      hi = Math.max(hi, goal);
    } else if (lo === hi) {
      const pad = unit === "kg" ? 2.5 : unit === "s" ? 5 : 1;
      lo = Math.max(0, lo - pad);
      hi += pad;
    }
    const ticks = niceTicks(lo, hi, unit !== "kg"),
      y0 = ticks[0],
      y1 = ticks[ticks.length - 1];
    const t0 = parse(hs[0].d).getTime(),
      t1 = parse(hs[hs.length - 1].d).getTime();
    const X = (d) => L + ((parse(d).getTime() - t0) / (t1 - t0 || 1)) * (W - L - R);
    const Y = (v) => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
    const pts = hs.map((x) => ({ x: X(x.d), y: Y(x.kg), v: x.kg, d: x.d }));
    const best = Math.max(...vals),
      iBest = vals.indexOf(best),
      iLast = pts.length - 1;
    const c = { pts, unit, best, W };
    charts[id] = c;
    const f1 = (n) => n.toFixed(1);
    let g = ticks
      .map(
        (v) =>
          `<line class="lc-g" x1="${L}" x2="${W - R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}"/><text class="lc-t" x="${L - 7}" y="${f1(Y(v) + 3.5)}" text-anchor="end">${fmtKg(v)}</text>`,
      )
      .join("");
    if (goal)
      g += `<line class="lc-goal" x1="${L}" x2="${W - R}" y1="${f1(Y(goal))}" y2="${f1(Y(goal))}"/><text class="lc-t" x="${L + 4}" y="${f1(Y(goal) - 5)}" text-anchor="start">meta ${fmtUnit(goal, unit)}</text>`;
    g += `<path class="lc-l" d="${pts.map((p, i) => `${i ? "L" : "M"}${f1(p.x)} ${f1(p.y)}`).join(" ")}"/>`;
    g += `<line class="lc-x" x1="0" x2="0" y1="${T - 8}" y2="${H - B}" visibility="hidden"/>`;
    g += pts.map((p) => `<circle class="lc-p" cx="${f1(p.x)}" cy="${f1(p.y)}" r="4"/>`).join("");
    g += `<circle class="lc-h" cx="0" cy="0" r="6" visibility="hidden"/>`;
    const lab = (p, cls) =>
      `<text class="${cls}" x="${f1(p.x)}" y="${f1(p.y - 9)}" text-anchor="${p.x > W - R - 16 ? "end" : p.x < L + 16 ? "start" : "middle"}">${fmtKg(p.v)}</text>`;
    g += lab(pts[iLast], "lc-v");
    const pb = pts[iBest],
      pl = pts[iLast];
    if (iBest !== iLast && (Math.abs(pb.x - pl.x) > 36 || Math.abs(pb.y - pl.y) > 16))
      g += lab(pb, "lc-v lc-vb");
    g += `<text class="lc-t" x="${L}" y="${H - 6}" text-anchor="start">${fmtD(hs[0].d)}</text><text class="lc-t" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtD(hs[iLast].d)}</text>`;
    const sum = `Evolução de ${name}: de ${fmtUnit(vals[0], unit)} em ${fmtD(hs[0].d)} a ${fmtUnit(vals[iLast], unit)} em ${fmtD(hs[iLast].d)}, ${hs.length} registros. Recorde: ${fmtUnit(best, unit)}.`;
    const rows = hs
      .slice()
      .reverse()
      .map((x, i, a) => {
        const prev = a[i + 1],
          d = prev ? x.kg - prev.kg : 0;
        return `<tr><td>${fmtD(x.d)}</td><td>${fmtUnit(x.kg, unit)}</td><td>${d ? `${d > 0 ? "+" : "−"}${fmtKg(Math.abs(d))}` : ""}</td></tr>`;
      })
      .join("");
    return `<div class="lc" data-lc="${esc(id)}"><p class="lc-r" aria-live="polite"><b>${fmtUnit(pl.v, unit)}</b><span>${chartLabel(c, iLast)}</span></p>
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" tabindex="0" aria-label="${esc(sum)}">${g}</svg>
      <details class="lc-tab"><summary>Ver os ${hs.length} registros</summary><table><tbody>${rows}</tbody></table></details></div>`;
  }
  // mostra o ponto i do gráfico: linha vertical, ponto em destaque e o valor em cima
  function chartPick(el, i) {
    const c = charts[el.dataset.lc];
    if (!c) return;
    i = Math.max(0, Math.min(c.pts.length - 1, i));
    el.dataset.i = i;
    const p = c.pts[i],
      svg = el.querySelector("svg");
    const x = svg.querySelector(".lc-x"),
      h = svg.querySelector(".lc-h");
    x.setAttribute("x1", p.x);
    x.setAttribute("x2", p.x);
    x.setAttribute("visibility", "visible");
    h.setAttribute("cx", p.x);
    h.setAttribute("cy", p.y);
    h.setAttribute("visibility", "visible");
    const r = el.querySelector(".lc-r");
    r.querySelector("b").textContent = fmtUnit(p.v, c.unit);
    r.querySelector("span").textContent = chartLabel(c, i);
  }
  function chartAt(e) {
    const svg = e.target.closest && e.target.closest(".lc svg");
    if (!svg) return;
    const el = svg.closest(".lc"),
      c = charts[el.dataset.lc];
    if (!c) return;
    if (e.type === "pointerdown") e.preventDefault(); // tocar não deixa o gráfico com contorno de foco
    const box = svg.getBoundingClientRect(),
      vx = ((e.clientX - box.left) / box.width) * c.W;
    let near = 0;
    c.pts.forEach((p, i) => {
      if (Math.abs(p.x - vx) < Math.abs(c.pts[near].x - vx)) near = i;
    });
    chartPick(el, near);
  }

  // ---------- barra fixa: caminho até a primeira barra ----------
  const joinPt = (a) => (a.length > 1 ? `${a.slice(0, -1).join(", ")} e ${a[a.length - 1]}` : a[0] || "");
  function barStep(n, label, unitTxt) {
    const hs = loadHist(n),
      goal = BAR_GOALS[n];
    const best = hs.length ? Math.max(...hs.map((x) => x.kg)) : 0,
      ok = best >= goal;
    const pct = Math.min(100, (best / goal) * 100);
    const status = ok ? "Feito" : best ? `${fmtKg(best)} de ${goal} ${unitTxt}` : "Sem registro ainda";
    return {
      ok,
      hs,
      html: `<li class="${ok ? "ok" : ""}"><div class="pb-h"><b>${label}</b><span>${status}</span></div><div class="pb-b" role="img" aria-label="${Math.round(pct)}%"><i style="width:${pct.toFixed(1)}%"></i></div></li>`,
    };
  }
  function barHTML() {
    // A negativa saiu do plano: o passo dela só aparece pra quem já tinha anotado alguma.
    const a = barStep(HANG, `Aguentar ${BAR_GOALS[HANG]} s pendurado`, "s"),
      b = loadHist(NEG).length
        ? barStep(NEG, `Fazer ${BAR_GOALS[NEG]} negativas seguidas`, "negativas")
        : null,
      ready = a.ok && (!b || b.ok);
    let h = `<h2>Caminho até a primeira barra</h2><section class="pb"><ol class="pb-s">${a.html}${b ? b.html : ""}<li class="${ready ? "ok" : ""}"><div class="pb-h"><b>Primeira barra</b><span>${ready ? "Pronto pra tentar" : b ? "Depois das duas metas" : "Depois da meta"}</span></div></li></ol>`;
    if (ready)
      h += `<p class="pb-tip">Já dá pra tentar: mãos na largura dos ombros, puxa sem balançar o corpo e sobe até o queixo passar da barra.</p>`;
    [
      [HANG, a.hs, "s", "Tempo pendurado"],
      [NEG, b ? b.hs : [], "reps", "Negativas"],
    ].forEach(([n, hs, unit, title]) => {
      if (hs.length > 1)
        h +=
          `<h3 class="pb-t">${title}</h3>` +
          lineChartHTML("pb:" + n, hs, unit, title.toLowerCase(), BAR_GOALS[n]);
      else if (hs.length === 1)
        h += `<h3 class="pb-t">${title}</h3><p class="lc-one">Primeiro registro: ${fmtUnit(hs[0].kg, unit)} em ${fmtD(hs[0].d)}.</p>`;
    });
    if (!a.hs.length) h += `<p class="pb-n">Anota no fim de cada treino quanto tempo aguentou pendurado.</p>`;
    return h + `</section>`;
  }

  // ---------- Progresso: evolução das cargas ----------
  // Todos os exercícios com peso anotado: do primeiro registro ao atual, com a linha da evolução.
  // Tocar abre o gráfico completo na aba Pesos.
  function loadsProgHTML() {
    const rows = Object.keys(state.loads)
      .filter((k) => isKg(k) && !/leve\)$/.test(k))
      .map((k) => {
        const hs = loadHist(k);
        return hs.length ? { k, hs, a: hs[0].kg, b: hs[hs.length - 1].kg } : null;
      })
      .filter(Boolean)
      .sort((x, y) => y.b - y.a - (x.b - x.a) || (x.k < y.k ? -1 : 1));
    let h = `<h2>Evolução das cargas</h2><section class="lp">`;
    if (!rows.length)
      return (
        h +
        `<p class="lp-n">Anota os pesos no treino e aqui aparece quanto cada exercício subiu.</p></section>`
      );
    const ups = rows.filter((r) => r.b > r.a).length,
      planKeys = SPLIT_DAYS.flatMap((i) => pesoRows(SPLIT[i]));
    h += `<p class="lp-n">A carga subiu em ${ups} de ${rows.length} exercícios desde o primeiro registro. Toca num exercício pra ver o gráfico.</p><ul class="lp-l">`;
    rows.forEach((r) => {
      const d = r.b - r.a;
      let sp = "";
      if (r.hs.length > 1) {
        const lo = Math.min(...r.hs.map((x) => x.kg)),
          hi = Math.max(...r.hs.map((x) => x.kg)),
          t0 = parse(r.hs[0].d).getTime(),
          t1 = parse(r.hs[r.hs.length - 1].d).getTime();
        const pts = r.hs
          .map(
            (x) =>
              `${(2 + ((parse(x.d).getTime() - t0) / (t1 - t0 || 1)) * 52).toFixed(1)},${(18 - ((x.kg - lo) / (hi - lo || 1)) * 14).toFixed(1)}`,
          )
          .join(" ");
        sp = `<svg viewBox="0 0 56 20" aria-hidden="true"><polyline points="${pts}"/></svg>`;
      }
      // exercício que saiu do plano não tem gráfico na aba Pesos: fica só a linha, sem botão
      const inner = `<span><b>${esc(r.k)}</b><em>${r.hs.length > 1 ? `${fmtKg(r.a)} → ${fmtKg(r.b)} kg` : `${fmtKg(r.b)} kg, um registro`}</em></span>${sp}<i class="${d > 0 ? "up" : ""}">${d > 0 ? `+${fmtKg(d)} kg` : d < 0 ? `−${fmtKg(-d)} kg` : "="}</i>`;
      h += planKeys.includes(r.k)
        ? `<li><button data-lp="${esc(r.k)}">${inner}</button></li>`
        : `<li><div class="lp-x">${inner}</div></li>`;
    });
    return h + `</ul></section>`;
  }

  // ---------- aba Pesos ----------
  // Cada treino abre a lista dos exercícios com o peso que você usa hoje. Mudou o peso? Anota aqui ou no treino.
  // "Editar exercícios" vira a lista do treino pra montar: subir e descer, mudar séries e repetições e excluir
  // (com desfazer). "Novo exercício" cria um exercício (ou pega um que já existe) e põe nos dias escolhidos.
  // os treinos da semana, na ordem dos dias: de segunda a sábado
  const weekWorkouts = () => [1, 2, 3, 4, 5, 6].map((d) => SPLIT[d] || OPTIONAL[d]).filter(Boolean);
  function dayOfWorkout(w) {
    for (let d = 1; d <= 6; d++) if ((SPLIT[d] || OPTIONAL[d]) === w) return d;
    return null;
  }
  const dayName = (w) => (dayOfWorkout(w) === null ? "" : WDFULL[dayOfWorkout(w)]); // "Segunda"
  const dayLabel = (w) =>
    dayName(w) + (dayOfWorkout(w) !== null && !SPLIT[dayOfWorkout(w)] ? " (opcional)" : "");
  function pesoRows(w) {
    const rows = [],
      light = w === LIGHT;
    (planOf(w) || []).forEach(([n]) => {
      if (!isKg(n)) return;
      (GRIP[n] ? GRIP[n].map((g) => loadKey(n, g, light)) : [loadKey(n, null, light)]).forEach((k) => {
        if (!rows.includes(k)) rows.push(k);
      });
    });
    return rows;
  }
  let planEdit = null, // treino aberto pra montar, na aba Pesos
    justAdded = null; // o exercício que acabou de entrar: fica marcado na lista por um instante
  const SVG_A = `viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"`;
  const ICON_UP = `<svg ${SVG_A} stroke-width="2.4"><path d="M6 15l6-6 6 6"/></svg>`;
  const ICON_DOWN = `<svg ${SVG_A} stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>`;
  const ICON_DEL = `<svg ${SVG_A} stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`;
  const ICON_EDIT = `<svg ${SVG_A} stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>`;
  const ICON_PLUS = `<svg ${SVG_A} stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>`;
  // "3x10, peito" (e "peso do corpo" quando não tem peso pra anotar)
  const exLine = (n, sp, g) => `${sp}, ${muscleOf(g).toLowerCase()}${isBody(n) ? ", peso do corpo" : ""}`;
  function planEditHTML(w) {
    const list = planOf(w) || [],
      last = list.length - 1,
      wq = esc(w);
    const rows = list
      .map(([n, sp, g], i) => {
        const nq = esc(n);
        return `<li${justAdded === n ? ' class="new"' : ""}><div class="pe-mv"><button data-exmove="-1" data-w="${wq}" data-i="${i}" aria-label="Subir ${nq}" ${i ? "" : "disabled"}>${ICON_UP}</button><button data-exmove="1" data-w="${wq}" data-i="${i}" aria-label="Descer ${nq}" ${i < last ? "" : "disabled"}>${ICON_DOWN}</button></div><button class="pe-x" data-exedit="${i}" data-w="${wq}" aria-label="Mudar séries e repetições de ${nq}"><b>${nq}</b><span>${esc(exLine(n, sp, g))}${ICON_EDIT}</span></button><button class="pe-del" data-exdel="${i}" data-w="${wq}" aria-label="Excluir ${nq} do treino">${ICON_DEL}</button></li>`;
      })
      .join("");
    return `<div class="pe"><p class="pe-n">As mudanças valem a partir de hoje. Os treinos que já passaram ficam como foram feitos.</p>${
      list.length
        ? `<ol class="pe-l">${rows}</ol>`
        : `<p class="pe-e">Nenhum exercício neste treino ainda.</p>`
    }<div class="pe-a"><button class="pe-add" data-act="ex-new" data-w="${wq}">${ICON_PLUS}Adicionar exercício</button><button class="pe-ok" data-act="plan-done" data-w="${wq}">Pronto</button></div></div>`;
  }
  function pesosHTML() {
    const order = weekWorkouts();
    const nx = nextWorkout().w;
    const open =
      ldOpen !== null
        ? ldOpen
        : order.includes(state.logs[todayKey])
          ? state.logs[todayKey]
          : SPLIT[today.getDay()] || OPTIONAL[today.getDay()] || (order.includes(nx) ? nx : order[0]);
    let h = `<h2 class="first">Pesos por treino</h2><p class="qsub">Anota o peso de cada exercício. O treino do dia puxa daqui. Toca no nome pra ver a evolução.</p><button class="pe-new" data-act="ex-new">${ICON_PLUS}Novo exercício</button>`;
    order.forEach((w) => {
      const rows = pesoRows(w),
        isOpen = w === open,
        editing = isOpen && planEdit === w,
        light = w === LIGHT,
        plan = planOf(w) || [];
      const bases = [...new Set(plan.map((e) => e[0]).filter(isKg))];
      const filled = bases.filter((n) =>
        (GRIP[n] ? GRIP[n].map((g) => loadKey(n, g, light)) : [loadKey(n, null, light)]).some(
          (k) => loadHist(k).length,
        ),
      ).length;
      const sub = editing
        ? `${plan.length} ${sOf(plan.length, "exercício", "exercícios")}`
        : `${filled} de ${bases.length} com peso`;
      h += `<section class="pw ${isOpen ? "open" : ""} ${editing ? "editing" : ""}" data-pww="${esc(w)}"><button class="pw-h" data-pw="${esc(w)}" aria-expanded="${isOpen}"><span><b>${esc(w)}</b><em>${dayLabel(w)}, ${sub}</em></span></button>`;
      if (editing) h += planEditHTML(w);
      else if (isOpen) {
        h += rows.length
          ? `<ul class="pw-l">` +
            rows
              .map((k) => {
                const hs = loadHist(k),
                  last = hs.length ? hs[hs.length - 1] : null;
                const val = kgDraft[k] !== undefined ? kgDraft[k] : last ? fmtKg(last.kg) : "";
                let sub = "";
                if (hs.length > 1) {
                  const first = hs[0],
                    pr = Math.max(...hs.map((x) => x.kg));
                  if (last.kg > first.kg) sub = `+${fmtKg(last.kg - first.kg)} kg desde ${fmtD(first.d)}`;
                  if (pr > last.kg) sub += `${sub ? ". " : ""}Recorde: ${fmtKg(pr)} kg`;
                } else if (last) sub = `Anotado em ${fmtD(last.d)}`;
                const open = chartOpen === k && hs.length > 0;
                const label = `<b>${esc(k)}${hs.length ? CHART_ICON : ""}</b>${sub ? `<span>${esc(sub)}</span>` : ""}`;
                const head = hs.length
                  ? `<button class="pw-n" data-chart="${esc(k)}" aria-expanded="${open}" aria-label="${open ? "Esconder" : "Ver"} a evolução de ${esc(k)}">${label}</button>`
                  : `<div class="pw-n">${label}</div>`;
                const body = !open
                  ? ""
                  : hs.length > 1
                    ? lineChartHTML("pw:" + k, hs, "kg", k)
                    : `<p class="lc-one">Só um registro até agora: ${fmtUnit(last.kg)} em ${fmtD(last.d)}. Anota de novo no próximo treino pra ver a evolução.</p>`;
                return `<li class="${open ? "open" : ""}"><div class="pw-r">${head}<label class="kg"><input data-kg="${esc(k)}" type="text" inputmode="decimal" autocomplete="off" value="${esc(val)}" aria-label="Peso em kg, ${esc(k)}"><span>kg</span></label></div>${body}</li>`;
              })
              .join("") +
            `</ul>`
          : `<p class="pe-e">Nenhum exercício com peso neste treino.</p>`;
        h += `<button class="pe-go" data-act="plan-edit" data-w="${esc(w)}">${ICON_EDIT}Editar exercícios</button>`;
      }
      h += `</section>`;
    });
    return h;
  }

  // ---------- folha de exercício: criar um novo ou mudar séries e repetições ----------
  let exSheet = null;
  const normTxt = (v) =>
    String(v)
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/\s+/g, " ")
      .trim();
  // os exercícios que o app conhece: os do plano de sempre, os de planos antigos e os criados aqui
  function exCatalog() {
    const out = {};
    const add = (e) => (out[e[0]] = { n: e[0], sp: e[1], g: e[2] });
    Object.values(PLANS).forEach((l) => l.forEach(add));
    Object.keys(LEGACY).forEach((n) => add([n, "3x10", LEGACY[n]]));
    Object.keys(state.plan)
      .sort()
      .forEach((d) => {
        const day = state.plan[d];
        if (isObj(day)) for (const w in day) if (Array.isArray(day[w])) day[w].filter(validEx).forEach(add);
      });
    return Object.values(out);
  }
  const findEx = (name) => {
    const t = normTxt(name);
    return t ? exCatalog().find((x) => normTxt(x.n) === t) || null : null;
  };
  // "3x12" -> 3 séries de 12; "3x30s" -> 3 séries de 30 segundos
  function specParts(sp) {
    const [a, b = ""] = String(sp).split("x");
    return { sets: parseInt(a, 10) || 3, reps: parseInt(b, 10) || 10, secs: /s\s*$/.test(b) };
  }
  const specOf = (x) => `${x.sets}x${x.reps}${x.secs ? "s" : ""}`;
  const XS_LIM = { sets: [1, 8, 1], reps: [1, 50, 1], secs: [5, 300, 5] }; // mínimo, máximo, passo
  function openExNew(w) {
    const t = state.logs[todayKey] || SPLIT[today.getDay()] || OPTIONAL[today.getDay()];
    const pre = w || (dayOfWorkout(t) !== null ? t : null);
    exSheet = {
      mode: "add",
      from: w || null,
      name: "",
      days: pre ? [pre] : [],
      sets: 3,
      reps: 12,
      secs: false,
      kind: "kg",
      g: "",
      known: null,
      err: "",
      shown: false,
    };
    render();
    const el = document.getElementById("xs-name");
    if (el) el.focus({ preventScroll: true });
  }
  function openExEdit(w, i) {
    const e = (planOf(w) || [])[i];
    if (!e) return;
    exSheet = Object.assign(
      {
        mode: "edit",
        w,
        i,
        name: e[0],
        days: [w],
        kind: exKind(e[0]),
        g: e[2],
        known: null,
        err: "",
        shown: false,
      },
      specParts(e[1]),
    );
    render();
    const el = document.querySelector('.xs [data-xs="sets"][data-d="1"]');
    if (el) el.focus({ preventScroll: true });
  }
  const wSel = (w) => (window.CSS ? window.CSS.escape(w) : w);
  function focusSel(sel) {
    const el = sel && document.querySelector(sel);
    if (el) el.focus({ preventScroll: true });
  }
  function closeExSheet() {
    const back = exSheet && exSheet.back;
    exSheet = null;
    render();
    focusSel(back);
  }
  function xsMatches() {
    const t = normTxt(exSheet.name);
    if (t.length < 2) return [];
    return exCatalog()
      .filter((x) => normTxt(x.n).includes(t) && normTxt(x.n) !== t)
      .slice(0, 4);
  }
  const xsSugHTML = () =>
    xsMatches()
      .map(
        (x) =>
          `<button class="xs-s" data-xssug="${esc(x.n)}"><b>${esc(x.n)}</b><span>${esc(exLine(x.n, x.sp, x.g))}</span></button>`,
      )
      .join("");
  function xsHint() {
    const k = exSheet.known;
    if (!k) return "";
    const ins = weekWorkouts().filter((w) => (planOf(w) || []).some((e) => e[0] === k.n));
    return `Esse já existe${ins.length ? `: está no treino de ${joinPt(ins.map((w) => dayName(w).toLowerCase()))}` : ""}. Os pesos que tu anotou nele continuam valendo.`;
  }
  const stepLabel = (k, d) =>
    k === "sets"
      ? d < 0
        ? "Menos uma série"
        : "Mais uma série"
      : exSheet.secs
        ? d < 0
          ? "Menos 5 segundos"
          : "Mais 5 segundos"
        : d < 0
          ? "Menos uma repetição"
          : "Mais uma repetição";
  const stepHTML = (k, v, lab) =>
    `<div class="stp" role="group" aria-labelledby="${lab}"><button data-xs="${k}" data-d="-1" aria-label="${stepLabel(k, -1)}">−</button><output id="xs-${k}" aria-live="polite">${v}</output><button data-xs="${k}" data-d="1" aria-label="${stepLabel(k, 1)}">+</button></div>`;
  function exSheetHTML() {
    const x = exSheet;
    if (!x) return "";
    const add = x.mode === "add",
      still = x.shown ? " still" : "";
    x.shown = true;
    const chip = (attr, val, label, on) =>
      `<button class="chip" ${attr}="${esc(val)}" aria-pressed="${on}" ${x.known ? "disabled" : ""}>${label}</button>`;
    let body = "";
    if (add)
      body += `<label class="xf"><span class="xf-l">Nome</span><input id="xs-name" type="text" maxlength="40" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" placeholder="Ex.: Leg press" value="${esc(x.name)}"></label>
        <div class="xs-sug" id="xs-sug">${xsSugHTML()}</div><p class="xs-hint" id="xs-hint">${esc(xsHint())}</p>
        <div class="xf"><span class="xf-l" id="xs-dl">Dias</span><div class="xs-days" role="group" aria-labelledby="xs-dl">${weekWorkouts()
          .map(
            (w) =>
              `<button class="xs-day" data-xsday="${esc(w)}" aria-pressed="${x.days.includes(w)}"><b>${esc(dayLabel(w))}</b><span>${esc(w)}</span></button>`,
          )
          .join("")}</div></div>`;
    body += `<div class="xs-row"><div class="xf"><span class="xf-l" id="xs-sl">Séries</span>${stepHTML("sets", x.sets, "xs-sl")}</div>
      <div class="xf"><span class="xf-l" id="xs-rl">${x.secs ? "Segundos" : "Repetições"}</span>${stepHTML("reps", x.reps, "xs-rl")}
      <div class="xs-unit" role="group" aria-label="Contar em"><button data-xsunit="reps" aria-pressed="${!x.secs}">repetições</button><button data-xsunit="s" aria-pressed="${x.secs}">segundos</button></div></div></div>`;
    if (add)
      body += `<div class="xf"><span class="xf-l" id="xs-kl">Tipo</span><div class="chips xs-ch" role="group" aria-labelledby="xs-kl">${chip("data-xskind", "kg", "Com peso", x.kind === "kg")}${chip("data-xskind", "corpo", "Peso do corpo", x.kind === "corpo")}</div></div>
        <div class="xf"><span class="xf-l" id="xs-gl">Músculo</span><div class="chips xs-ch" role="group" aria-labelledby="xs-gl">${MUSCLES.map((m) => chip("data-xsg", m, m, muscleOf(x.g) === m)).join("")}</div></div>`;
    const title = add ? "Novo exercício" : esc(x.name),
      sub = add
        ? "Cria um exercício ou escolhe um que já existe, e marca os dias em que ele entra."
        : `${esc(x.w)}, ${esc(dayLabel(x.w).toLowerCase())}`;
    return `<div class="sheet-bg" data-act="xs-close"></div><div class="sheet xs${still}" role="dialog" aria-modal="true" aria-labelledby="xs-t">
      <div class="sh-grab"></div><div class="sh-h"><b id="xs-t">${title}</b><span>${sub}</span></div>${body}
      <p class="ferr xs-err" id="xs-err" role="alert">${esc(x.err)}</p>
      <button class="go" data-act="xs-save">${add ? "Adicionar" : "Salvar"}</button>${add ? "" : `<button class="pe-rm" data-act="xs-del">${ICON_DEL}Excluir do treino</button>`}
      <button class="sh-x" data-act="xs-close">Cancelar</button></div>`;
  }
  // atualiza a folha aberta sem redesenhar a tela (o teclado e o foco ficam onde estão)
  function xsSync() {
    const x = exSheet,
      el = document.querySelector(".sheet.xs");
    if (!x || !el) return;
    const q = (sel) => el.querySelector(sel);
    if (q("#xs-sug")) q("#xs-sug").innerHTML = xsSugHTML();
    if (q("#xs-hint")) q("#xs-hint").textContent = xsHint();
    el.querySelectorAll("[data-xsday]").forEach((b) =>
      b.setAttribute("aria-pressed", String(x.days.includes(b.dataset.xsday))),
    );
    el.querySelectorAll("[data-xskind]").forEach((b) => {
      b.setAttribute("aria-pressed", String(x.kind === b.dataset.xskind));
      b.disabled = !!x.known;
    });
    el.querySelectorAll("[data-xsg]").forEach((b) => {
      b.setAttribute("aria-pressed", String(!!x.g && muscleOf(x.g) === b.dataset.xsg));
      b.disabled = !!x.known;
    });
    q("#xs-sets").textContent = x.sets;
    q("#xs-reps").textContent = x.reps;
    q("#xs-rl").textContent = x.secs ? "Segundos" : "Repetições";
    el.querySelectorAll("[data-xs]").forEach((b) =>
      b.setAttribute("aria-label", stepLabel(b.dataset.xs, +b.dataset.d)),
    );
    el.querySelectorAll("[data-xsunit]").forEach((b) =>
      b.setAttribute("aria-pressed", String((b.dataset.xsunit === "s") === x.secs)),
    );
    q("#xs-err").textContent = x.err;
  }
  // nome digitado: se for um exercício que já existe, o tipo e o músculo vêm dele
  function xsName(v) {
    const x = exSheet;
    x.name = v;
    x.err = "";
    x.known = findEx(v);
    if (x.known) {
      x.kind = exKind(x.known.n);
      x.g = x.known.g;
    }
    xsSync();
  }
  function xsPick(n) {
    const k = exCatalog().find((e) => e.n === n);
    if (!k) return;
    Object.assign(exSheet, specParts(k.sp), { name: k.n, known: k, kind: exKind(k.n), g: k.g, err: "" });
    const el = document.getElementById("xs-name");
    if (el) el.value = k.n;
    xsSync();
  }
  function xsStep(k, d) {
    const x = exSheet,
      [lo, hi, step] = k === "sets" ? XS_LIM.sets : x.secs ? XS_LIM.secs : XS_LIM.reps;
    x[k] = Math.max(lo, Math.min(hi, x[k] + d * step));
    xsSync();
  }
  function xsUnit(secs) {
    const x = exSheet;
    if (x.secs === secs) return;
    x.secs = secs;
    x.reps = secs ? 30 : 12;
    xsSync();
  }
  function xsErr(msg) {
    exSheet.err = msg;
    xsSync();
    const e = document.getElementById("xs-err");
    if (e) e.scrollIntoView({ block: "nearest" });
  }
  const dayList = (ws) => joinPt(ws.map((w) => dayName(w).toLowerCase()));
  // toda mudança no plano: guarda no celular, publica depois de uma pausa e oferece desfazer
  function planChange(fn, msg) {
    const prev = isObj(state.plan[todayKey]) ? JSON.parse(JSON.stringify(state.plan[todayKey])) : undefined;
    fn();
    softSave(30000);
    snack(msg, () => {
      const p = Object.assign({}, state.plan);
      if (prev === undefined) delete p[todayKey];
      else p[todayKey] = prev;
      state.plan = p;
      kindMemo = null;
      softSave(30000);
    });
  }
  function xsSave() {
    const x = exSheet;
    if (x.mode === "edit") {
      const list = (planOf(x.w) || []).slice(),
        e = list[x.i];
      if (!e) return closeExSheet();
      const sp = specOf(x);
      exSheet = null;
      if (sp === e[1]) {
        render();
        return focusSel(x.back);
      }
      planChange(() => {
        list[x.i] = [e[0], sp, e[2]].concat(e[3] ? [e[3]] : []);
        setPlan(x.w, list);
      }, `${e[0]}: agora ${sp}.`);
      focusSel(x.back);
      return;
    }
    const typed = x.name.trim().replace(/\s+/g, " ");
    if (!typed) return xsErr("Escreve o nome do exercício.");
    const k = findEx(typed),
      name = k ? k.n : typed.charAt(0).toUpperCase() + typed.slice(1);
    if (!k && !x.g) return xsErr("Escolhe o músculo que ele trabalha.");
    if (!x.days.length) return xsErr("Escolhe pelo menos um dia.");
    const kind = k ? customKinds()[k.n] : x.kind,
      entry = [name, specOf(x), k ? k.g : x.g].concat(kind ? [kind] : []);
    const had = x.days.filter((w) => (planOf(w) || []).some((e) => e[0] === name)),
      to = weekWorkouts().filter((w) => x.days.includes(w) && !had.includes(w));
    if (!to.length)
      return xsErr(
        `${name} já está ${had.length > 1 ? "nesses treinos" : `no treino de ${dayName(had[0]).toLowerCase()}`}.`,
      );
    exSheet = null;
    // abre o treino montando, com o exercício novo no fim da lista
    planEdit = ldOpen = x.from && to.includes(x.from) ? x.from : to[0];
    justAdded = name;
    if (tab !== "pesos") tab = "pesos";
    planChange(
      () => to.forEach((w) => setPlan(w, (planOf(w) || []).concat([entry]))),
      `${name} entrou ${to.length > 1 ? "nos treinos" : "no treino"} de ${dayList(to)}.${had.length ? ` Já estava no de ${dayList(had)}.` : ""}`,
    );
    showAdded();
  }
  // o fim da lista do treino aberto, onde entrou o exercício novo
  function showAdded() {
    const li = document.querySelector(".pe-l li.new");
    justAdded = null;
    if (!li) return;
    li.scrollIntoView({ block: "center", behavior: calm() ? "auto" : "smooth" });
    li.querySelector(".pe-x").focus({ preventScroll: true });
  }
  function exDelete(w, i) {
    const list = (planOf(w) || []).slice(),
      e = list[i];
    if (!e) return;
    planChange(
      () => {
        list.splice(i, 1);
        setPlan(w, list);
      },
      `${e[0]} saiu do treino de ${dayName(w).toLowerCase()}.`,
    );
    focusSel(
      list.length
        ? `.pe-del[data-w="${wSel(w)}"][data-exdel="${Math.min(i, list.length - 1)}"]`
        : `.pe-add[data-w="${wSel(w)}"]`,
    );
  }
  function exMove(w, i, d) {
    const list = (planOf(w) || []).slice(),
      j = i + d;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    setPlan(w, list);
    softSave(30000);
    // o foco segue o exercício que andou
    const sel = (dd) => `.pe-mv [data-exmove="${dd}"][data-i="${j}"]`,
      b = document.querySelector(sel(d));
    (b && !b.disabled ? b : document.querySelector(sel(-d)) || document.body).focus({ preventScroll: true });
  }

  // aviso embaixo, com um botão (Desfazer, ou o que vier em label)
  let snackT = null,
    snackUndo = null;
  function snack(msg, undo, label, ms) {
    document.querySelectorAll(".snack").forEach((e) => e.remove());
    clearTimeout(snackT);
    snackUndo = undo || null;
    const el = document.createElement("div");
    el.className = "snack";
    el.setAttribute("role", "status");
    el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="snack-undo">${esc(label || "Desfazer")}</button>` : ""}`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add("in"));
    snackT = setTimeout(() => {
      snackUndo = null;
      el.classList.remove("in");
      setTimeout(() => el.remove(), 300);
    }, ms || 6000);
  }

  // ---------- folha do dia (Calendário e aviso de dia sem marcar) ----------
  // Treino e corrida (com distância) de qualquer dia que já passou.
  function openSheet(k, pick) {
    sheetDay = k;
    sheetPick = pick || null;
    sheetRunOpen = false;
    shKm = shTime = shErr = "";
    render();
    const x = document.querySelector(".sheet .sh-x");
    if (x) x.focus({ preventScroll: true });
  }
  function closeSheet() {
    sheetDay = null;
    sheetRunOpen = false;
    shErr = "";
    render();
  }
  function sheetHTML() {
    if (!sheetDay) return "";
    const k = sheetDay,
      d = parse(k);
    const dstr = d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    const cap = dstr.charAt(0).toUpperCase() + dstr.slice(1);
    const tr = state.logs[k],
      rn = state.runs[k];
    const dis = saving ? "disabled" : "";
    const fut = d > today,
      plan = plannedFor(d);
    let body;
    if (fut)
      body = `<p class="sh-p">Dia futuro. ${HOLIDAYS[k] ? "É feriado. " : ""}${SPLIT[d.getDay()] ? `Treino previsto: ${esc(SPLIT[d.getDay()])}.` : plan ? `Treino leve opcional: ${esc(plan)}.` : "Fim de semana."}</p>`;
    else {
      const pk = sheetPick || plan || "Outro";
      const rnTxt = rn
        ? rn.km
          ? `${rn.km.toFixed(2).replace(".", ",")} km${rn.min ? ` em ${fmtMin(rn.min)}` : ""}`
          : "Marcada, sem distância"
        : "Não marcada";
      const rdl = sheetRunOpen ? "Cancelar" : rn && rn.km ? "Editar distância" : "Pôr distância";
      const runForm = sheetRunOpen
        ? `<div class="rform sh-rf"><div class="rin"><input id="skm" type="text" inputmode="decimal" autocomplete="off" placeholder="km, ex: 2,1" aria-label="Distância em km" value="${esc(shKm)}">
          <input id="stime" type="text" inputmode="numeric" autocomplete="off" placeholder="tempo, ex: 11:30" aria-label="Tempo da corrida" value="${esc(shTime)}"><button data-act="sh-rsave" ${dis}>Salvar</button></div>
          <p class="rpace" id="space">${esc(pacePreview(shKm, shTime))}</p>${shErr ? `<p class="ferr">${esc(shErr)}</p>` : ""}</div>`
        : "";
      body = `<div class="sh-rows">
        <div class="sh-r"><div><span>Treino</span><b>${tr ? esc(tr) : "Não marcado"}</b></div><button data-act="sh-tr" class="${tr ? "off" : "on"}" ${dis}>${tr ? "Tirar" : "Marcar"}</button></div>
        ${tr ? "" : `<div class="sh-chips" role="group" aria-label="Qual treino você fez">${TYPES.map((x) => `<button class="chip" data-shtype="${esc(x)}" aria-pressed="${x === pk}">${esc(x)}</button>`).join("")}</div>`}
        <div class="sh-r"><div><span>Corrida</span><b>${rnTxt}</b><button class="lnk" data-act="sh-rdist" aria-expanded="${sheetRunOpen}" ${dis}>${rdl}</button></div><button data-act="sh-run" class="${rn ? "off" : "on"}" ${dis}>${rn ? "Tirar" : "Marcar"}</button></div>
        ${runForm}
      </div>`;
    }
    return `<div class="sheet-bg" data-act="sh-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(cap)}">
      <div class="sh-grab"></div><div class="sh-h"><b>${esc(cap)}</b>${HOLIDAYS[k] ? `<span>Feriado: ${esc(HOLI[k])}</span>` : isOff(d) ? `<span>Fim de semana</span>` : ""}</div>
      ${body}<button class="sh-x" data-act="sh-close">Fechar</button></div>`;
  }

  function runGoal() {
    const mins = Object.values(state.runs)
      .filter((r) => r && r.min)
      .map((r) => r.min);
    const best = mins.length ? Math.max(...mins) : 0;
    const target = best < 15 ? 15 : best < 20 ? 20 : best < 30 ? 30 : 45;
    return { best, target, pct: Math.min(100, (best / target) * 100) };
  }

  function runGoalHTML() {
    const g = runGoal();
    const left = g.target - g.best;
    let msg = g.best
      ? `Faltam ${fmtMin(left)}. Mesmo ritmo, só mais tempo correndo.`
      : "Anota o tempo da próxima corrida pra começar a contar.";
    return `<div class="rgoal"><div class="rt">Meta: ${g.target} min sem parar<span>${g.best ? fmtMin(g.best) : "0:00"} / ${g.target}:00</span></div>
      <div class="rb"><i style="width:${g.pct.toFixed(1)}%"></i></div><p>${esc(msg)}</p></div>`;
  }

  function weekData(mon, lim) {
    const o = { tr: 0, rn: 0, km: 0 };
    for (let i = 0; i < (lim || 7); i++) {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      const k = key(d);
      if (d > today) break;
      if (state.logs[k]) o.tr++;
      const r = state.runs[k];
      if (r) {
        o.rn++;
        if (r.km) o.km += r.km;
      }
    }
    return o;
  }

  function weekSummaryHTML(s) {
    const mon = monday(today),
      prev = new Date(mon);
    prev.setDate(mon.getDate() - 7);
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    const cur = weekData(mon),
      pr = weekData(prev, ((today.getDay() + 6) % 7) + 1);
    const hasPrev = parse(START) <= new Date(prev.getTime() + 6 * dayMs);
    const f = (d) => pad(d.getDate()) + "/" + pad(d.getMonth() + 1);
    const num = (v, dec) => (dec ? v.toFixed(1).replace(".", ",") : String(v));
    const diff = (a, b, dec) => {
      if (!hasPrev) return `<span class="df">—</span>`;
      const d = Math.round((a - b) * 10) / 10;
      if (d === 0) return `<span class="df">igual</span>`;
      return `<span class="df ${d > 0 ? "up" : ""}">${d > 0 ? "+" : "−"}${num(Math.abs(d), dec)}</span>`;
    };
    const rows = [
      ["Treinos", `${cur.tr}`, diff(cur.tr, pr.tr)],
      ["Corridas", `${cur.rn}`, diff(cur.rn, pr.rn)],
      ["Km corridos", num(cur.km, 1), diff(cur.km, pr.km, 1)],
