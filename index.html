    }
    let proj = null,
      perWeek = 0;
    const endD = parse(SUMMER);
    if (keys.length >= 3 && today < endD) {
      const x0 = parse(keys[0]);
      const xs = keys.map((k) => (parse(k) - x0) / dayMs),
        ys = keys.map((k) => state.weight[k]);
      if (xs[xs.length - 1] >= 14) {
        const n = xs.length,
          mx = xs.reduce((a, v) => a + v, 0) / n,
          my = ys.reduce((a, v) => a + v, 0) / n;
        let num = 0,
          den = 0;
        for (let i = 0; i < n; i++) {
          num += (xs[i] - mx) * (ys[i] - my);
          den += (xs[i] - mx) ** 2;
        }
        let slope = den ? num / den : 0;
        slope = Math.max(-0.5 / 7, Math.min(0.5 / 7, slope));
        perWeek = slope * 7;
        const lastD = parse(keys[keys.length - 1]);
        proj = last + slope * Math.max(0, (endD - lastD) / dayMs);
      }
    }
    let spark = "";
    if (keys.length > 1) {
      const x0 = parse(keys[0]).getTime();
      const xEnd = proj !== null ? endD.getTime() : parse(keys[keys.length - 1]).getTime();
      const vals = keys.map((k) => state.weight[k]).concat(proj !== null ? [proj] : []);
      const min = Math.min(...vals),
        max = Math.max(...vals),
        sp = max - min || 1;
      const X = (t) => ((t - x0) / (xEnd - x0 || 1)) * 100,
        Y = (v) => 50 - ((v - min) / sp) * 42;
      const pts = keys.map((k) => [X(parse(k).getTime()), Y(state.weight[k])]);
      const d = pts.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
      let extra = "";
      if (proj !== null) {
        const lp = pts[pts.length - 1];
        extra = `<path d="M${lp[0].toFixed(1)} ${lp[1].toFixed(1)} L100 ${Y(proj).toFixed(1)}" fill="none" stroke="var(--today)" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
      }
      spark = `<svg class="spark" viewBox="0 0 100 56" preserveAspectRatio="none" aria-hidden="true">${extra}
        <path d="${d}" fill="none" stroke="var(--done)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>`;
      if (proj !== null)
        spark += `<div class="spl"><span>${pad(parse(keys[0]).getDate())}/${pad(parse(keys[0]).getMonth() + 1)}</span><span>21/12</span></div>`;
    }
    let pbox = "";
    if (proj !== null) {
      const pw =
        Math.abs(perWeek) < 0.05
          ? "peso estável"
          : `${perWeek > 0 ? "+" : "−"}${fmt(Math.abs(perWeek))} kg por semana`;
      pbox = `<div class="pj"><span>Projeção pro verão</span><b>~${fmt(proj)} kg</b><p>No ritmo atual: ${pw}.${perWeek > 0 ? " Com creatina, 1 a 2 kg de água a mais no começo é normal." : ""}</p></div>`;
    } else if (today < endD) {
      const falta = Math.max(0, 3 - keys.length);
      pbox = `<div class="pj off"><span>Projeção pro verão</span><p>${falta ? `Aparece depois de 3 pesagens. Falta${falta > 1 ? "m" : ""} ${falta}.` : "Aparece quando as pesagens cobrirem pelo menos 2 semanas."}</p></div>`;
    }
    let nxt = "";
    if (keys.length) {
      const nd = parse(keys[keys.length - 1]);
      nd.setDate(nd.getDate() + 7);
      nxt =
        nd <= today
          ? "Já dá pra se pesar de novo."
          : `Próxima pesagem: ${WDFULL[nd.getDay()].toLowerCase()}, ${pad(nd.getDate())}/${pad(nd.getMonth() + 1)}.`;
    }
    const prot = last
      ? `<p class="wprot">Meta de proteína pelo teu peso: ${Math.round(last * 1.6)} a ${Math.round(last * 2)} g por dia.</p>`
      : "";
    return `<h2>Peso do corpo</h2><section class="weigh"><p>${esc(info)}</p>${nxt ? `<p class="wnext">${esc(nxt)}</p>` : ""}${prot}${spark}${pbox}
      <div class="row"><input id="w" type="text" inputmode="decimal" autocomplete="off" placeholder="kg, ex: 82,4" value="${esc(weightDraft)}">
      <button data-act="weight">Salvar</button></div>${wErr ? `<p class="ferr">${esc(wErr)}</p>` : ""}</section>`;
  }

  const LEVELS = [
    [0, "Iniciante"],
    [80, "Frango"],
    [200, "Em construção"],
    [350, "Focado"],
    [530, "Sem desculpa"],
    [740, "Disciplinado"],
    [980, "Shape vindo"],
    [1230, "Monstro"],
    [1480, "Máquina"],
    [1750, "Pronto pro verão"],
  ];
  const XPLABEL = {
    treinos: "Treino",
    corridas: "Corrida",
    semanas: "Semana 5/5",
    sequencia: "Sequência",
    recordes: "Recorde de corrida",
    semana: "Desafio da semana",
    secretas: "Conquista secreta",
  };
  function xpParts(s) {
    const o = { treinos: 0, corridas: 0, semanas: 0, sequencia: 0, recordes: 0, semana: 0, secretas: 0 };
    o.treinos = Object.keys(state.logs).length * 10;
    for (const k in state.runs) {
      const r = state.runs[k];
      o.corridas += 10 + (r && r.km ? Math.round(r.km * 5) : 0);
    }
    o.semanas = s.fullWeeks * 25;
    const keys = Object.keys(state.logs).sort();
    if (keys.length) {
      let run = 0;
      const c = parse(keys[0]);
      while (c <= today) {
        const k = key(c);
        if (state.logs[k]) {
          run++;
          if (run % 5 === 0) o.sequencia += 20;
        } else if (!isOff(c) && k !== todayKey) run = 0;
        c.setDate(c.getDate() + 1);
      }
    }
    let best = 0;
    Object.keys(state.runs)
      .sort()
      .forEach((k) => {
        const r = state.runs[k];
        if (!r || !r.km) return;
        if (best > 0 && r.km > best) o.recordes += 15;
        best = Math.max(best, r.km);
      });
    o.semana = weeklyDoneCount() * 40;
    o.secretas = unlockedSecrets().length * 30;
    return o;
  }
  function xpTotal(s) {
    return Object.values(xpParts(s)).reduce((a, v) => a + v, 0);
  }
  function levelInfo(s) {
    const x = xpTotal(s);
    let i = 0;
    while (i + 1 < LEVELS.length && x >= LEVELS[i + 1][0]) i++;
    const nx = LEVELS[i + 1];
    return {
      n: i + 1,
      name: LEVELS[i][1],
      x,
      from: LEVELS[i][0],
      to: nx ? nx[0] : null,
      nextName: nx ? nx[1] : null,
    };
  }
  function levelHTML(s) {
    const L = levelInfo(s);
    const pct = L.to ? ((L.x - L.from) / (L.to - L.from)) * 100 : 100;
    const msg = L.to
      ? `${L.to - L.x === 1 ? "Falta" : "Faltam"} ${L.to - L.x} XP pro nível ${L.n + 1}, ${L.nextName}.`
      : "Nível máximo. Agora é manter.";
    return `<section class="lvl"><div class="lv-top"><span class="lv-n">Nível ${L.n}</span><b>${esc(L.name)}</b><span class="lv-x">${L.x} XP</span></div>
      <div class="lv-bar"><i style="width:${pct.toFixed(1)}%"></i></div><p>${esc(msg)}</p></section>`;
  }
  function xpToast(gain, s) {
    const L = levelInfo(s);
    const pct = L.to ? ((L.x - L.from) / (L.to - L.from)) * 100 : 100;
    const before = L.to ? Math.max(0, ((L.x - gain - L.from) / (L.to - L.from)) * 100) : 100;
    document.querySelectorAll(".xpt").forEach((e) => e.remove());
    const el = document.createElement("div");
    el.className = "xpt";
    el.setAttribute("role", "status");
    el.innerHTML = `<b>+${gain} XP</b><div class="xt-m"><span>${esc(xpReason || "XP ganho")}</span><div class="xt-bar"><i style="width:${before.toFixed(1)}%"></i></div>
      <em>Nível ${L.n}, ${esc(L.name)}${L.to ? `. ${L.to - L.x === 1 ? "Falta" : "Faltam"} ${L.to - L.x} XP.` : ""}</em></div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() =>
      requestAnimationFrame(() => {
        el.classList.add("in");
        const bar = el.querySelector(".xt-bar i");
        if (bar) bar.style.width = pct.toFixed(1) + "%";
      }),
    );
    el.addEventListener("click", () => el.remove());
    setTimeout(() => {
      el.classList.remove("in");
      setTimeout(() => el.remove(), 400);
    }, 2600);
  }

  function checkLevelUp(s, gain) {
    const L = levelInfo(s);
    let stored = null;
    try {
      stored = parseInt(localStorage.getItem("treinos-lvl"));
    } catch (e) {}
    if (!stored || isNaN(stored) || L.n > stored) {
      try {
        localStorage.setItem("treinos-lvl", String(L.n));
      } catch (e) {}
    }
    if (!stored || isNaN(stored) || L.n <= stored) return false;
    celebrate({
      cls: "lvup",
      k: `${gain ? `+${gain} XP. ` : ""}Subiu de nível`,
      lines: [`Nível ${L.n}`, L.name],
      sub: `${L.to ? `Próximo: ${L.nextName}, com ${L.to} XP.` : "Você chegou no topo."} A cor do app agora é ${lvNames()[L.n - 1]}.`,
    });
    return true;
  }

  // A página salva tem o mesmo formato de quando o claude.ai publica: o esqueleto padrão dele e, dentro
  // do body, o título, o estilo e o app. Assim uma publicação feita de fora reconhece o esqueleto em vez
  // de pôr um documento dentro do outro.
  const SKELETON =
    "<!doctype html><html><head><meta charset=utf8>" +
    '<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">' +
    "<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);" +
    "padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}" +
    "body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}" +
    "img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>";
  const FONTS =
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">';
  function snapshot() {
    const o = {};
    KEYS.forEach((k) => (o[k] = state[k]));
    return o;
  }
  function buildDoc() {
    const style = document.getElementById("app-style").textContent;
    const script = document.getElementById("app-script").textContent;
    const data = snapshot();
    data.rev = state.rev + 1;
    const json = JSON.stringify(data).replace(/</g, "\\u003c");
    return `${SKELETON}\n<title>Treinos até o verão</title>\n<style id="app-style">${style}</style>\n${FONTS}\n<main id="root"></main>\n<script type="application/json" id="state">${json}<\/script>\n<script id="app-script">${script}<\/script>\n</body></html>`;
  }

  // Tudo vai primeiro pro celular (na hora). A publicação, que recarrega a página, é agrupada:
  // ações grandes publicam já; cargas e suplementos esperam uma pausa, sem campo aberto.
  let saveTimer = null;
  // Recusas definitivas da publicação; qualquer outra ("upstream_error" e códigos novos) é passageira.
  const FINAL = [
    "conflict",
    "not_writer",
    "not_declared",
    "too_large",
    "invalid_content",
    "read_only_path",
    "rate_limited",
    "consent_required",
    "not_granted",
    "capability_disabled",
    "capability_removed",
    "transform_error",
  ];
  const retryable = (err) => !FINAL.includes(err && err.code);
  function localWrite() {
    try {
      localStorage.setItem(LS, JSON.stringify({ base: state.rev, t: Date.now(), data: snapshot() }));
    } catch (e) {}
  }
  function softSave(ms) {
    localWrite();
    render();
    queuePublish(ms === undefined ? 30000 : ms);
  }
  function queuePublish(ms) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, ms);
  }
  function flushSave() {
    saveTimer = null;
    if (document.visibilityState === "visible") {
      const a = document.activeElement;
      if (a && a.tagName === "INPUT") {
        queuePublish(8000);
        return;
      }
    }
    save();
  }
  async function save() {
    // Publicar recarrega a página. Com uma retrospectiva aberta, espera ela fechar (fica no celular até lá).
    if (story) {
      commitKgDrafts();
      localWrite();
      queuePublish(4000);
      return;
    }
    clearTimeout(saveTimer);
    saveTimer = null;
    commitKgDrafts();
    localWrite();
    if (!artifact || cantSave) {
      render();
      return;
    }
    saving = true;
    render();
    try {
      localStorage.setItem(
        "treinos-pend",
        JSON.stringify({
          t: Date.now(),
          xp: lastXP,
          parts: lastParts,
          y: window.scrollY,
          sheet: sheetDay,
          ex: exOpen,
          pe: planEdit,
          lo: ldOpen,
        }),
      );
    } catch (e) {}
    // se a publicação não responder, destrava o app em vez de ficar em "Salvando…" pra sempre
    let guard = setTimeout(() => {
      if (!saving) return;
      saving = false;
      render();
      errPill();
    }, 15000);
    try {
      const doc = buildDoc();
      try {
        await artifact.publish(doc);
      } catch (err) {
        // falha passageira do serviço (wi-fi da academia, por exemplo): tenta mais uma vez, só uma
        if (!retryable(err)) throw err;
        await new Promise((r) => setTimeout(r, 1000 + Math.random() * 1500));
        await artifact.publish(doc);
      }
      clearTimeout(guard);
      state.rev += 1;
      try {
        localStorage.removeItem(LS);
      } catch (e) {}
      guard = setTimeout(() => {
        if (saving) {
          saving = false;
          render();
        }
      }, 8000);
    } catch (err) {
      clearTimeout(guard);
      const c = err && err.code;
      try {
        localStorage.removeItem("treinos-pend");
      } catch (e) {}
      // Outra versão foi salva antes (outro aparelho, ou uma atualização do app): a tela recarrega
      // sozinha com ela, e o que foi anotado aqui volta junto pelo rascunho do celular. Se por algum
      // motivo não recarregar, destrava os botões em vez de ficar em "Salvando…".
      if (c === "conflict") {
        setTimeout(() => {
          if (!saving) return;
          saving = false;
          render();
        }, 8000);
        return;
      }
      // Esta tela não pode publicar (aberta só pra ver, ou o salvamento não carregou). Nada trava: o app
      // segue anotando neste celular e avisa no topo; quando abrir de novo, vai tudo junto no primeiro toque.
      const stuck = [
        "not_writer",
        "not_granted",
        "not_declared",
        "consent_required",
        "capability_disabled",
        "capability_removed",
      ].includes(c);
      if (stuck) cantSave = true;
      saving = false;
      render();
      errPill(stuck ? NOSAVE : undefined);
    }
  }
  const NOSAVE = "Esta tela não está conseguindo salvar no app. O que tu anotar fica guardado neste celular.";
  function noSaveHTML() {
    return cantSave
      ? `<section class="wrem nosave" role="status"><b>Anotando só neste celular</b><span>Esta tela não está conseguindo salvar no app. Pode seguir anotando: fica guardado aqui e vai pro app quando tu fechar e abrir ele de novo.</span></section>`
      : "";
  }
  function errPill(msg) {
    document.querySelectorAll(".saved.err").forEach((e) => e.remove());
    const el = document.createElement("div");
    el.className = "saved err";
    el.setAttribute("role", "alert");
    el.textContent = msg || "Não consegui salvar. Ficou guardado no celular e salva no próximo toque.";
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add("in"));
    setTimeout(() => {
      el.classList.remove("in");
      setTimeout(() => el.remove(), 400);
    }, 3500);
  }

  document.addEventListener("click", (e) => {
    if (e.target.classList && e.target.classList.contains("sheet-bg")) {
      if (exSheet) closeExSheet();
      else closeSheet();
      return;
    }
    const t = e.target.closest("button");
    if (!t) return;
    // ---- visual do app (só neste celular) ----
    if (t.dataset.skin !== undefined && t.closest(".skins")) {
      skin = SKINS.includes(t.dataset.skin) ? t.dataset.skin : "";
      try {
        localStorage.setItem(SKIN_KEY, skin || "orig");
      } catch (e) {}
      applyTheme();
      render();
      return;
    }
    // ---- retrospectivas (só leitura: funcionam até salvando) ----
    if (t.dataset.recap) {
      openRecap(t.dataset.recap);
      return;
    }
    if (t.dataset.act === "recap-skip") {
      markRecapSeen(t.dataset.id);
      render();
      return;
    }
    if (saving) return;
    const act = t.dataset.act;
    // ---- Hoje: exercício feito ----
    if (t.dataset.exok !== undefined) {
      toggleDone(t);
      return;
    }
    // ---- Hoje: timer da prancha ----
    if (t.dataset.timer !== undefined) {
      if (!tmRunning() || tm.n !== t.dataset.timer) tmStart(t.dataset.timer, t.dataset.sp);
      return;
    }
    if (act === "tm-next" && tm) {
      tmStart(tm.n, `${tm.sets}x${tm.secs}s`);
      return;
    }
    if (act === "tm-stop") {
      tmStop();
      return;
    }
    if (act === "tm-close") {
      tmEnd(true);
      return;
    }
    // ---- montar o treino: novo exercício, séries, ordem e excluir ----
    if (exSheet && t.closest(".sheet.xs")) {
      if (t.dataset.xsday) {
        const w = t.dataset.xsday,
          x = exSheet;
        x.days = x.days.includes(w) ? x.days.filter((d) => d !== w) : x.days.concat(w);
        x.err = "";
        xsSync();
        return;
      }
      if (t.dataset.xskind) {
        exSheet.kind = t.dataset.xskind;
        xsSync();
        return;
      }
      if (t.dataset.xsg) {
        exSheet.g = t.dataset.xsg;
        exSheet.err = "";
        xsSync();
        return;
      }
      if (t.dataset.xssug) {
        xsPick(t.dataset.xssug);
        return;
      }
      if (t.dataset.xs) {
        xsStep(t.dataset.xs, +t.dataset.d);
        return;
      }
      if (t.dataset.xsunit) {
        xsUnit(t.dataset.xsunit === "s");
        return;
      }
      if (act === "xs-save") {
        xsSave();
        return;
      }
      if (act === "xs-del") {
        const x = exSheet;
        exSheet = null;
        exDelete(x.w, x.i);
        return;
      }
      if (act === "xs-close") {
        closeExSheet();
        return;
      }
    }
    if (act === "ex-new") {
      commitKgDrafts();
      localWrite();
      openExNew(t.dataset.w || null);
      if (exSheet) exSheet.back = t.dataset.w ? `.pe-add[data-w="${wSel(t.dataset.w)}"]` : ".pe-new";
      return;
    }
    if (act === "plan-edit") {
      commitKgDrafts();
      localWrite();
      const w = t.dataset.w;
      planEdit = ldOpen = w;
      if (tab !== "pesos") {
        tab = "pesos";
        try {
          localStorage.setItem("treinos-tab", tab);
        } catch (e) {}
      }
      render();
      const sec = document.querySelector(`.pw[data-pww="${window.CSS ? window.CSS.escape(w) : w}"]`);
      if (sec) {
        sec.scrollIntoView({ block: "start" });
        const f = sec.querySelector(".pe-x");
        if (f) f.focus({ preventScroll: true });
      }
      return;
    }
    if (act === "plan-done") {
      const w = t.dataset.w;
      planEdit = null;
      render();
      const h = document.querySelector(`.pw-h[data-pw="${window.CSS ? window.CSS.escape(w) : w}"]`);
      if (h) h.focus({ preventScroll: true });
      return;
    }
    if (t.dataset.exedit !== undefined) {
      openExEdit(t.dataset.w, +t.dataset.exedit);
      if (exSheet) exSheet.back = `.pe-x[data-w="${wSel(t.dataset.w)}"][data-exedit="${t.dataset.exedit}"]`;
      return;
    }
    if (t.dataset.exdel !== undefined) {
      exDelete(t.dataset.w, +t.dataset.exdel);
      return;
    }
    if (t.dataset.exmove) {
      exMove(t.dataset.w, +t.dataset.i, +t.dataset.exmove);
      return;
    }
    if (act === "snack-undo") {
      const u = snackUndo;
      snackUndo = null;
      document.querySelectorAll(".snack").forEach((e) => e.remove());
      if (u) u();
      return;
    }
    // ---- dias que ficaram sem marcar ----
    if (act === "miss-ok") {
      const k = t.dataset.k;
      if (!state.logs[k]) {
        state.logs[k] = guessWorkout(k);
        xpReason = "Treino marcado";
      }
      save();
      return;
    }
    if (act === "miss-open") {
      openSheet(t.dataset.k, guessWorkout(t.dataset.k));
      return;
    }
    if (act === "miss-no") {
      skipDays(missedDays());
      render();
      return;
    }
    // ---- trocar o treino de hoje já marcado ----
    if (act === "retype") {
      retypeOpen = !retypeOpen;
      render();
      return;
    }
    if (t.dataset.retype) {
      const w = t.dataset.retype;
      retypeOpen = false;
      if (!state.logs[todayKey] || state.logs[todayKey] === w) {
        render();
        return;
      }
      state.logs[todayKey] = w;
      picked = w;
      if (state.ex[todayKey]) state.ex[todayKey] = Object.assign({}, state.ex[todayKey], { _w: w });
      try {
        localStorage.setItem("treinos-picked", JSON.stringify({ d: todayKey, w }));
      } catch (e) {}
      save();
      return;
    }
    // ---- folha do dia: distância da corrida ----
    if (act === "sh-rdist" && sheetDay) {
      const r = state.runs[sheetDay];
      shKm = r && r.km ? String(r.km).replace(".", ",") : "";
      shTime = r && r.min ? fmtMin(r.min) : "";
      shErr = "";
      sheetRunOpen = !sheetRunOpen;
      render();
      const el = document.getElementById("skm");
      if (el) el.focus();
      return;
    }
    if (act === "sh-rsave" && sheetDay) {
      const res = readRun(document.getElementById("skm").value, document.getElementById("stime").value);
      if (res.err) {
        shErr = res.err;
        render();
        return;
      }
      state.runs[sheetDay] = res.run;
      xpReason = `Corrida de ${String(res.run.km).replace(".", ",")} km`;
      sheetRunOpen = false;
      shKm = shTime = shErr = "";
      save();
      return;
    }
    if (t.dataset.nav) {
      if (t.dataset.nav !== tab) planEdit = null;
      tab = t.dataset.nav;
      try {
        localStorage.setItem("treinos-tab", tab);
      } catch (e) {}
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (t.dataset.type) {
      picked = t.dataset.type;
      try {
        localStorage.setItem("treinos-picked", JSON.stringify({ d: todayKey, w: picked }));
      } catch (e) {}
      if (state.ex[todayKey]) {
        state.ex[todayKey] = Object.assign({}, state.ex[todayKey], { _w: picked });
        localWrite();
      }
      render();
      return;
    }
    if (t.dataset.shtype) {
      sheetPick = t.dataset.shtype;
      render();
      return;
    }
    if (act === "exopen") {
      exOpen = !exOpen;
      render();
      return;
    }
    if (act === "lvopen") {
      lvOpen = !lvOpen;
      render();
      return;
    }
    if (act === "cqopen") {
      cqOpen = !cqOpen;
      render();
      return;
    }
    if (t.dataset.lp) {
      // da evolução no Progresso pro gráfico na aba Pesos
      const k = t.dataset.lp,
        w = SPLIT_DAYS.map((i) => SPLIT[i]).find((x) => pesoRows(x).includes(k));
      tab = "pesos";
      if (w) ldOpen = w;
      chartOpen = k;
      render();
      const el = document.querySelector(`[data-chart="${window.CSS ? window.CSS.escape(k) : k}"]`);
      if (el) el.scrollIntoView({ block: "center" });
      else window.scrollTo(0, 0);
      return;
    }
    if (t.dataset.chart !== undefined) {
      commitKgDrafts();
      localWrite();
      chartOpen = chartOpen === t.dataset.chart ? null : t.dataset.chart;
      render();
      return;
    }
    if (t.dataset.pw !== undefined) {
      commitKgDrafts();
      localWrite();
      ldOpen =
        ldOpen === t.dataset.pw || (ldOpen === null && t.getAttribute("aria-expanded") === "true")
          ? ""
          : t.dataset.pw;
      if (planEdit && planEdit !== ldOpen) planEdit = null;
      render();
      return;
    }
    if (t.dataset.grip) {
      commitKgDrafts();
      const o = Object.assign({}, exDay(todayKey));
      o._g = Object.assign({}, o._g || {}, { [t.dataset.grip]: t.dataset.g });
      state.ex[todayKey] = o;
      softSave(30000);
      return;
    }
    if (act === "export") {
      exportBackup();
      return;
    }
    if (act === "bk-later") {
      try {
        localStorage.setItem("treinos-backup-depois", key(new Date(today.getTime() + 7 * dayMs)));
      } catch (e) {}
      render();
      return;
    }
    if (act === "theme") {
      theme = curTheme() === "dark" ? "light" : "dark";
      try {
        localStorage.setItem("treinos-theme", theme);
      } catch (e) {}
      applyTheme();
      render();
      return;
    }
    if (act === "mark") {
      finishWorkout();
      return;
    }
    if (act === "undo") {
      undoConfirm = true;
      retypeOpen = false;
      render();
      return;
    }
    if (act === "run") {
      runOpen = true;
      runConfirm = false;
      render();
      const el = document.getElementById("rkm");
      if (el) el.focus();
      return;
    }
    if (act === "rclose") {
      runOpen = false;
      render();
      return;
    }
    if (act === "rmark") {
      state.runs[todayKey] = true;
      runOpen = false;
      xpReason = "Corrida marcada";
      save();
      return;
    }
    if (act === "redit") {
      const r = state.runs[todayKey];
      runKm = r && r.km ? String(r.km).replace(".", ",") : "";
      runTime = r && r.min ? fmtMin(r.min) : "";
      runOpen = true;
      runConfirm = false;
      render();
      return;
    }
    if (act === "rdel") {
      runConfirm = true;
      render();
      return;
    }
    if (act === "rdelno") {
      runConfirm = false;
      render();
      return;
    }
    if (act === "rdelok") {
      delete state.runs[todayKey];
      runConfirm = false;
      runOpen = false;
      save();
      return;
    }
    if (act === "swap") {
      showChips = !showChips;
      render();
      return;
    }
    if (act === "undook") {
      undoConfirm = false;
      dropRepeatedLoads(todayKey, state.logs[todayKey]);
      delete state.logs[todayKey];
      delete state.hr[todayKey];
      save();
      return;
    }
    if (act === "undono") {
      undoConfirm = false;
      render();
      return;
    }
    if (act === "sh-close") {
      closeSheet();
      return;
    }
    if (act === "sh-tr" && sheetDay) {
      const k = sheetDay;
      if (state.logs[k]) {
        dropRepeatedLoads(k, state.logs[k]);
        delete state.logs[k];
        delete state.hr[k];
      } else {
        state.logs[k] = sheetPick || plannedFor(parse(k)) || "Outro";
        xpReason = "Treino marcado";
      }
      sheetPick = null;
      save();
      return;
    }
    if (act === "sh-run" && sheetDay) {
      const k = sheetDay;
      if (state.runs[k]) delete state.runs[k];
      else {
        state.runs[k] = true;
        xpReason = "Corrida marcada";
      }
      sheetRunOpen = false;
      save();
      return;
    }
    if (act === "rsave") {
      const res = readRun(document.getElementById("rkm").value, document.getElementById("rtime").value);
      if (res.err) {
        runErr = res.err;
        render();
        return;
      }
      runErr = "";
      state.runs[todayKey] = res.run;
      xpReason = `Corrida de ${String(res.run.km).replace(".", ",")} km`;
      runKm = "";
      runTime = "";
      runOpen = false;
      save();
      return;
    }
    if (act === "weight") {
      const el = document.getElementById("w");
      const v = numBR(el && el.value);
      if (v === null || v < 30 || v > 300) {
        wErr = "Coloca o peso em kg, tipo 82,4.";
        render();
        return;
      }
      wErr = "";
      xpReason = "Pesagem da semana";
      state.weight[todayKey] = Math.round(v * 10) / 10;
      weightDraft = "";
      save();
      return;
    }
    if (t.dataset.day) {
      openSheet(t.dataset.day);
      return;
    }
  });

  document.addEventListener("input", (e) => {
    const el = e.target;
    lastTyped = Date.now();
    if (el.id === "xs-name" && exSheet) xsName(el.value);
    if (el.id === "w") weightDraft = el.value;
    if (el.id === "rkm") runKm = el.value;
    if (el.id === "rtime") runTime = el.value;
    if (el.id === "rkm" || el.id === "rtime") {
      const p = document.getElementById("rpace");
      if (p) p.textContent = pacePreview();
    }
    if (el.id === "skm") shKm = el.value;
    if (el.id === "stime") shTime = el.value;
    if (el.id === "skm" || el.id === "stime") {
      const p = document.getElementById("space");
      if (p) p.textContent = pacePreview(shKm, shTime);
    }
    if (el.dataset && el.dataset.kg !== undefined) kgDraft[el.dataset.kg] = el.value;
  });
  // carga: grava ao sair do campo, sem redesenhar a tela (o teclado não fecha no meio da digitação)
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.bk === "import") {
      if (el.files && el.files[0]) importBackup(el.files[0]);
      return;
    }
    if (!el.dataset || el.dataset.kg === undefined) return;
    kgDraft[el.dataset.kg] = el.value;
    const r = commitKg(el.dataset.kg);
    if (r === "bad") {
      render();
      errPill(
        unitOf(el.dataset.kg) === "kg"
          ? "Peso inválido. Usa só o número, tipo 32,5."
          : "Valor inválido. Usa só o número, tipo 25.",
      );
    } else if (r) {
      localWrite();
      queuePublish(30000);
    }
  });
  // gráfico: tocar ou arrastar o dedo escolhe o dia; no computador, passar o mouse
  document.addEventListener("pointerdown", chartAt);
  document.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse" || e.buttons) chartAt(e);
  });
  document.addEventListener("pointerdown", dashAt);
  document.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse" || e.buttons) dashAt(e);
  });
  document.addEventListener("pointerdown", yrAt);
  document.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse" || e.buttons) yrAt(e);
  });
  document.addEventListener("focusin", (e) => {
    const el = e.target.closest && e.target.closest(".lc");
    if (el && e.target.tagName.toLowerCase() === "svg" && charts[el.dataset.lc])
      chartPick(el, el.dataset.i !== undefined ? +el.dataset.i : charts[el.dataset.lc].pts.length - 1);
  });
  document.addEventListener("keydown", (e) => {
    if (
      e.target.classList &&
      e.target.classList.contains("dash") &&
      dash &&
      (e.key === "ArrowLeft" || e.key === "ArrowRight")
    ) {
      dashPick(dash.i + (e.key === "ArrowRight" ? 1 : -1));
      e.preventDefault();
      return;
    }
    // treinos por ano: pros lados troca de semana, pra cima e pra baixo troca de dia
    const yk = { ArrowLeft: -7, ArrowRight: 7, ArrowUp: -1, ArrowDown: 1 }[e.key];
    if (yk && e.target.classList && e.target.classList.contains("yr-y") && yrs) {
      const y = +e.target.dataset.y;
      yrPick(y, addD(yrSel[y] || yrs.g[y].def, yk));
      e.preventDefault();
      return;
    }
    const lc = e.target.closest && e.target.closest(".lc");
    if (lc && (e.key === "ArrowLeft" || e.key === "ArrowRight") && charts[lc.dataset.lc]) {
      const i = lc.dataset.i !== undefined ? +lc.dataset.i : charts[lc.dataset.lc].pts.length - 1;
      chartPick(lc, i + (e.key === "ArrowRight" ? 1 : -1));
      e.preventDefault();
      return;
    }
    if (e.key === "Escape") {
      if (exSheet) closeExSheet();
      else if (sheetDay) closeSheet();
      return;
    }
    if (e.key !== "Enter") return;
    const el = e.target;
    if (el.id === "xs-name") {
      el.blur();
      return;
    }
    if (el.dataset && el.dataset.kg !== undefined) {
      el.blur();
      return;
    }
    if (el.id === "rkm" || el.id === "rtime") {
      const b = document.querySelector('[data-act="rsave"]');
      if (b) b.click();
    }
    if (el.id === "skm" || el.id === "stime") {
      const b = document.querySelector('[data-act="sh-rsave"]');
      if (b) b.click();
    }
    if (el.id === "w") {
      const b = document.querySelector('[data-act="weight"]');
      if (b) b.click();
    }
  });

  render();
  try {
    localStorage.removeItem("treinos-rest");
  } catch (e) {}
  let pend = null;
  try {
    pend = JSON.parse(localStorage.getItem("treinos-pend") || "null");
    localStorage.removeItem("treinos-pend");
  } catch (e) {}
  if (pend && Date.now() - pend.t < 30000) {
    booted = true;
    lastXP = pend.xp;
    lastParts = pend.parts;
    sheetDay = pend.sheet || null;
    exOpen = !!pend.ex;
    planEdit = typeof pend.pe === "string" ? pend.pe : null;
    if (typeof pend.lo === "string") ldOpen = pend.lo;
    render();
    window.scrollTo(0, pend.y || 0);
    savedPill();
  } else if (todayKey >= SUMMER && !recapSeen().includes("verao")) {
    booted = true;
    lastParts = xpParts(stats());
    openRecap("verao");
  } else {
    booted = true;
    lastParts = xpParts(stats());
    checkSecrets(true);
    checkLevelUp(stats());
  }
  // acabou de trocar pra versão nova do app: volta pro mesmo lugar da tela e avisa
  try {
    const up = JSON.parse(sessionStorage.getItem("treinos-upd") || "null");
    sessionStorage.removeItem("treinos-upd");
    if (up && Date.now() - up.t < 60000) {
      if (typeof up.lo === "string" && up.lo !== ldOpen) {
        ldOpen = up.lo;
        render();
      }
      window.scrollTo(0, up.y || 0);
      savedPill("App atualizado.");
    }
  } catch (e) {}
  if (window.claude && window.claude.use) {
    const noSave = () => {
      cantSave = true;
      render();
    };
    window.claude
      .use("artifact")
      .then((a) => {
        artifact = a;
        if (!a) noSave();
      })
      .catch(noSave);
  }
  // Ficou anotação só neste celular (uma tela que não salvava, ou um salvamento que não chegou a sair):
  // vai pro app no primeiro toque desta tela, sem esperar a próxima anotação.
  if (unsentLocal) {
    const send = () => {
      document.removeEventListener("pointerdown", send, true);
      document.removeEventListener("keydown", send, true);
      if (!saveTimer && !saving && !cantSave) queuePublish(3000);
    };
    document.addEventListener("pointerdown", send, true);
    document.addEventListener("keydown", send, true);
  }
  // Entrou anotação de um rascunho feito em cima de uma versão anterior: fica guardada em cima desta
  // versão e vai junto na próxima vez que o app salvar.
  if (draftMerged) {
    localWrite();
    savedPill("Juntei o que tinha ficado só neste celular.");
  }
  try {
    const imp = sessionStorage.getItem("treinos-import");
    if (imp !== null) {
      sessionStorage.removeItem("treinos-import");
      savedPill(`Backup importado: ${imp} treinos.`);
    }
  } catch (e) {}
  // virou o dia com o app aberto: recarrega pra "hoje" ser hoje de verdade. Se a pessoa está digitando
  // um peso ou vendo uma retrospectiva, espera ela terminar; o que foi digitado fica no dia em que foi feito.
  function dayCheck() {
    if (key(new Date()) === todayKey) return;
    const a = document.activeElement,
      typing = a && a.tagName === "INPUT" && Date.now() - lastTyped < 120000;
    if (story || (document.visibilityState === "visible" && typing)) return;
    commitKgDrafts();
    localWrite();
    try {
      location.reload();
    } catch (e) {}
  }
  setInterval(dayCheck, 60000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      if (saveTimer && !saving) save();
    } else dayCheck();
  });
})();
</script>
</body></html>
