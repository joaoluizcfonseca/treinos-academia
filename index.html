<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Treinos até o verão</title>
<style id="app-style">/* Cores e tema */
:root {
  --bg: #000000;
  --paper: #141414;
  --paper2: #1c1c1c;
  --line: #262626;
  --ink: #ededed;
  --soft: #8a8a8a;
  --done: #ff5a1f;
  --on-done: #150800; /* texto em cima da cor do nível; o app troca pra branco quando contrasta mais */
  --today: #ffb547;
  --run: #5cb8ff;
  --del: #ff6b6b;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] {
  --bg: #fafafa;
  --paper: #f0f0f0;
  --paper2: #e7e7e7;
  --line: #dcdcdc;
  --ink: #141414;
  --soft: #666666;
  --today: #b5650a;
  --run: #1570d6;
  --del: #d93036;
  color-scheme: light;
}

/* Base */
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  font-family:
    "Archivo",
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variation-settings: "wdth" 96;
}
main {
  max-width: 560px;
  margin: 0 auto;
  padding: 18px 22px 120px;
}
button {
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--today);
  outline-offset: 3px;
}

h2 {
  font-size: 15px;
  font-weight: 800;
  font-variation-settings: "wdth" 100;
  letter-spacing: 0;
  margin: 34px 0 10px;
}
.note {
  font-size: 13px;
  color: var(--soft);
  margin-top: 24px;
}
h2.first {
  margin-top: 20px;
}
.qsub {
  margin: -8px 0 16px;
  font-size: 14px;
  color: var(--soft);
}
button:not(:disabled):active {
  transform: scale(0.97);
}
main.tabin > * {
  animation: tabIn 0.28s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.lk {
  width: 14px;
  height: 14px;
  display: block;
}
.lnk {
  background: none;
  border: 0;
  color: var(--soft);
  font-size: 14px;
  font-weight: 600;
  padding: 8px 2px;
  white-space: nowrap;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.lnk:disabled {
  opacity: 0.5;
}

.ferr {
  margin: 8px 0 0;
  font-size: 13px;
  font-weight: 700;
  color: #ff6b6b;
}
.cred {
  margin: 44px 0 0;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--soft);
}

/* Cabeçalho: contagem até o verão */
.date {
  margin: 0 0 6px;
  color: var(--soft);
  font-size: 14px;
}
.top {
  margin-bottom: 10px;
  position: relative;
}
.count {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}
.count b {
  font-weight: 900;
  font-variation-settings: "wdth" 125;
  letter-spacing: -0.03em;
  line-height: 0.9;
  font-size: 52px;
}
.count span {
  font-weight: 700;
  font-variation-settings: "wdth" 112;
  line-height: 1.1;
  color: var(--soft);
  font-size: 14px;
  padding-bottom: 2px;
}
.top.small .count b {
  font-size: 32px;
}
.top.small .count span {
  padding-bottom: 2px;
  font-size: 12px;
}
.prog {
  background: var(--paper);
  overflow: hidden;
  position: relative;
  border-radius: 5px;
  margin-top: 12px;
  height: 8px;
}
.prog i {
  display: block;
  height: 100%;
  background: var(--done);
  border-radius: 5px;
}
.prog s {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  margin-left: -1px;
  background: var(--bg);
  text-decoration: none;
}
.top.small .prog {
  height: 6px;
}
.thm {
  position: absolute;
  right: -6px;
  top: -6px;
  background: none;
  border: 0;
  color: var(--soft);
  padding: 8px;
  cursor: pointer;
}
.thm svg {
  width: 20px;
  height: 20px;
  display: block;
}

/* Navegação e troca de aba */
.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: grid;
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 4px max(8px, calc(50% - 280px)) calc(4px + env(safe-area-inset-bottom, 0px));
  background: rgba(0, 0, 0, 0.94);
  grid-template-columns: repeat(4, 1fr);
}
.nav button {
  background: none;
  border: 0;
  color: var(--soft);
  font-size: 12px;
  font-weight: 700;
  padding: 10px 0 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  position: relative;
}
.nav button svg {
  width: 24px;
  height: 24px;
}
.nav button[aria-current="page"] {
  color: var(--done);
}
.nav button[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: -5px;
  left: 30%;
  right: 30%;
  height: 2px;
  background: var(--done);
}
.nav button span {
  font-size: 11px;
  white-space: nowrap;
}

/* Hoje: semana, feriado e pesagem */
.wrem {
  border: 1.5px solid var(--today);
  border-radius: 22px;
  padding: 18px;
  margin: 0 0 14px;
}
.wrem b {
  display: block;
  font-size: 19px;
  font-weight: 900;
  font-variation-settings: "wdth" 115;
  color: var(--today);
}
.wrem span {
  display: block;
  font-size: 14px;
  color: var(--soft);
  margin-top: 4px;
}
.wrem .row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.wrem input {
  flex: 1;
  min-width: 0;
  border: 1.5px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 14px;
  padding: 13px;
  font: inherit;
  font-size: 16px;
}
.wrem button {
  border: 0;
  border-radius: 14px;
  padding: 13px 18px;
  font-weight: 800;
  cursor: pointer;
  background: var(--today);
  color: #1a0e00;
}
.holi {
  border: 1.5px solid var(--run);
  border-radius: 22px;
  padding: 16px 18px;
  margin: 0 0 14px;
}
.holi b {
  display: block;
  font-size: 16px;
  font-weight: 800;
  color: var(--run);
}
.holi span {
  display: block;
  font-size: 13px;
  color: var(--soft);
  margin-top: 4px;
}
.holi,
.wrem {
  border-radius: 8px;
  border-width: 1px;
  margin: 14px 0 0;
}
.w7 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: 18px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.w7-a {
  display: flex;
  flex: none;
  align-items: center;
  gap: 8px;
}
.w7-a b {
  font-size: 40px;
  font-weight: 800;
  font-variation-settings: "wdth" 78;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.w7-a span {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--soft);
}
.w7-d {
  display: flex;
  min-width: 0;
  gap: 4px;
}
.w7-d i {
  width: 25px;
  min-width: 0;
  height: 30px;
  border-radius: 4px;
  background: var(--paper2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-style: normal;
  font-size: 11px;
  font-weight: 800;
  color: var(--soft);
}
.w7-d i.we {
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--line);
}
.w7-d i.on,
.w7-d i.we.on {
  background: var(--done);
  color: var(--on-done);
  box-shadow: none;
}
.w7-d i.now,
.w7-d i.on.now {
  box-shadow: inset 0 0 0 2px var(--today);
}
.w7-m {
  margin: 10px 0 0;
  font-size: 15px;
  line-height: 1.4;
  color: var(--soft);
}
.w7-m.al {
  color: var(--today);
  font-weight: 700;
}

/* Hoje: dias que ficaram sem treino marcado */
.miss {
  margin: 14px 0 0;
  padding: 16px 18px 8px;
  border: 1px solid var(--today);
  border-radius: 8px;
}
.ms-h b {
  display: block;
  font-size: 17px;
  font-weight: 900;
  font-variation-settings: "wdth" 115;
  color: var(--today);
}
.ms-h span {
  display: block;
  margin-top: 4px;
  font-size: 14px;
  line-height: 1.4;
  color: var(--soft);
}
.ms-l {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
}
.ms-l li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.ms-d {
  flex: 1;
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.ms-d b {
  display: block;
  font-size: 16px;
  font-weight: 800;
  line-height: 1.3;
}
.ms-d span {
  display: block;
  margin-top: 2px;
  font-size: 13px;
  line-height: 1.35;
  color: var(--soft);
}
.ms-ok {
  flex: none;
  border: 0;
  border-radius: 6px;
  padding: 10px 16px;
  font-size: 15px;
  font-weight: 800;
  background: var(--today);
  color: #1a0e00;
  cursor: pointer;
}
.ms-ok:disabled {
  opacity: 0.55;
  cursor: default;
}
.ms-no {
  display: block;
  font-size: 13px;
}

/* Hoje: treino do dia */
.check {
  background: var(--paper);
  border-radius: 26px;
  padding: 22px;
  margin: 18px 0 0;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.chip {
  border-width: 1.5px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition:
    background 0.15s,
    border-color 0.15s;
  border-radius: 6px;
  border: 1px solid var(--line);
  padding: 9px 12px;
  font-size: 14px;
}
.chip[aria-pressed="true"] {
  border-color: var(--done);
  background: var(--done);
  color: var(--on-done);
  font-weight: 700;
}
.go {
  width: 100%;
  border: 0;
  background: var(--done);
  color: var(--on-done);
  cursor: pointer;
  margin-top: 2px;
  padding: 16px;
  border-radius: 8px;
  font-variation-settings: "wdth" 100;
  font-size: 16px;
  font-weight: 800;
}
.go:disabled {
  opacity: 0.55;
  cursor: default;
}
.plan {
  margin: 0 0 20px;
}
.plan .k {
  font-size: 14px;
  color: var(--soft);
  font-weight: 600;
}
.plan .w {
  font-weight: 900;
  font-variation-settings: "wdth" 118;
  line-height: 1.05;
  margin: 4px 0 8px;
  letter-spacing: -0.01em;
  font-size: 22px;
}
.plan .ex {
  font-size: 14px;
  color: var(--soft);
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.done-up {
  margin: 8px 0 0;
  font-size: 14px;
  line-height: 1.4;
  font-weight: 700;
  color: var(--today);
}
.done-msg {
  margin: 0 0 2px;
  font-weight: 900;
  line-height: 1.1;
  font-variation-settings: "wdth" 112;
  color: var(--done);
  font-size: 20px;
}
.undo {
  display: block;
  margin: 14px auto 0;
  background: none;
  border: 0;
  color: var(--soft);
  font-size: 13px;
  text-decoration: underline;
  cursor: pointer;
  padding: 6px 0 0;
}
.dn-a {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px 20px;
  margin: 14px 0 0;
}
.dn-a .undo {
  margin: 0;
}
.check .chips.dn-chips {
  margin: 14px 0 0;
}
.wlock {
  display: flex;
  align-items: center;
  gap: 10px;
}
.wlock .lk {
  width: 24px;
  height: 24px;
  color: var(--soft);
}
.check .chips {
  margin-top: 8px;
}
.confirm {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--paper2);
}
.confirm span {
  flex: 1 1 100%;
  font-size: 14px;
  font-weight: 700;
}
.confirm button {
  border: 0;
  border-radius: 12px;
  padding: 10px 16px;
  font-weight: 800;
  cursor: pointer;
}
.confirm button:first-of-type {
  background: #e5484d;
  color: #fff;
}
.confirm button:last-of-type {
  background: transparent;
  color: var(--soft);
  box-shadow: inset 0 0 0 1px var(--line);
}
.lightnote {
  margin: -4px 0 12px;
  font-size: 14px;
  line-height: 1.45;
  color: var(--soft);
}
.exto {
  display: block;
  margin: 2px 0 14px;
  padding-left: 0;
}
.swapl {
  display: block;
  margin: 10px auto 0;
}
.nxt {
  margin: 16px 0 0;
  font-size: 14px;
  color: var(--soft);
}
.nxt b {
  color: var(--ink);
  font-weight: 800;
}

/* Hoje: exercícios e pesos */
.exl {
  list-style: none;
  margin: 2px 0 18px;
  padding: 0;
}
.exi {
  padding: 14px 0 12px;
  border-top: 1px solid var(--line);
}
.exh {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.exn {
  min-width: 0;
}
.exn b {
  display: block;
  font-size: 17px;
  font-weight: 800;
  line-height: 1.25;
}
.exn span {
  display: block;
  font-size: 13px;
  color: var(--soft);
  margin-top: 2px;
}
.kg {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
  cursor: text;
}
.kg input {
  width: 70px;
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 6px;
  padding: 9px 10px;
  font: inherit;
  font-size: 17px;
  font-weight: 800;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.kg input::placeholder {
  color: var(--soft);
  font-weight: 600;
  opacity: 0.5;
}
.kg span {
  min-width: 24px;
  font-size: 13px;
  color: var(--soft);
  font-weight: 600;
}
.exs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.exm {
  flex: 1 1 150px;
  margin-left: 4px;
  font-size: 13px;
  line-height: 1.35;
  color: var(--soft);
}
.exm.up {
  color: var(--today);
  font-weight: 700;
}
.grips {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.grip {
  min-width: 0;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--soft);
  border-radius: 6px;
  padding: 8px 2px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.grip[aria-pressed="true"] {
  border-color: var(--ink);
  color: var(--ink);
}

/* Hoje: marcar cada exercício como feito. A caixinha enche com a cor do nível e o certinho é desenhado;
   no toque ela dá um pulo e solta um anel. A contagem e a barra do treino acompanham. */
.exn {
  flex: 1;
}
.exc {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin: -11px -12px -11px -10px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--on-done);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.exc::before,
.exc::after {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  border-radius: 7px;
}
.exc::before {
  box-shadow: inset 0 0 0 2px var(--soft);
  transition:
    background-color 0.18s,
    box-shadow 0.18s;
}
.exc::after {
  opacity: 0;
  box-shadow: 0 0 0 2px var(--done);
  pointer-events: none;
}
.exc svg {
  position: relative;
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 3.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 22;
  stroke-dashoffset: 22;
  transition: stroke-dashoffset 0.24s cubic-bezier(0.65, 0, 0.35, 1);
}
.exc[aria-pressed="true"]::before {
  background: var(--done);
  box-shadow: inset 0 0 0 2px var(--done);
}
.exc[aria-pressed="true"] svg {
  stroke-dashoffset: 0;
  transition-delay: 0.07s;
}
.exc:focus-visible {
  outline: none;
}
.exc:focus-visible::before {
  outline: 2px solid var(--today);
  outline-offset: 3px;
}
.exc.pop::before {
  animation: excPop 0.4s cubic-bezier(0.2, 0.7, 0.2, 1.35);
}
.exc.pop::after {
  animation: excRing 0.55s ease-out;
}
@keyframes excPop {
  0% {
    transform: scale(0.8);
  }
  55% {
    transform: scale(1.14);
  }
  100% {
    transform: none;
  }
}
@keyframes excRing {
  from {
    opacity: 0.7;
    transform: none;
  }
  to {
    opacity: 0;
    transform: scale(1.85);
  }
}
.exn b {
  transition: color 0.25s;
}
.exi.ok .exn b {
  color: var(--soft);
}
/* celular estreito: menos espaço entre a caixinha, o nome e o peso, pra o nome caber em menos linhas */
@media (max-width: 360px) {
  .exh {
    gap: 8px;
  }
  .exc {
    margin-right: -8px;
  }
  .kg span {
    min-width: 18px;
  }
}
/* contagem do treino: um tracinho por exercício, que enche quando ele é feito */
.plan .ex.all {
  color: var(--done);
  font-weight: 700;
}
.exp {
  display: flex;
  gap: 3px;
  margin: 8px 0 0;
}
.exp i {
  position: relative;
  flex: 1;
  height: 4px;
  border-radius: 2px;
  overflow: hidden;
  background: var(--line);
}
.exp i::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--done);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.exp i.on::after {
  transform: none;
}
/* tudo feito: um brilho passa uma vez pelo botão de terminar */
.go {
  position: relative;
  overflow: hidden;
}
.go.shine::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -45%;
  width: 45%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.5), transparent);
  animation: goShine 0.9s 0.15s ease-out both;
  pointer-events: none;
}
@keyframes goShine {
  to {
    transform: translateX(330%);
  }
}
/* Hoje: timer dos exercícios de tempo (prancha). O anel esvazia com o tempo da vez; nos 5 s pra ficar em
   posição ele fica na cor apagada, e nos 3 últimos segundos o número bate junto com o bipe. */
.tmb {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 8px 13px 8px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  cursor: pointer;
}
.tmb svg {
  width: 17px;
  height: 17px;
  color: var(--done);
}
.tmb.on {
  border-color: var(--done);
  box-shadow: inset 0 0 0 1px var(--done);
}
.tmr {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 12px 0 2px;
  padding: 12px 12px 12px 14px;
  border-radius: 14px;
  background: var(--paper2);
}
.tmr.new {
  animation: tmrIn 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
}
@keyframes tmrIn {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
}
.tmr-r {
  position: relative;
  flex: none;
  width: 64px;
  height: 64px;
}
.tmr-r svg {
  display: block;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.tmr-t,
.tmr-p {
  fill: none;
  stroke-width: 5;
}
.tmr-t {
  stroke: var(--line);
}
.tmr-p {
  stroke: var(--done);
  stroke-linecap: round;
  stroke-dasharray: 100;
  transition: stroke-dashoffset 0.2s linear;
}
.tmr.prep .tmr-p {
  stroke: var(--soft);
}
.tmr.pause .tmr-p,
.tmr.end .tmr-p {
  stroke-dashoffset: 0 !important;
}
.tmr-s {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 24px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.tmr.last .tmr-s {
  color: var(--done);
  animation: tmrBeat 1s ease-out infinite;
}
@keyframes tmrBeat {
  0% {
    transform: scale(1.22);
  }
  60%,
  100% {
    transform: none;
  }
}
.tmr.pause .tmr-r,
.tmr.end .tmr-r {
  animation: tmrDone 0.5s cubic-bezier(0.2, 0.7, 0.2, 1.35);
}
@keyframes tmrDone {
  from {
    transform: scale(0.88);
  }
}
.tmr-i {
  flex: 1;
  min-width: 0;
}
.tmr-m {
  display: block;
  font-size: 15px;
  font-weight: 800;
  line-height: 1.3;
}
.tmr.end .tmr-m {
  color: var(--done);
}
.tmr-d {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 5px;
}
.tmr-d i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px var(--soft);
  transition: background-color 0.2s;
}
.tmr-d i.on {
  background: var(--done);
  box-shadow: none;
}
.tmr-d em {
  margin-left: 4px;
  font-style: normal;
  font-size: 12px;
  font-weight: 700;
  color: var(--soft);
  font-variant-numeric: tabular-nums;
}
.tmr-a {
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
}
.tmr-go {
  min-height: 40px;
  padding: 9px 16px;
  border: 0;
  border-radius: 8px;
  background: var(--done);
  color: var(--on-done);
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}
.tmr-x {
  min-height: 40px;
  padding: 8px 6px;
  border: 0;
  background: none;
  color: var(--soft);
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

/* Hoje: corrida */
.runbtn {

.runcard {

.rc-a {

.rform .rin {

.rpace {

/* Aba Pesos */
.pw {
  border-top: 1px solid var(--line);
}
.pw:last-of-type {
  border-bottom: 1px solid var(--line);
}
.pw-h {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: none;
  border: 0;
  color: var(--ink);
  padding: 16px 2px 16px 0;
  cursor: pointer;
  text-align: left;
  font: inherit;
}
.pw-h span {
  flex: 1;
  min-width: 0;
}
.pw-h b {
  display: block;
  font-size: 18px;
  font-weight: 800;
}
.pw-h em {
  display: block;
  font-style: normal;
  font-size: 13px;
  color: var(--soft);
  margin-top: 2px;
}
.pw-h::after {
  content: "";

  width: 9px;

}

}
.pw-l {
  list-style: none;

}
.pw-l li {
  padding: 10px 0;

}
.pw-r {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.pw-n {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
}
button.pw-n {
  cursor: pointer;
}
.pw-n b {
  display: block;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.3;
}
.pw-n span {
  display: block;
  font-size: 12px;
  color: var(--soft);
  margin-top: 2px;
}
.ci {
  width: 14px;
  height: 14px;
  margin-left: 6px;
  vertical-align: -2px;
  color: var(--soft);
}
.pw-l li.open .ci {
  color: var(--done);
}

/* Aba Pesos: montar o treino (novo exercício, ordem, séries e excluir) */
.pe-new,
.pe-add {

  align-items: center;
  justify-content: center;

}

  width: 100%;
  margin: 2px 0 6px;

}
.pe-new svg,
.pe-add svg,
.pe-go svg,
.pe-rm svg {
  width: 18px;
  height: 18px;

}
.pe-go {
  display: inline-flex;

  gap: 8px;

}
.pe-n {

.pe-e {

.pe-l {

.pe-x {

  min-width: 0;

}

}

.pe-x span svg {

}
.pe-del {
  display: grid;

  flex: none;
  width: 42px;

  border-radius: 8px;

}
.pe-del svg {
  width: 20px;

}
.pe-del:hover,
.pe-del:focus-visible {

}
.pe-a {
  display: flex;
  gap: 10px;

}
.pe-add {

}
.pe-ok {

  border-radius: 8px;

  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}
.pe-l li.new {
  animation: peNew 1.8s ease-out;
}
@keyframes peNew {
  from {

  }
}
.pw.editing .pw-h em {

}
/* folha de exercício */
.sheet.still {
  animation: none;
}
.xs .sh-h {
  margin-bottom: 16px;
}
.xf {
  display: block;
  margin: 0 0 14px;
}
.xf-l {
  display: block;
  margin: 0 0 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--soft);
}
.xf input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink);
  padding: 12px;

  font-size: 16px;
}
.xs-sug {
  display: grid;
  gap: 6px;
  margin: -6px 0 14px;
}
.xs-sug:empty,
.xs-hint:empty,
.xs-err:empty {
  display: none;
}
.xs-s {
  display: block;
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.xs-s b {
  display: block;
  font-size: 15px;
  font-weight: 700;
}
.xs-s span {
  display: block;
  font-size: 12px;
  color: var(--soft);
}
.xs-hint {
  margin: -6px 0 14px;
  font-size: 13px;
  line-height: 1.4;
  color: var(--soft);
}
.xs-days {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.xs-day {
  min-width: 0;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.xs-day b {
  display: block;
  font-size: 14px;
  font-weight: 800;
}
.xs-day span {
  display: block;
  font-size: 12px;
  color: var(--soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.xs-day[aria-pressed="true"] {
  border-color: var(--done);
  background: color-mix(in srgb, var(--done) 14%, transparent);
  box-shadow: inset 0 0 0 1px var(--done);
}
.xs-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.stp {
  display: flex;
  align-items: center;
  gap: 4px;
}
.stp button {
  flex: none;
  width: 42px;
  height: 42px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 22px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
}
.stp output {
  flex: 1;
  min-width: 0;
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.xs-unit {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}
.xs-unit button {
  flex: 1;
  min-width: 0;
  padding: 6px 2px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--soft);
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.xs-unit button[aria-pressed="true"] {
  background: var(--paper2);
  color: var(--ink);
}
.xs-ch {
  margin-bottom: 0;
}
.chip:disabled {
  cursor: default;
  opacity: 0.45;
}
.chip[aria-pressed="true"]:disabled {
  opacity: 0.75;
}
.xs-err {
  margin: 0 0 12px;
}
.pe-rm {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  margin-top: 6px;
  padding: 12px;
  border: 0;
  background: none;
  color: var(--del);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
/* aviso embaixo, com desfazer */
.snack {
  position: fixed;
  z-index: 34;
  left: 50%;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: min(92vw, 420px);
  transform: translate(-50%, 16px);
  opacity: 0;
  transition:
    transform 0.25s cubic-bezier(0.2, 0.7, 0.2, 1),
    opacity 0.25s;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 8px 10px 16px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--bg);
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}
.snack.in {
  transform: translate(-50%, 0);
  opacity: 1;
}
.snack span {
  flex: 1;
  min-width: 0;
  line-height: 1.35;
}
.snack button {
  flex: none;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: inherit;
  font: inherit;
  font-weight: 800;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
/* Hoje: os dois links embaixo do botão de terminar */
.ck-a {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0 22px;
  margin-top: 6px;
}
.ck-a .swapl {
  margin: 0;
}

/* Gráfico de evolução */
.lc {
  margin: 12px 0 2px;
}
.lc-r {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-height: 24px;
  margin: 0 0 2px;
}
.lc-r b {
  font-size: 17px;
  font-weight: 800;
}
.lc-r span {
  font-size: 12px;
  color: var(--soft);
}
.lc svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  touch-action: pan-y;
  cursor: crosshair;
}
.lc svg:focus-visible {
  outline: 2px solid var(--today);
  outline-offset: 2px;
}
.lc-g {
  stroke: var(--line);
  stroke-width: 1;
}
.lc-t {
  fill: var(--soft);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}
.lc-l {
  fill: none;
  stroke: var(--done);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.lc-p,
.lc-h {
  fill: var(--done);
  stroke: var(--bg);
  stroke-width: 2;
}
.lc-x {
  stroke: var(--soft);
  stroke-width: 1;
}
.lc-goal {
  stroke: var(--soft);
  stroke-width: 1;
  stroke-dasharray: 4 4;
}
.lc-v {
  fill: var(--ink);
  font-size: 11px;
  font-weight: 700;
}
.lc-vb {
  fill: var(--soft);
}
.lc-tab {
  margin-top: 4px;
}
.lc-tab summary {
  cursor: pointer;
  padding: 6px 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--soft);
}
.lc-tab table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.lc-tab td {
  padding: 6px 0;
  border-top: 1px solid var(--line);
}
.lc-tab td:nth-child(2) {
  text-align: right;
  font-weight: 700;
}
.lc-tab td:nth-child(3) {
  width: 56px;
  text-align: right;
  color: var(--soft);
}
/* Progresso: painel geral */
.dash {
  outline: none;
}
.dash:focus-visible {
  outline: 2px solid var(--today);
  outline-offset: 4px;
}
.dk {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.dk div {

  min-width: 0;
}
.dk span {

  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--soft);
}
.dk b {
  display: block;
  margin-top: 2px;
  font-size: clamp(19px, 6.2vw, 24px);
  font-weight: 800;
  font-variation-settings: "wdth" 72;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dk em {
  display: block;
  margin-top: 2px;
  font-style: normal;
  font-size: 11px;
  line-height: 1.3;
  color: var(--soft);
}
.dr,
.yr-d {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 8px;
  align-items: baseline;
  min-height: 2.6em;
  margin: 14px 0 4px;
  font-size: 14px;
}
.dr b,
.yr-d b {
  font-weight: 800;
}
.dr span,
.yr-d span {
  color: var(--soft);
}
.dpn {
  margin-top: 10px;
}
.dph {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
}
.dph b {
  font-weight: 700;
}
.dph span {
  color: var(--soft);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.dash svg {
  display: block;
  max-width: 100%;
  height: auto;
  overflow: visible;
  touch-action: pan-y;
  cursor: pointer;
}
.dh {
  fill: var(--ink);
  opacity: 0.08;
}
.db {
  stroke: var(--line);
  stroke-width: 1;
}
.dg {
  stroke: var(--soft);

  stroke-dasharray: 3 4;
}
.dt,
.dx text {
  fill: var(--soft);

  font-weight: 700;
}
.dx text.dn {
  fill: var(--today);
}
.df {
  stroke: var(--line);
  stroke-width: 2;
  stroke-linecap: round;
}
.dv.c1 {
  fill: var(--done);
}
.dv.c2 {
  fill: var(--run);
}
.dl {
  fill: none;
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.dp {
  stroke: var(--bg);
  stroke-width: 2;
}
.dl.c3 {
  stroke: var(--ink);
}
.dp.c3 {
  fill: var(--ink);
}
.dl.c4 {
  stroke: var(--today);
}
.dp.c4 {
  fill: var(--today);
}
.de {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--soft);
}
.dnote {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--soft);
}
.lc-tab th {
  text-align: left;
  font-size: 12px;
  color: var(--soft);
  font-weight: 700;
  padding: 4px 0;
}
/* Progresso: treinos por ano (um quadradinho por dia) */
.yr-y {
  outline: none;
}
.yr-y:focus-visible {
  outline: 2px solid var(--today);
  outline-offset: 4px;
  border-radius: 4px;
}
.yr-y + .yr-y {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.yr-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 8px;
}
.yr-h b {
  font-size: 19px;
  font-weight: 900;
}
.yr-h span {
  font-size: 13px;
  font-weight: 700;
  color: var(--soft);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.yr svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  touch-action: pan-y;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.yr text {
  fill: var(--soft);
  font-size: 10px;
  font-weight: 700;
}
/* tons: da cor da linha (dia sem nada) até a cor do nível (dia mais pesado), em passos que o olho vê
   iguais (a mistura em oklab não embola os tons do meio como a mistura em srgb) */
.yc0 {
  --yc: var(--line);
}
.yc1 {
  --yc: color-mix(in oklab, var(--done) 30%, var(--line));
}
.yc2 {
  --yc: color-mix(in oklab, var(--done) 53%, var(--line));
}
.yc3 {
  --yc: color-mix(in oklab, var(--done) 76%, var(--line));
}
.yc4 {
  --yc: var(--done);
}
.yr path {
  fill: var(--yc);
}
.yr path.ycf {
  fill: var(--line);
  opacity: 0.4;
}
.yr rect.yh {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.5;
  pointer-events: none;
}
.yr-d {
  display: block;
  min-height: 0;
  margin: 10px 0 0;
}
.yr-d b {
  display: block;
}
.yr-k {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: 14px;
  font-size: 11px;
  font-weight: 700;
  color: var(--soft);
}
.yr-k span:first-child {
  margin-right: 4px;
}
.yr-k span:last-child {
  margin-left: 4px;
}
.yr-k i {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: var(--yc);
}
.yr .dnote {
  margin-top: 6px;
}
/* tabelas com vários números (painel geral e mês a mês): cada número alinhado à direita na sua
   coluna, com espaço entre um e outro (sem isso, 7,7 km e 79,4 kg viravam "7,779,4") */
.dash .lc-tab th:not(:first-child),
.dash .lc-tab td:not(:first-child),
.yr-tab th:not(:first-child),
.yr-tab td:not(:first-child) {
  width: auto;
  padding-left: 12px;
  text-align: right;
}
.lp-n {
  margin: 0 0 6px;
  font-size: 14px;
  color: var(--soft);
}
.lp-l {
  list-style: none;
  margin: 0;
  padding: 0;
}
.lp-l button,
.lp-x {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.lp-l span {
  flex: 1;
  min-width: 0;
}
.lp-l b {
  display: block;
  font-size: 15px;
  font-weight: 700;
}
.lp-l em {
  display: block;
  font-style: normal;
  font-size: 13px;
  color: var(--soft);
}
.lp-l svg {
  flex: none;
  width: 56px;
  height: 20px;
}
.lp-l polyline {
  fill: none;
  stroke: var(--done);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.lp-l i {
  flex: none;
  min-width: 64px;
  text-align: right;
  font-style: normal;
  font-weight: 800;
  font-size: 14px;
  color: var(--soft);
  font-variant-numeric: tabular-nums;
}
.lp-l i.up {
  color: var(--done);
}
.lc-one {
  margin: 10px 0 2px;
  font-size: 13px;
  line-height: 1.45;
  color: var(--soft);
}

/* Progresso: resumo da semana */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 18px 0 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.stat {
  border-left: 1px solid var(--line);
  padding: 12px 0 10px 14px;
}
.stat:first-child {
  border-left: 0;
  padding-left: 0;
}
.stat b {
  display: block;
  font-weight: 900;
  font-variation-settings: "wdth" 125;
  line-height: 1;
  letter-spacing: -0.02em;
  font-size: 24px;
}
.stat span {
  color: var(--soft);
  font-size: 12px;
}
.week {
  background: var(--paper);
  border-radius: 24px;
  padding: 22px;
}
.week .hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
}
.week .hd b {
  font-weight: 900;
  font-variation-settings: "wdth" 118;
  font-size: 19px;
}
.week .hd span {
  font-size: 13px;
  color: var(--soft);
  white-space: nowrap;
}
.wrows {
  list-style: none;
  margin: 0;
  padding: 0;
}
.wrows li {
  display: grid;
  grid-template-columns: 1fr auto 44px;
  gap: 12px;
  align-items: baseline;
  border-top: 1px solid var(--line);
  font-size: 15px;
  padding: 9px 0;
}
.wrows li b {
  font-weight: 900;
  font-variation-settings: "wdth" 115;
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-size: 16px;
}
.wrows .df {
  font-size: 12px;
  color: var(--soft);
  text-align: right;
}
.wrows .df.up {
  color: var(--done);
  font-weight: 700;
}
.cmp {
  margin: 0 0 4px;
  font-size: 12px;
  color: var(--soft);
}

/* Progresso: séries por músculo */
.vol {
  border-top: 1px solid var(--line);
  padding-top: 6px;
}
.vo-r {
  display: grid;
  grid-template-columns: 82px 1fr 64px;
  gap: 12px;
  align-items: center;
  padding: 8px 0;
}
.vo-r span {
  font-size: 14px;
}
.vo-b {
  height: 8px;
  background: var(--paper2);
}
.vo-b i {
  display: block;
  height: 100%;
  background: var(--done);
}
.vo-r b {
  text-align: right;
  font-size: 15px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.vo-r b small {
  font-size: 12px;
  color: var(--soft);
  font-weight: 600;
}
.vol p {
  margin: 8px 0 0;
  font-size: 13px;
  color: var(--soft);
}

/* Progresso: caminho até a primeira barra */
.pb {
  border-top: 1px solid var(--line);
}
.pb-s {
  list-style: none;
  margin: 0;
  padding: 0;
}
.pb-s li {
  padding: 11px 0;
}
.pb-s li + li {
  border-top: 1px solid var(--line);
}
.pb-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}
.pb-h b {
  font-size: 15px;
  font-weight: 700;
}
.pb-h span {
  flex: none;
  font-size: 13px;
  color: var(--soft);
  font-variant-numeric: tabular-nums;
}
.pb-s li.ok .pb-h span {
  color: var(--done);
  font-weight: 700;
}
.pb-b {
  height: 4px;
  margin-top: 8px;
  background: var(--paper2);
}
.pb-b i {
  display: block;
  height: 100%;
  background: var(--done);
}
.pb-t {
  margin: 20px 0 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--soft);
}
.pb-tip,
.pb-n {
  margin: 12px 0 0;
  font-size: 13px;
  line-height: 1.45;
  color: var(--soft);
}
.pb-tip {
  color: var(--ink);
}

/* Progresso: corridas */
.runs {
  background: var(--paper);
  border-radius: 24px;
  padding: 22px;
}
.runs .top {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.runs .top b {
  display: block;
  font-weight: 900;
  font-variation-settings: "wdth" 120;
  line-height: 1.05;
  font-size: 21px;
}
.runs .top span {
  font-size: 12px;
  color: var(--soft);
}
.rchart {
  width: 100%;
  height: 160px;
  display: block;
}
.rlist {
  list-style: none;
  padding: 0;
  margin: 14px 0 0;
}
.rlist li {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
}
.rlist li:last-child {
  border-bottom: 0;
}
.rlist li span {
  color: var(--soft);
}
.rgoal {
  margin: 16px 0 0;
  padding: 14px;
  border-radius: 16px;
  background: rgba(92, 184, 255, 0.12);
  color: var(--run);
}
.rgoal .rt {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-weight: 800;
  font-size: 15px;
}
.rgoal .rt span {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.rgoal .rb {
  height: 10px;
  border-radius: 5px;
  background: rgba(92, 184, 255, 0.18);
  margin: 10px 0 8px;
  overflow: hidden;
}
.rgoal .rb i {
  display: block;
  height: 100%;
  background: var(--run);
  border-radius: 5px;
}
.rgoal p {
  margin: 0;
  font-size: 13px;
  color: var(--soft);
}

/* Progresso: peso do corpo */
.weigh button {
  background: var(--done);
  color: var(--on-done);
}
.weigh {
  background: var(--paper);
  border-radius: 24px;
  padding: 22px;
}
.weigh p {
  margin: 0;
  font-size: 15px;
  color: var(--soft);
}
.weigh .row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 14px;
}
.weigh input {
  flex: 1;
}
.spark {
  width: 100%;
  height: 64px;
  margin-top: 14px;
  display: block;
  overflow: visible;
}
.wnext {
  margin-top: 6px !important;
  font-size: 13px !important;
  color: var(--today) !important;
}
.weigh .wprot {
  margin: 6px 0 0;
  font-size: 13px;
}
.spl {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--soft);
  margin-top: 4px;
}
.pj {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 16px;
  background: rgba(255, 181, 71, 0.1);
}
.pj span {
  display: block;
  font-size: 13px;
  color: var(--soft);
  font-weight: 600;
}
.pj b {
  display: block;
  font-weight: 900;
  font-variation-settings: "wdth" 118;
  color: var(--today);
  line-height: 1.1;
  margin-top: 2px;
  font-size: 22px;
}
.pj p {
  margin: 6px 0 0 !important;
  font-size: 13px !important;
  color: var(--soft);
}
.pj.off {
  background: var(--paper2);
}

/* Progresso: nível */
.lvl {
  margin: 22px 0 0;
}
.lv-top {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.lv-n {
  font-weight: 800;
  background: none;
  color: var(--today);
  padding: 0;
  font-size: 14px;
  border-radius: 0;
}
.lv-top b {
  flex: 1;
  font-weight: 900;
  font-variation-settings: "wdth" 115;
  font-size: 17px;
}
.lv-x {
  font-size: 14px;
  color: var(--soft);
  font-variant-numeric: tabular-nums;
}
.lv-bar {
  border-radius: 4px;
  background: var(--paper);
  margin-top: 10px;
  overflow: hidden;
  height: 4px;
}
.lv-bar i {
  display: block;
  height: 100%;
  background: var(--today);
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.lvl p {
  margin: 8px 0 0;
  font-size: 13px;
  color: var(--soft);
}
.lvlist {
  background: var(--paper);
  border-radius: 24px;
  padding: 10px 22px 20px;
}
.lvlist div {
  display: grid;
  gap: 10px;
  align-items: baseline;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  color: var(--soft);
  grid-template-columns: 46px 1fr auto;
}
.lvlist div span {
  font-weight: 800;
  font-size: 14px;
}
.lvlist div b {
  font-weight: 700;
  font-size: 16px;
}
.lvlist div em {
  font-style: normal;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.lvlist div.past {
  color: var(--ink);
}
.lvlist div.cur {
  color: var(--today);
}
.lvlist div.cur b {
  font-weight: 900;
}
.lvlist p {
  margin: 14px 0 0;
  font-size: 13px;
  color: var(--soft);
}
.lvdot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 8px;
  vertical-align: 0;
}
.lvt {
  display: block;
  margin: 18px 0 0;
}

/* Progresso: desafio da semana e conquistas */
.badges {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 16px;
}
.badge {
  border-radius: 20px;
  padding: 16px;
  background: var(--paper);
}
.badge b {
  font-weight: 800;
  font-variation-settings: "wdth" 110;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.badge span {
  font-size: 13px;
  color: var(--soft);
}
.badge.off {
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--line);
}
.badge.off b {
  color: var(--soft);
}
.badge.hit {
  background: var(--done);
  color: var(--on-done);
}
.badge.hit span {
  color: #3a1800;
}
.chal {
  display: grid;
  gap: 0;
  margin: 22px 0 0;
}
.ch-w {
  background: transparent;
  border-radius: 0;
  padding: 14px 0;
  border-top: 1px solid var(--line);
  box-shadow: none !important;
}
.chal span {
  display: block;
  font-size: 13px;
  color: var(--soft);
  font-weight: 600;
}
.chal b {
  display: block;
  font-size: 18px;
  font-weight: 800;
  font-variation-settings: "wdth" 110;
  line-height: 1.25;
  margin-top: 3px;
}
.ch-bar {
  border-radius: 4px;
  background: var(--paper2);
  margin: 12px 0 7px;
  overflow: hidden;
  height: 4px;
}
.ch-bar i {
  display: block;
  height: 100%;
  background: var(--done);
  border-radius: 4px;
}
.ch-w em {
  font-style: normal;
  font-size: 13px;
  color: var(--soft);
}
.ch-w.ok {
  box-shadow: inset 0 0 0 1.5px var(--done);
}
.ch-w.ok em {
  color: var(--done);
  font-weight: 700;
}
.h2n {
  font-size: 14px;
  font-weight: 600;
  color: var(--soft);
  margin-left: 6px;
  font-variation-settings: "wdth" 100;
}
.badge.sec {
  background: var(--ink);
  color: var(--bg);
}
.badge.sec span {
  color: #5a5048;
}
.badge.sec em {
  display: block;
  font-style: normal;
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 4px;
  color: var(--today);
  filter: none;
}
.ch-w.ok b {
  color: var(--done);
}
.badge,
.badge.off,
.badge.hit,
.badge.sec {
  background: transparent;
  border-radius: 0;
  padding: 12px 0;
  box-shadow: none;
  border-top: 1px solid var(--line);
  color: var(--ink);
}
.badge.hit b::before {
  content: "";
  width: 8px;
  height: 8px;
  background: var(--done);
  flex: none;
}
.badge.off b::before {
  content: "";
  width: 8px;
  height: 8px;
  box-shadow: inset 0 0 0 1px var(--soft);
  flex: none;
}
.badge.hit span,
.badge.sec span {
  color: var(--soft);
}

/* Calendário */
.board {
  padding: 4px 0 0;
}
.wk {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.wk.head span {
  font-size: 12px;
  color: var(--soft);
  text-align: center;
  padding-bottom: 6px;
}
.d {
  aspect-ratio: 1;
  background: var(--paper);
  border: 0;
  padding: 0;
  cursor: pointer;
  position: relative;
  border-radius: 3px;
}
.d.we {
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--line);
}
.d.on {
  background: var(--done);
}
.d.run::after {
  content: "";
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--run);
  box-shadow: 0 0 0 2px var(--bg);
}
.d.today {
  box-shadow: inset 0 0 0 2.5px var(--today);
}
.d.future {
  opacity: 0.5;
  cursor: pointer;
}
.d.last {
  opacity: 1;
  box-shadow: inset 0 0 0 2.5px var(--today);
}
.d.last:not(.on) {
  background: var(--today);
}
.legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--soft);
  margin-top: 14px;
}
.legend i {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 4px;
  vertical-align: -1px;
  margin-right: 6px;
}

.hist {
  list-style: none;
  padding: 0;
  margin: 0;
}
.hist li {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  font-size: 16px;
}
.hist li span {
  color: var(--soft);
  white-space: nowrap;
  font-size: 14px;
}
.d .ml {
  position: absolute;
  top: 3px;
  left: 4px;
  font-size: 9px;
  font-weight: 800;
  color: var(--soft);
  line-height: 1;
  pointer-events: none;
}
.d.on .ml {
  color: var(--on-done);
  opacity: 0.6;
}
.d.hol {
  box-shadow: inset 0 0 0 1.5px var(--run);
}
.d.hol.on {
  box-shadow: inset 0 0 0 2px var(--run);
}
.d .lk {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  color: var(--soft);
  opacity: 0.55;
}
.d.future .lk {
  opacity: 0.8;
}

/* Calendário: folha do dia */
.sheet-bg {
  position: fixed;
  inset: 0;
  z-index: 35;
  background: rgba(0, 0, 0, 0.55);
  animation: fadeIn 0.2s;
}
.sheet {
  position: fixed;
  z-index: 36;
  left: 0;
  right: 0;
  bottom: 0;
  max-width: 560px;
  margin: 0 auto;
  background: var(--paper);
  padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
  animation: sheetUp 0.28s cubic-bezier(0.2, 0.7, 0.2, 1);
  border-radius: 14px 14px 0 0;
  /* em celular baixo a folha rola por dentro em vez de passar da tela */
  max-height: calc(100% - 16px - env(safe-area-inset-top, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
}
.sh-grab {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--line);
  margin: 0 auto 16px;
}
.sh-h b {
  display: block;
  font-weight: 900;
  font-variation-settings: "wdth" 115;
  font-size: 19px;
}
.sh-h span {
  display: block;
  font-size: 13px;
  color: var(--soft);
  margin-top: 2px;
}
.sh-rows {
  margin-top: 14px;
}
.sh-r {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-top: 1px solid var(--line);
}
.sh-r span {
  display: block;
  font-size: 13px;
  color: var(--soft);
}
.sh-r b {
  display: block;
  font-size: 17px;
  font-weight: 800;
}
.sh-r button {
  border: 0;
  border-radius: 12px;
  padding: 11px 18px;
  font-weight: 800;
  cursor: pointer;
  min-width: 92px;
}
.sh-r button.on {
  background: var(--done);
  color: var(--on-done);
}
.sh-r button.off {
  background: transparent;
  color: var(--soft);
  box-shadow: inset 0 0 0 1px var(--line);
}
.sh-p {
  margin: 14px 0 0;
  font-size: 15px;
  color: var(--soft);
}
.sh-x {
  width: 100%;
  margin-top: 14px;
  border: 0;
  border-radius: 14px;
  padding: 14px;
  font-weight: 800;
  background: var(--paper2);
  color: var(--ink);
  cursor: pointer;
}
.sh-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 0 14px;
}
.sh-chips .chip {
  padding: 7px 10px;
  font-size: 13px;
}
/* Folha do dia: distância da corrida de qualquer dia */
.sh-r .lnk {
  display: block;
  min-width: 0;
  margin: 2px 0 0;
  padding: 4px 0 0;
  border-radius: 0;
  background: none;
  font-size: 13px;
  font-weight: 600;
}
.sh-rf {
  padding: 0 0 14px;
}

/* Comemorações: nível e conquista secreta */
.splash {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--bg);
  display: flex;
  align-items: center;
  cursor: pointer;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 28px
    calc(24px + env(safe-area-inset-bottom, 0px));
  transition: opacity 0.45s ease;
}
.splash.out {
  opacity: 0;
  pointer-events: none;
}
.sp-in {
  max-width: 520px;
  margin: 0 auto;
  width: 100%;
}
.sp-k {
  font-size: 14px;
  font-weight: 700;
  color: var(--done);
  margin-bottom: 20px;
}
.sp-q {
  margin: 0;
  font-weight: 900;
  font-variation-settings: "wdth" 118;
  line-height: 1.02;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-wrap: balance;
  font-size: clamp(30px, 8.5vw, 44px);
}
.sp-q span {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px);
  animation: spUp 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
}
.sp-bar {
  height: 3px;
  border-radius: 2px;
  background: var(--paper2);
  margin: 34px 0 14px;
  overflow: hidden;
}
.sp-bar i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--done);
  animation: spFill 3.1s linear forwards;
}
.sp-s {
  margin: 0;
  font-size: 15px;
  color: var(--soft);
  max-width: 34ch;
}
.sp-t {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  font-size: 12px;
  color: var(--soft);
}
.lvup .sp-k {
  color: var(--today);
}
/* a barra enche com a cor nova do app, a mesma que o texto diz */
.lvup .sp-bar {
  height: 6px;
}
.lvup .sp-bar i {
  background: var(--done);
}
.secup .sp-k {
  color: var(--ink);
}
.secup .sp-bar i {
  background: var(--ink);
}

/* Avisos: XP e salvo */
.xpt {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: min(92vw, 420px);
  transform: translate(-50%, 24px);
  opacity: 0;
  transition:
    transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1),
    opacity 0.35s;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 18px;
  cursor: pointer;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #161616;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
}
.xpt.in {
  transform: translate(-50%, 0);
  opacity: 1;
}
.xpt > b {
  font-weight: 900;
  font-variation-settings: "wdth" 120;
  white-space: nowrap;
  letter-spacing: -0.02em;
  font-size: 24px;
  color: var(--done);
}
.xt-m {
  flex: 1;
  min-width: 0;
}
.xt-m span {
  display: block;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.xt-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--line);
  margin: 7px 0 5px;
  overflow: hidden;
}
.xt-bar i {
  display: block;
  height: 100%;
  background: var(--today);
  border-radius: 3px;
  transition: width 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.25s;
}
.xt-m em {
  font-style: normal;
  font-size: 12px;
  color: var(--soft);
}
.saved {
  position: fixed;
  z-index: 40;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translate(-50%, -10px);
  opacity: 0;
  background: var(--paper2);
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  padding: 7px 14px;
  transition:
    opacity 0.3s,
    transform 0.3s;
  border-radius: 6px;
}
.saved.in {
  opacity: 1;
  transform: translate(-50%, 0);
}
.saved.err {
  background: #3a1214;
  border-color: #7a2a2e;
  color: #ffd6d6;
  width: min(92vw, 380px);
  border-radius: 16px;
  text-align: center;
  line-height: 1.35;
}

/* Retrospectiva: histórias em tela cheia */
.wr {
  --wr-bg: var(--bg);
  --wr-ink: var(--ink);
  /* a retrospectiva tem o visual dela, igual em todos os visuais do app */
  font-family:
    "Archivo",
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
  font-variation-settings: "wdth" 96;
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  background: var(--wr-bg);
  color: var(--wr-ink);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: pan-y;
  overflow: hidden;
  outline: none;
  transition:
    opacity 0.3s,
    background-color 0.45s,
    color 0.45s;
}
/* um círculo grande ao fundo, que muda de lugar a cada cor */
.wr::before {
  content: "";
  position: absolute;
  width: 120vmax;
  height: 120vmax;
  left: 40%;
  top: -75vmax;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.07;
  pointer-events: none;
  transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.wr.c-blue::before {
  transform: translate(-70%, 95%);
}
.wr.c-amber::before {
  transform: translate(-95%, 20%);
}
.wr.c-pink::before {
  transform: translate(-15%, 110%);
}
.wr.c-lime::before {
  transform: translate(-80%, 125%);
}
.wr.c-violet::before {
  transform: translate(-30%, 40%);
}
.wr.c-ink::before {
  transform: translate(-60%, 60%);
  opacity: 0.05;
}
.wr.out {
  opacity: 0;
  pointer-events: none;
}
/* cores fixas e fortes, com o texto escuro que contrasta mais (nos dois temas) */
.wr.c-done {
  --wr-bg: var(--wrc, #ff5a1f);
  --wr-ink: var(--wrc-ink, #150800);
}
.wr.c-blue {
  --wr-bg: #5cb8ff;
  --wr-ink: #03121f;
}
.wr.c-amber {
  --wr-bg: #ffb547;
  --wr-ink: #1f1100;
}
.wr.c-pink {
  --wr-bg: #ff6b9a;
  --wr-ink: #22040f;
}
.wr.c-lime {
  --wr-bg: #c4f25a;
  --wr-ink: #0f1a00;
}
.wr.c-violet {
  --wr-bg: #a98bff;
  --wr-ink: #12052b;
}
.wr-top,
.wr-body,
.wr-hint {
  position: relative;
  z-index: 1;
}
.wr-top {
  padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0;
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}
.wr-seg {
  display: flex;
  gap: 4px;
}
.wr-seg i {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.wr-seg i::before,
.wr-seg i::after {
  content: "";
  position: absolute;
  inset: 0;
  background: currentColor;
}
.wr-seg i::before {
  opacity: 0.28;
}
.wr-seg i::after {
  transform: scaleX(0);
  transform-origin: left;
}
.wr-seg i.f::after {
  transform: none;
}
.wr-seg i.a::after {
  animation: wrSeg var(--dur, 6.5s) linear forwards;
}
.wr.hold .wr-seg i.a::after {
  animation-play-state: paused;
}
.wr.calm .wr-seg i.a::after {
  animation: none;
  transform: none;
}
.wr-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 6px;
  padding-left: 4px;
}
.wr-tag {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wr-pos {
  font-size: 12px;
  font-weight: 700;
  opacity: 0.7;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.wr-x {
  background: none;
  border: 0;
  color: inherit;
  font: inherit;
  font-size: 20px;
  line-height: 1;
  padding: 12px;
  margin: -6px -8px -6px -4px;
  cursor: pointer;
}
.wr-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  padding: 10px 28px 6px;
}
/* centraliza quando cabe; em tela baixa, começa do topo e rola */
.wr-in {
  margin: auto 0;
  width: 100%;
  max-width: 520px;
  align-self: center;
  animation: wrIn 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.wr-end {
  margin: 0;
  height: calc(12px + env(safe-area-inset-bottom, 0px));
}
.wr-hint {
  margin: 0;
  padding: 6px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  min-height: calc(38px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  opacity: 0.65;
}
.wr-sun {
  display: block;
  width: 92px;
  height: 92px;
  margin: 0 0 22px -6px;
  animation: wrSpin 30s linear infinite;
}
.wr-k {
  margin: 0 0 10px;
  font-size: 17px;
  font-weight: 800;
  line-height: 1.3;
  opacity: 0.85;
}
.wr-big {
  margin: 0;
  font-size: clamp(64px, 21vw, 112px);
  font-weight: 900;
  font-variation-settings: "wdth" 125;
  line-height: 0.92;
  letter-spacing: -0.04em;
  overflow-wrap: normal; /* o app diminui a letra até a palavra caber */
}
.wr-big.md {
  font-size: clamp(44px, 13vw, 76px);
  line-height: 0.98;
  letter-spacing: -0.03em;
}
.wr-big.sm {
  font-size: clamp(34px, 10vw, 56px);
  line-height: 1.02;
  letter-spacing: -0.02em;
  font-variation-settings: "wdth" 112;
}
.wr-big small {
  display: block;
  margin-top: 10px;
  font-size: clamp(20px, 6vw, 28px);
  line-height: 1.15;
  letter-spacing: -0.01em;
  font-variation-settings: "wdth" 108;
}
.wr-n {
  font-variant-numeric: tabular-nums;
}
.wr-sub {
  margin: 16px 0 0;
  max-width: 34ch;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.38;
}
.wr-vis {
  margin-top: 24px;
}
.wr-vis svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
.wr-note {
  margin: 14px 0 0;
  max-width: 40ch;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  opacity: 0.7;
}
/* calendário do período */
.wr-heat .on {
  fill: currentColor;
}
.wr-heat .no {
  fill: currentColor;
  opacity: 0.18;
}
.wr-heat .of {
  fill: none;
  stroke: currentColor;
  stroke-opacity: 0.35;
  stroke-width: 1.5;
}
.wr-heat .fu {
  fill: currentColor;
  opacity: 0.06;
}
.wr-heat .td {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
}
.wr-heat .on,
.wr-heat .no {
  transform-box: fill-box;
  transform-origin: center;
  animation: wrPop 0.4s cubic-bezier(0.2, 0.7, 0.2, 1.3) both;
  animation-delay: var(--d, 0ms);
}
.wr-heat text {
  fill: currentColor;
  font-size: 11px;
  font-weight: 800;
}
.wr-heat text.h {
  font-size: 12px;
  opacity: 0.7;
}
.wr-heat text.n {
  font-size: 10px;
  opacity: 0.75;
}
.wr-heat text.n.on {
  fill: var(--wr-bg);
  opacity: 1;
  animation: none;
}
/* barras deitadas */
.wr-bars {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 12px;
}
.wr-bars li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: 12px;
  row-gap: 5px;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.25;
}
.wr-bars span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wr-bars b {
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.wr-bars i {
  grid-column: 1 / -1;
  display: block;
  height: 10px;
  width: var(--w);
  min-width: 4px;
  background: currentColor;
  border-radius: 0 4px 4px 0;
  opacity: 0.4;
  transform-origin: left;
  animation: wrGrow 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: var(--d, 0ms);
}
.wr-bars li.top i {
  opacity: 1;
}
/* colunas dos dias da semana */
.wr-cols {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.wr-cols div {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.wr-cols b {
  min-height: 1.25em;
  font-size: 14px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  opacity: 0.75;
}
.wr-cols em {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
  height: 112px;
}
.wr-cols i {
  display: block;
  width: 62%;
  max-width: 30px;
  height: var(--h);
  min-height: 3px;
  background: currentColor;
  border-radius: 4px 4px 0 0;
  opacity: 0.4;
  transform-origin: bottom;
  animation: wrRise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: var(--d, 0ms);
}
.wr-cols span {
  font-size: 13px;
  font-weight: 800;
}
.wr-cols .top i,
.wr-cols .top b {
  opacity: 1;
}
/* linhas e barras em svg */
.wr-sp .l {
  fill: none;
  stroke: currentColor;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: wrDraw 1.1s 0.15s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
.wr-sp circle {
  fill: var(--wr-bg);
  stroke: currentColor;
  stroke-width: 2.5;
}
.wr-sp circle.e {
  fill: currentColor;
}
.wr-sp text {
  fill: currentColor;
  font-size: 14px;
  font-weight: 900;
}
.wr-sp text.d {
  font-size: 12px;
  font-weight: 700;
  opacity: 0.75;
}
.wr-sp .base {
  stroke: currentColor;
  stroke-opacity: 0.35;
  stroke-width: 1;
}
.wr-run .bar {
  fill: currentColor;
  opacity: 0.4;
  transform-box: fill-box;
  transform-origin: bottom;
  animation: wrRise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: var(--d, 0ms);
}
.wr-run .bar.top {
  opacity: 1;
}
.wr-mini {
  list-style: none;
  margin: 18px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.wr-mini li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
  font-weight: 700;
  padding-top: 6px;
  border-top: 1px solid;
  border-color: color-mix(in srgb, currentColor 30%, transparent);
}
.wr-mini b {
  white-space: nowrap;
  font-weight: 900;
}
/* sequência: uma bolinha por dia */
.wr-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.wr-dots i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: currentColor;
  animation: wrPop 0.35s cubic-bezier(0.2, 0.7, 0.2, 1.4) both;
  animation-delay: var(--d, 0ms);
}
/* níveis: as 10 cores, a atual em destaque */
.wr-lv {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.wr-lv i {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  opacity: 0.28;
}
.wr-lv i.p {
  opacity: 1;
}
.wr-lv i.c {
  opacity: 1;
  width: 30px;
  height: 30px;
  box-shadow:
    0 0 0 3px var(--wr-bg),
    0 0 0 5px currentColor;
  margin: 0 3px;
}
.wr-chips {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.wr-chips li {
  border: 2px solid currentColor;
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 14px;
  font-weight: 800;
}
/* barras de meta e de projeção */
.wr-pbar {
  position: relative;
  height: 12px;
  border-radius: 0 4px 4px 0;
  overflow: hidden;
}
.wr-pbar::before {
  content: "";
  position: absolute;
  inset: 0;
  background: currentColor;
  opacity: 0.2;
}
.wr-pbar i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  background: currentColor;
  border-radius: 0 4px 4px 0;
  transform-origin: left;
  animation: wrGrow 0.9s 0.1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.wr-proj {
  position: relative;
  height: 18px;
}
.wr-proj .wr-pbar {
  position: absolute;
  inset: 0;
  height: auto;
}
.wr-proj .wr-pbar.p::before {
  opacity: 0.2;
}
.wr-proj .wr-pbar.p i {
  opacity: 0.45;
}
.wr-proj .wr-pbar:not(.p)::before {
  display: none;
}
.wr-pl {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
  font-size: 13px;
  font-weight: 800;
}
.wr-goal {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 16px;
}
.wr-goal li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px 12px;
  font-size: 15px;
  font-weight: 700;
}
.wr-goal b {
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.wr-goal .wr-pbar {
  grid-column: 1 / -1;
}
/* resumo final, pra print */
.wr-post {
  border: 2px solid currentColor;
  border-radius: 18px;
  padding: 18px 18px 14px;
}
.wp-h span {
  display: block;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0.75;
}
.wp-h b {
  display: block;
  margin-top: 6px;
  font-size: clamp(30px, 9vw, 40px);
  font-weight: 900;
  font-variation-settings: "wdth" 120;
  line-height: 1;
  letter-spacing: -0.02em;
}
.wp-h em {
  display: block;
  margin-top: 6px;
  font-style: normal;
  font-size: 13px;
  font-weight: 700;
  opacity: 0.75;
}
.wp-g {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 12px;
  margin: 18px 0 0;
}
.wp-g dt {
  font-size: 12px;
  font-weight: 800;
  opacity: 0.75;
}
.wp-g dd {
  margin: 2px 0 0;
  font-size: 30px;
  font-weight: 900;
  font-variation-settings: "wdth" 110;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.wp-l {
  list-style: none;
  margin: 16px 0 0;
  padding: 12px 0 0;
  border-top: 1.5px solid currentColor;
  display: grid;
  gap: 7px;
}
.wp-l li {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
  font-size: 14px;
  line-height: 1.3;
}
.wp-l li span {
  flex: none;
  font-weight: 700;
  opacity: 0.75;
}
.wp-l li b {
  text-align: right;
  font-weight: 800;
}
.wp-f {
  margin: 12px 0 0;
  font-size: 11px;
  font-weight: 800;
  opacity: 0.65;
}
.wr-tip {
  margin: 14px 0 0;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
}
.wr-btns {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.wr-btns button {
  flex: 1;
  border: 0;
  border-radius: 6px;
  padding: 14px 12px;
  font: inherit;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}
.wr-btns button[data-wr="again"] {
  background: transparent;
  color: inherit;
  box-shadow: inset 0 0 0 2px currentColor;
}
.wr-btns button[data-wr="close"] {
  background: var(--wr-ink);
  color: var(--wr-bg);
}

/* tela baixa: tudo um pouco menor pra caber sem rolar */
@media (max-height: 660px) {
  .wr-body {
    padding-top: 4px;
  }
  .wr-sun {
    width: 64px;
    height: 64px;
    margin-bottom: 12px;
  }
  .wr-k {
    font-size: 15px;
    margin-bottom: 6px;
  }
  .wr-big {
    font-size: clamp(52px, 17vw, 96px);
  }
  .wr-big small {
    margin-top: 6px;
  }
  .wr-sub {
    margin-top: 10px;
    font-size: 16px;
  }
  .wr-vis {
    margin-top: 14px;
  }
  .wr-bars {
    gap: 7px;
  }
  .wr-bars li {
    row-gap: 3px;
    font-size: 14px;
  }
  .wr-bars i {
    height: 8px;
  }
  .wr-cols em {
    height: 84px;
  }
  .wr-mini {
    margin-top: 10px;
  }
  .wr-post {
    padding: 14px 14px 10px;
  }
  .wp-g {
    gap: 8px 12px;
    margin-top: 10px;
  }
  .wp-g dd {
    font-size: 24px;
  }
  .wp-h b {
    font-size: clamp(26px, 8vw, 34px);
  }
  .wp-f {
    margin-top: 8px;
  }
  .wp-l {
    margin-top: 10px;
    padding-top: 8px;
    gap: 3px;
  }
  .wp-l li {
    font-size: 13px;
  }
  .wr-tip {
    margin-top: 8px;
    font-size: 14px;
  }
  .wr-btns {
    margin-top: 8px;

/* Progresso: retrospectivas */
.rcp-v {
  position: relative;
  display: block;
  width: 100%;
  overflow: hidden;
  border: 0;
  border-radius: 8px;
  padding: 16px 96px 16px 16px;
  background: var(--done);
  color: var(--on-done);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.rcp-k {
  display: block;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0.8;
}
.rcp-v b {
  display: block;
  margin-top: 2px;
  font-size: 28px;
  font-weight: 900;
  font-variation-settings: "wdth" 120;
  line-height: 1.05;
  letter-spacing: -0.02em;
}
.rcp-v em {
  display: block;
  margin-top: 6px;
  font-style: normal;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
}
.rcp-v svg {
  position: absolute;
  right: -18px;
  top: 50%;
  width: 104px;
  height: 104px;
  margin-top: -52px;
  opacity: 0.9;
}
.rcp-m {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.rcp-m .chip small {
  font-size: 13px;
  color: var(--soft);
}

/* Hoje: aviso de retrospectiva nova */
.rcc {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 14px 0 0;
  padding: 14px 12px 14px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.rcc div {
  flex: 1;
  min-width: 0;
}
.rcc span {
  display: block;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--soft);
}
.rcc b {
  display: block;
  margin-top: 2px;
  font-size: 17px;
  font-weight: 900;
  font-variation-settings: "wdth" 112;
  line-height: 1.25;
}
.rcc em {
  display: block;
  margin-top: 4px;
  font-style: normal;
  font-size: 14px;
  line-height: 1.4;
}
.rcc-go {
  flex: none;
  border: 0;
  border-radius: 6px;
  padding: 11px 16px;
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  background: var(--done);
  color: var(--on-done);
  cursor: pointer;
  white-space: nowrap;
}
.rcc-x {
  flex: none;
  background: none;
  border: 0;
  color: var(--soft);
  font: inherit;
  font-size: 16px;
  padding: 10px 8px;
  margin: -4px -4px -4px -8px;
  cursor: pointer;
}
.rcc.big {
  flex-direction: column;
  align-items: stretch;
  gap: 14px;
  padding: 18px;
  border: 0;
  background: var(--done);
  color: var(--on-done);
}
.rcc.big span {
  color: inherit;
  opacity: 0.8;
}
.rcc.big b {
  font-size: 24px;
}
.rcc.big .rcc-go {
  background: var(--on-done);
  color: var(--done);
  padding: 14px 16px;
  font-size: 16px;
}
/* cabeçalho depois de 21/12 */
.count.sun b {
  color: var(--today);
}

/* Peças compartilhadas: cartões, barras, números e botões */
.rin input,
.weigh input {
  min-width: 0;
  border: 1.5px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 14px;
  padding: 13px;
  font: inherit;
  font-size: 16px;
}
.rin button,
.weigh button {
  border: 0;
  border-radius: 14px;
  padding: 13px 18px;
  font-weight: 800;
  cursor: pointer;
}
.go,
.chip,
.d,
.badge,
.prog i,
.nav button,
.ch-bar i,
.done-msg {
  transition:
    background-color 0.6s,
    color 0.6s,
    border-color 0.6s;
}
.nav button:active,
.d:active {
  transform: scale(0.94);
}
.count b,
.stat b,
.runs .top b,
.week .hd b,
.yr-h b,
.wrows li b,
.pj b,
.lv-x {
  font-variation-settings: "wdth" 78;
  font-weight: 800;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.check,
.week,
.runs,
.weigh,
.lvlist {
  background: transparent;
  border-radius: 0;
  padding: 14px 0 0;
  border-top: 1px solid var(--line);
  box-shadow: none;
}
.runcard,
.pj,
.rgoal,
.confirm {
  border-radius: 8px;
}
.sh-r button,
.confirm button,
.rin button,
.weigh button,
.wrem button,
.sh-x {
  border-radius: 6px;
}
.rin input,
.weigh input,
.wrem input {
  border-radius: 6px;
  border-width: 1px;
}
.prog,
.prog i,
.lv-bar,
.lv-bar i,
.rgoal .rb,
.rgoal .rb i,
.ch-bar,
.ch-bar i,
.xt-bar,
.xt-bar i,
.sp-bar,
.sp-bar i {
  border-radius: 0;
}

/* ================= Visuais do app =================
   Três visuais por cima do original, escolhidos no Progresso. Cada um tem tema claro e escuro e as
   próprias cores de nível (definidas no app). A retrospectiva mantém o visual dela em todos. */

/* ---------- Maré: claro, cor de mar, cartões redondos; o sol anda no horizonte até o verão ---------- */
:root[data-skin="mare"][data-theme="light"] {
  --bg: #e6f1f1;
  --sky: #cfe9ec;
  --paper: #ffffff;
  --paper2: #dcecec;
  --line: #cfe1e2;
  --ink: #0d3b4f;
  --soft: #567c89;
  --today: #d97f00;
  --run: #d4483b;
}
:root[data-skin="mare"][data-theme="dark"] {
  --bg: #052230;
  --sky: #0a3a4d;
  --paper: #0a3141;
  --paper2: #0f3c4f;
  --line: #17495c;
  --ink: #e2f2f1;
  --soft: #88aeb8;
  --today: #ffc24d;
  --run: #ff7a66;
}
:root[data-skin="mare"] body {
  font-family:
    "Bricolage Grotesque",
    system-ui,
    -apple-system,
    sans-serif;
  background: linear-gradient(180deg, var(--sky) 0, var(--bg) 280px) no-repeat var(--bg);
}
:root[data-skin="mare"] :where(:not(.wr, .wr *)) {
  font-variation-settings: normal;
}
:root[data-skin="mare"] h2:where(:not(.wr *)) {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 30px 0 10px 4px;
}
:root[data-skin="mare"] h2.first {
  margin-top: 22px;
}
:root[data-skin="mare"] .count b {
  font-size: 60px;
  font-weight: 800;
  letter-spacing: -0.045em;
}
:root[data-skin="mare"] .top.small .count b {
  font-size: 34px;
}
:root[data-skin="mare"] .count span {
  font-weight: 600;
}
/* horizonte: a linha é o caminho até o verão e o sol mostra onde você está */
:root[data-skin="mare"] .prog {
  height: 2px;
  margin-top: 26px;
  overflow: visible;
  border-radius: 0;
  background: var(--line);
}
:root[data-skin="mare"] .top.small .prog {

}

}

  position: absolute;

}
:root[data-skin="mare"] .top.small .prog i::after {

:root[data-skin="mare"]

:root[data-skin="mare"] :is(.miss, .holi, .wrem, .rcc, .check, .runblk) {

:root[data-skin="mare"] .w7 {

}
:root[data-skin="mare"] .w7-m {

:root[data-skin="mare"] .lv-x {

/* ---------- Anilha: piso de borracha, letra condensada e as cores das anilhas ---------- */
:root[data-skin="anilha"][data-theme="dark"] {
  --bg: #1c1e21;
  --paper: #25282c;
  --paper2: #2f3338;
  --line: #3a3f45;
  --ink: #f2f2ee;
  --soft: #9ca2a9;
  --today: #f2c230;
  --run: #4a86f0;
  --fleck: rgba(255, 255, 255, 0.045);

}
:root[data-skin="anilha"][data-theme="light"] {
  --bg: #e8e9e5;
  --paper: #f8f8f6;
  --paper2: #dddfdb;
  --line: #ccd0cb;
  --ink: #1c1e21;
  --soft: #5d636a;

/* ---------- Caderno: folha pautada com margem; o que você escreve sai à caneta ---------- */
:root[data-skin="caderno"][data-theme="light"] {
  --bg: #fdfdfb;
  --paper: #fdfdfb;
  --paper2: #eef3fa;
  --line: #d3e2f4;
  --ink: #262626;
  --soft: #6b7280;
  --today: #c2410c;
  --run: #2e7d32;
  --rule: #d6e4f5;
  --margin: #f0a39a;
  --mark: rgba(255, 230, 0, 0.5);
  --note: #fff6a8;
}
/* no escuro, a folha vira lousa: verde, giz e as cores de giz */
:root[data-skin="caderno"][data-theme="dark"] {
  --bg: #22382e;
  --paper: #22382e;
  --paper2: #2b4538;
  --line: #3d5a4b;
  --ink: #efeee6;
  --soft: #a9bdb1;
  --today: #f6e27f;
  --run: #9fd3f5;
  --rule: rgba(255, 255, 255, 0.045);
  --margin: transparent;
  --mark: rgba(246, 226, 127, 0.25);
  --note: #2f4b3d;
}
:root[data-skin="caderno"] body {
  background-color: var(--bg);
  background-image: repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px);
}
:root[data-skin="caderno"][data-theme="dark"] body {
  background-image:
    radial-gradient(ellipse at 18% 8%, rgba(255, 255, 255, 0.06), transparent 42%),
    radial-gradient(ellipse at 85% 55%, rgba(255, 255, 255, 0.045), transparent 46%),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px);
}
:root[data-skin="caderno"] main {
  background: linear-gradient(90deg, transparent 9px, var(--margin) 9px 10.5px, transparent 10.5px);
}
:root[data-skin="caderno"]
  :is(
    h2:where(:not(.wr *)),
    .count b,
    .w7-a b,
    .plan .w,
    .done-msg,
    .dk b,
    .wrows li b,
    .week .hd b,
    .yr-h b,
    .runs .top b,
    .pj b,
    .lv-x,
    .lv-top b,
    .runcard b,
    .ms-h b,
    .wrem b,
    .holi b,
    .rcc b,
    .rcp-v b,
    .sh-h b,
    .pw-h b,
    .go,
    .kg input,
    .xf input,
    .rin input,
    .weigh input,
    .wrem input

  font-family: "Kalam", "Comic Neue", cursive;
  font-variation-settings: normal;
  letter-spacing: 0;
}
/* título escrito à mão e marcado com marca-texto */
:root[data-skin="caderno"] h2:where(:not(.wr *)) {
  display: table;
  font-size: 25px;
  font-weight: 700;
  line-height: 1.15;
  padding: 0 6px;
  margin-left: -6px;
  background: linear-gradient(transparent 55%, var(--mark) 55% 92%, transparent 92%);
}
:root[data-skin="caderno"] .count b {
  font-size: 58px;
  font-weight: 700;
  color: var(--done);
  line-height: 0.95;
}
:root[data-skin="caderno"] .top.small .count b {
  font-size: 34px;
}
:root[data-skin="caderno"] .prog {
  height: 10px;
  border-radius: 5px;
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--soft);
}
:root[data-skin="caderno"] .prog i {
  border-radius: 5px;

}
:root[data-skin="caderno"] .prog s {

}
:root[data-skin="caderno"] .w7 {

:root[data-skin="caderno"] .w7-a b {

/* a semana como quadradinhos de caderno: dia treinado ganha um X à caneta */

:root[data-skin="caderno"] .ms-h b,
:root[data-skin="caderno"] .wrem b,

:root[data-skin="caderno"] .dk {

:root[data-skin="caderno"][data-theme="dark"] .dk {

}
:root[data-skin="caderno"] .dk b {
  font-size: 27px;
  font-weight: 700;

}
:root[data-skin="caderno"] .dk div {

}
:root[data-skin="caderno"] .rcp-v {
  border-radius: 4px;
}
:root[data-skin="caderno"] .rcp-v b {
  font-size: 32px;
}
:root[data-skin="caderno"] .pw-h b {
  font-size: 22px;
  font-weight: 700;
}
:root[data-skin="caderno"] .d {

}
:root[data-skin="caderno"] .nav {
  border-top: 1.5px solid var(--line);
  background: color-mix(in srgb, var(--bg) 94%, transparent);

:root[data-skin="caderno"] .nav button span {

    cursive;

:root[data-skin="caderno"] .nav button[aria-current="page"]::before {
  top: auto;
  bottom: 2px;
  left: 32%;
  right: 32%;

}

/* calendário dentro de cartão: o dia útil vazio precisa aparecer contra o fundo do cartão */
:root[data-skin="mare"] .d:not(.on):not(.we):not(.last),
:root[data-skin="anilha"] .d:not(.on):not(.we):not(.last) {
  background: var(--paper2);
}
:root[data-skin="caderno"] .d:not(.on):not(.we):not(.last) {
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--line);
}
:root[data-skin="caderno"] .d.today {
  box-shadow: inset 0 0 0 2.5px var(--today);
}
/* exercício feito em cada visual: na Maré a caixinha é redonda e o anel parece uma onda; na Anilha é
   quadrada, com o certinho mais grosso; no Caderno é o quadradinho da folha, com o certinho à caneta e o
   nome riscado */
:root[data-skin="mare"] .exc::before,
:root[data-skin="mare"] .exc::after {
  border-radius: 50%;
}
:root[data-skin="anilha"] .exc::before,
:root[data-skin="anilha"] .exc::after {
  border-radius: 4px;
}
:root[data-skin="anilha"] .exc::before {
  box-shadow: inset 0 0 0 2.5px var(--soft);
}
:root[data-skin="anilha"] .exc svg {
  stroke-width: 3.8;
}
:root[data-skin="caderno"] .exc::before,
:root[data-skin="caderno"] .exc::after {
  border-radius: 3px;
}
:root[data-skin="caderno"] .exc {
  color: var(--done);
}
:root[data-skin="caderno"] .exc::before {
  box-shadow: inset 0 0 0 1.5px var(--soft);
  transform: rotate(-2deg);
}
:root[data-skin="caderno"] .exc[aria-pressed="true"]::before {
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--done);
}
:root[data-skin="caderno"] .exc svg {
  width: 22px;
  height: 22px;
  stroke-width: 2.6;
  transform: rotate(-6deg) translate(2px, -3px);
}
:root[data-skin="caderno"] .exn b {
  text-decoration: line-through 2px transparent;
  transition:
    color 0.25s,
    text-decoration-color 0.3s;
}
:root[data-skin="caderno"] .exi.ok .exn b {
  text-decoration-color: var(--done);
}
:root[data-skin="caderno"] .exp i {
  height: 6px;
  border-radius: 1px;
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--soft);
}
:root[data-skin="caderno"] .exp i::after {
  background: repeating-linear-gradient(-45deg, var(--done) 0 2px, transparent 2px 4px);
}
:root[data-skin="anilha"] .exp i {
  height: 6px;
  border-radius: 1px;
}
:root[data-skin="mare"] .exp i {
  height: 5px;
  border-radius: 3px;
}
/* timer em cada visual */
:root[data-skin="mare"] .tmr {
  border-radius: 20px;
}
:root[data-skin="mare"] .tmr-go {
  border-radius: 999px;
}
:root[data-skin="anilha"] .tmb,
:root[data-skin="anilha"] .tmr,
:root[data-skin="anilha"] .tmr-go {
  border-radius: 4px;
}
:root[data-skin="anilha"] .tmr-s,
:root[data-skin="anilha"] .tmr-go {
  font-variation-settings: "wdth" 66;
}
:root[data-skin="anilha"] .tmr-s {
  font-size: 28px;
}
:root[data-skin="anilha"] .tmr-go {
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
:root[data-skin="caderno"] .tmb {
  border: 1.5px solid var(--soft);
  border-radius: 18px;
}
:root[data-skin="caderno"] .tmr {
  background: transparent;
  border: 1.5px dashed var(--soft);
  border-radius: 10px;
}
:root[data-skin="caderno"] :is(.tmr-s, .tmr-m, .tmr-go) {
  font-family: "Kalam", "Comic Neue", cursive;
  font-weight: 700;
}
:root[data-skin="caderno"] .tmr-s {

  color: var(--done);
}
:root[data-skin="caderno"] .tmr-go {
  font-size: 18px;
  background: var(--mark);
  color: var(--ink);
  box-shadow: inset 0 0 0 1.5px var(--ink);
}
/* montar o treino em cada visual */
:root[data-skin="mare"] :is(.xs-day, .xs-s) {
  border-radius: 14px;
}
:root[data-skin="mare"] .snack {
  border-radius: 16px;
}
:root[data-skin="mare"] .pe-new {

}
:root[data-skin="mare"] .pw.editing {

  letter-spacing: 0.03em;
}
:root[data-skin="anilha"] .pw.editing {

}
:root[data-skin="caderno"] .pe-ok {
